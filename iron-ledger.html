<script>
/* ============================================================
   PHYSIQUE
   One parametric bodybuilder, drawn from eight development
   values (0..1). The coach roster and the user's own character
   share the renderer, so they read as the same species.
   For the character those values are EARNED from the log —
   only the cosmetics are chosen.
   ============================================================ */
const DEV_KEYS  = ['delts','chest','back','traps','arms','abs','legs','calves'];
const DEV_LABEL = { delts:'Shoulders', chest:'Chest', back:'Back', traps:'Traps & spine',
                    arms:'Arms', abs:'Midsection', legs:'Legs', calves:'Calves' };
const devFlat = v => DEV_KEYS.reduce((a,k) => (a[k] = v, a), {});

const SKINS    = ['#f4d0aa','#e8b48c','#d99b6c','#c98a5e','#b87850','#a9663d','#8d5228','#61401f'];
const HAIRCOLS = ['#141414','#2b2118','#3b2f2a','#6b4423','#8a5a2b','#c19a5b','#9aa8b4','#ececec','#7a2f1f','#2f5c8a'];
const HAIRS    = ['buzz','crew','short','slick','flattop','curly','afro','cornrows',
                  'long','ponytail','topknot','mullet','dreads','bald'];
const HAIR_N   = { buzz:'Buzz', crew:'Crew cut', short:'Short', slick:'Slicked back',
                   flattop:'Flat top', curly:'Curls', afro:'Afro', cornrows:'Cornrows',
                   long:'Long', ponytail:'Ponytail', topknot:'Top knot', mullet:'Mullet',
                   dreads:'Dreads', bald:'Bald' };
const BEARDS   = ['none','stubble','stache','goatee','full'];
const BEARD_N  = { none:'Clean', stubble:'Stubble', stache:'Moustache', goatee:'Goatee', full:'Full beard' };
const ACCS     = ['none','shades','headband','cap','belt','wraps','chain'];
const ACC_N    = { none:'None', shades:'Shades', headband:'Headband', cap:'Cap',
                   belt:'Lifting belt', wraps:'Wrist wraps', chain:'Chain' };
const TRUNKS   = ['#c8102e','#0057b8','#ffd100','#009639','#8b1f8b','#d95926','#1baf7a','#15191e','#e8e8e8','#4a3aa7'];
const POSES    = ['relaxed','flex','abs','sidetri','sidechest','back','most','lat','cross'];
const TATTOOS  = ['none','band','half','sleeve','chest','both','back','legs','full'];
const TATTOO_N = { none:'No ink', band:'Upper-arm band', half:'Half sleeve', sleeve:'Full sleeve',
                   chest:'Chest piece', both:'Sleeve + chest', back:'Back piece',
                   legs:'Leg bands', full:'Full blackwork' };
/* Which regions an option inks, and how far down the arm it runs. Keeping this
   as a table rather than a chain of string comparisons means a new style is one
   line here plus its artwork. */
const INK = {
  none:   {},
  band:   { arm:'band' },
  half:   { arm:'half' },
  sleeve: { arm:'sleeve' },
  chest:  { chest:1 },
  both:   { arm:'sleeve', chest:1 },
  back:   { back:1 },
  legs:   { legs:1 },
  full:   { arm:'sleeve', chest:1, back:1, legs:1 }
};
const POSE_N   = { relaxed:'Stood relaxed', flex:'Front double bi', abs:'Abs and thighs',
                   sidetri:'Side triceps', sidechest:'Side chest', back:'Rear double bi',
                   most:'Most muscular', lat:'Lat spread', cross:'Arms crossed' };

const r1   = v => Math.round(v * 10) / 10;
const cl01 = v => v < 0 ? 0 : v > 1 ? 1 : v;
function mix(a, b, t){
  const p = h => [parseInt(h.slice(1,3),16), parseInt(h.slice(3,5),16), parseInt(h.slice(5,7),16)];
  const A = p(a), B = p(b);
  return '#' + A.map((v,i) => Math.round(v + (B[i]-v)*t).toString(16).padStart(2,'0')).join('');
}

/* ------------------------------------------------------------
   mmFigure(look, dev, opt) -> svg string

   Built on a canonical 7.75-head figure rather than by eye. Every
   landmark below is a fraction of standing height, and every width
   is expressed against head height, which is what stops the thing
   drifting back into caricature: the earlier passes had a 2.7:1
   shoulder-to-waist and thighs wider than the hips.

     crown 0 · chin .125 · shoulder .195 · nipple .245
     navel .375 · crotch .50 · knee .72 · ankle .955 · sole 1

   look: { skin hair hairCol beard brow acc trunks pose tattoo }
   dev:  { delts chest back traps arms abs legs calves }  0..1
   opt:  { h:pixel height, crop:'full'|'bust' }
------------------------------------------------------------ */
/* When he holds a pose the working muscles actually swell and the separations
   sharpen — a flex that does not change the body is just a different arm
   position. These are added to the development values before anything is
   measured, so the geometry changes, not only the shading. */
const FLEX_BOOST = {
  flex: { arms:.26, delts:.14, chest:.10, back:.08, traps:.06 },
  sidetri:   { arms:.24, chest:.10, delts:.08, calves:.08 },
  sidechest: { chest:.28, arms:.16, delts:.10, calves:.18, legs:.08 },
  back: { back:.26, traps:.18, arms:.18, delts:.10 },
  most: { chest:.24, arms:.16, traps:.16, delts:.10, abs:.10 },
  abs:  { abs:.28, legs:.12, delts:.08 },
  lat:  { back:.28, delts:.12, chest:.08 },
  backlat: { back:.30, delts:.12, traps:.14 },
  wave: { arms:.06 }, wave2: { arms:.06 }
};
const REAR_POSES = { back:1, backlat:1 };
const SIDE_POSES = { sidetri:1, sidechest:1 };
let _mmSeq = 0;

function mmFigure(look, dev, opt){
  const o  = opt || {};
  const L  = Object.assign({ skin:SKINS[2], hair:'buzz', hairCol:'#2b2118', beard:'none',
                             brow:'calm', acc:'none', trunks:'#c8102e', pose:'relaxed',
                             tattoo:'none' }, look || {});
  const d0 = Object.assign(devFlat(0.4), dev || {});
  const fb = FLEX_BOOST[(look || {}).pose] || null;
  const d  = {};
  DEV_KEYS.forEach(k => d[k] = cl01(d0[k] + (fb ? (fb[k] || 0) : 0)));
  const defn = fb ? 1.4 : 1;                  /* separations bite harder mid-pose */
  const tat  = INK[L.tattoo] || {};
  const id = 'mm' + (++_mmSeq);
  const cx = 85, hc = L.hairCol, sk = L.skin;
  const lite  = mix(sk, '#fff3e4', .24);
  const mid   = mix(sk, '#3a1f10', .12);
  const shade = mix(sk, '#3a1f10', .28);
  const deep  = mix(sk, '#22120a', .48);
  const ink   = '#131b26';
  const SKF   = 'url(#' + id + 's)';
  const rear  = !!REAR_POSES[L.pose];
  const side  = !!SIDE_POSES[L.pose];

  /* ---- landmarks ---- */
  const yCrown = 14, yChin = 48, ySh = 68, yNip = 82,
        yNav = 118, yCro = 150, yKnee = 213, yAnk = 272, ySole = 284;
  const headRx = 13, headRy = 17, headCy = 31;

  /* ---- mass, then widths measured against it ---- */
  const MASS = (d.chest + d.back + d.delts + d.arms + d.legs) / 5;
  const SD = 24 + 9*d.delts + 5*d.back;            // shoulder half-span  24..38
  const DR = 8 + 5*d.delts;                        // deltoid cap
  const PW = 12 + 6*d.chest;                       // pec half-width
  const PH = 10 + 5*d.chest;
  const LF = 3 + 9*d.back;                         // lat flare
  const TR = 2 + 9*d.traps;
  const NW = 6.5 + 3.5*d.traps;                    // neck half-width
  /* composition: mass widens the waist, conditioning narrows it */
  const WW = Math.max(12.5, 14.5 + 8*MASS - 3.2*d.abs);
  const HW = WW + 4;                               // hips
  const AU = 6.5 + 6*d.arms;                       // upper arm
  const AF = 5 + 4.5*d.arms;                       // forearm
  const TH = 8.5 + 4.5*d.legs;                     // thigh
  const CA = 6 + 3.6*d.calves;                     // calf
  const hipX = r1(HW*0.52);
  const cut = cl01(d.abs * 1.05);

  let s =
    '<defs>' +
      '<linearGradient id="'+id+'s" gradientUnits="userSpaceOnUse" x1="26" y1="40" x2="146" y2="150">' +
        '<stop offset="0" stop-color="'+lite+'"/><stop offset=".36" stop-color="'+sk+'"/>' +
        '<stop offset=".78" stop-color="'+mid+'"/><stop offset="1" stop-color="'+shade+'"/>' +
      '</linearGradient>' +
      '<linearGradient id="'+id+'t" gradientUnits="userSpaceOnUse" x1="50" y1="0" x2="130" y2="0">' +
        '<stop offset="0" stop-color="'+mix(L.trunks,'#ffffff',.22)+'"/>' +
        '<stop offset=".55" stop-color="'+L.trunks+'"/>' +
        '<stop offset="1" stop-color="'+mix(L.trunks,'#000000',.36)+'"/>' +
      '</linearGradient>' +
    '</defs>';

  /* ---------- hands ---------- */
  const hand = (hx, hy, ex, ey, g, open) => {
    const ang = r1(Math.atan2(hy - ey, hx - ex) * 180 / Math.PI);
    const w = AF*0.9, l = AF*(open ? 2.2 : 1.5);
    let p = '';
    if (open){
      for (let i = 0; i < 4; i++){
        const off = r1((i - 1.5) * w * 0.5);
        p += '<path d="M'+r1(l*0.34)+' '+off+'L'+r1(l*1.02)+' '+r1(off*1.3)+'" stroke="'+SKF+
             '" stroke-width="'+r1(w*0.44)+'" stroke-linecap="round" fill="none"/>';
      }
      p += '<path d="M'+r1(l*0.12)+' '+r1(w*0.55)+'L'+r1(l*0.52)+' '+r1(w*1.4)+'" stroke="'+SKF+
           '" stroke-width="'+r1(w*0.5)+'" stroke-linecap="round" fill="none"/>' +
           '<ellipse cx="'+r1(l*0.2)+'" cy="0" rx="'+r1(l*0.44)+'" ry="'+r1(w*0.96)+'" fill="'+SKF+'"/>' +
           '<path d="M'+r1(l*0.5)+' '+r1(-w*0.72)+'v'+r1(w*1.44)+'" stroke="'+shade+'" stroke-width=".7" opacity=".4"/>';
    } else {
      p += '<ellipse cx="'+r1(l*0.26)+'" cy="0" rx="'+r1(l*0.56)+'" ry="'+r1(w)+'" fill="'+SKF+'"/>';
      for (let i = 0; i < 3; i++)
        p += '<circle cx="'+r1(l*0.66)+'" cy="'+r1((i-1)*w*0.6)+'" r="'+r1(w*0.31)+'" fill="'+SKF+'"/>';
      p += '<path d="M'+r1(l*0.52)+' '+r1(-w*0.55)+'v'+r1(w*1.1)+'" stroke="'+shade+'" stroke-width=".8" opacity=".45"/>' +
           '<path d="M'+r1(l*0.08)+' '+r1(w*0.45)+'L'+r1(l*0.52)+' '+r1(w*0.92)+'" stroke="'+SKF+
           '" stroke-width="'+r1(w*0.46)+'" stroke-linecap="round" fill="none"/>';
    }
    return '<g transform="translate('+hx+' '+hy+') rotate('+ang+') scale(1 '+g+')">' + p + '</g>';
  };

  /* ---------- feet ---------- */
  const foot = (fx, g, toeOut) => {
    const w = CA*0.9, len = CA*(toeOut ? 2.6 : 2.0), fy = ySole;
    let out = '<path d="M'+r1(fx - g*w*0.72)+' '+r1(fy-15)+
      'L'+r1(fx + g*w*0.62)+' '+r1(fy-15)+
      'L'+r1(fx + g*len)+' '+r1(fy-5)+
      'Q'+r1(fx + g*(len+1.6))+' '+fy+' '+r1(fx + g*(len-2.2))+' '+fy+
      'L'+r1(fx - g*w*1.05)+' '+fy+
      'Q'+r1(fx - g*w*1.55)+' '+r1(fy-6.5)+' '+r1(fx - g*w*0.72)+' '+r1(fy-15)+'Z" fill="'+SKF+'"/>';
    for (let i = 0; i < 4; i++)
      out += '<circle cx="'+r1(fx + g*(len - 2.2 - i*w*0.42))+'" cy="'+r1(fy-2.1)+
             '" r="'+r1(w*0.18)+'" fill="'+shade+'" opacity=".5"/>';
    out += '<path d="M'+r1(fx - g*w*0.85)+' '+r1(fy-1.8)+'Q'+r1(fx + g*w*0.5)+' '+r1(fy-6.5)+' '+
           r1(fx + g*(len-3))+' '+r1(fy-2.4)+'" stroke="'+shade+'" stroke-width="1" fill="none" opacity=".45"/>' +
           '<circle cx="'+r1(fx - g*w*0.3)+'" cy="'+r1(fy-11)+'" r="'+r1(w*0.25)+'" fill="'+lite+'" opacity=".5"/>';
    return out;
  };

  /* ---------- side view: side triceps and side chest ----------
     A third view, in profile, facing right. The two poses share the whole
     body and differ only in the near arm and the near leg, so cross-fading
     from one to the other reads as him turning into the chest rather than
     cutting to a new picture. */
  if (side){
    const chestD = r1(15 + 10*d.chest);        // how far the chest projects forward
    const backD  = r1(12 + 8*d.back);          // lats and erectors behind
    const gluteD = r1(12 + 7*d.legs);
    const waistD = r1(10 + 6*MASS - 2*d.abs);
    const far    = mix(sk, '#2a1408', .16);    // the limbs on the far side
    const chestUp = L.pose === 'sidechest';    // ribcage lifted, calf raised

    /* ground */
    s += '<ellipse cx="'+cx+'" cy="'+(ySole+2)+'" rx="'+r1(gluteD + CA + 12)+'" ry="5" fill="#000" opacity=".26"/>';

    /* far arm and far leg first, behind the body */
    const farElb = chestUp ? r1(cx + chestD*0.35) : r1(cx - backD*0.15);
    s += '<path d="M'+r1(cx-2)+' '+(ySh+5)+'L'+farElb+' '+(ySh+40)+
         'L'+r1(chestUp ? cx + waistD*1.1 : cx - waistD*0.1)+' '+(chestUp ? yNav+18 : yCro+20)+
         '" stroke="'+far+'" stroke-width="'+r1(AU*1.7)+'" stroke-linecap="round" fill="none"/>';
    s += '<path d="M'+r1(cx-8)+' '+(yCro+2)+'L'+r1(cx-10)+' '+yKnee+
         '" stroke="'+far+'" stroke-width="'+r1(TH*1.8)+'" stroke-linecap="round" fill="none"/>' +
         '<path d="M'+r1(cx-10)+' '+(yKnee-4)+'L'+r1(cx-9)+' '+(yAnk-2)+
         '" stroke="'+far+'" stroke-width="'+r1(CA*1.8)+'" stroke-linecap="round" fill="none"/>' +
         '<path d="M'+r1(cx-15)+' '+(ySole-14)+'h'+r1(CA*1.2)+'l'+r1(CA*1.9)+' 10v4h-'+r1(CA*3.1)+'z" fill="'+far+'"/>';

    /* Neck, then the torso in profile. In profile the neck is as thick as it is
       from the front — halving it left the head standing on a stalk. */
    s += '<path d="M'+r1(cx-NW*0.95)+' '+(yChin-9)+
         'C'+r1(cx-NW*1.1)+' '+(yChin+4)+','+r1(cx-NW*1.3)+' '+(ySh-6)+','+r1(cx-NW*1.45)+' '+(ySh+3)+
         'L'+r1(cx+NW*1.15)+' '+(ySh+3)+
         'C'+r1(cx+NW)+' '+(ySh-6)+','+r1(cx+NW*0.95)+' '+(yChin+4)+','+r1(cx+NW*0.85)+' '+(yChin-9)+
         'Z" fill="'+SKF+'"/>';
    /* trapezius ramp from the neck back into the shoulder */
    s += '<path d="M'+r1(cx-NW*0.6)+' '+r1(yChin-2-TR*0.3)+
         'C'+r1(cx-NW-4)+' '+(yChin+8)+','+r1(cx-backD*0.8)+' '+(ySh-6)+','+r1(cx-backD)+' '+(ySh+4)+
         'L'+r1(cx+chestD*0.4)+' '+(ySh+4)+
         'C'+r1(cx+NW)+' '+(ySh-8)+','+r1(cx+NW*0.7)+' '+(yChin+4)+','+r1(cx+NW*0.6)+' '+r1(yChin-2-TR*0.3)+
         'Z" fill="'+SKF+'"/>';

    const nipD = chestUp ? r1(chestD*1.12) : chestD;
    s += '<path d="M'+r1(cx-backD*0.9)+' '+ySh+
         'C'+r1(cx-backD-2)+' '+(ySh+18)+','+r1(cx-waistD-3)+' '+(yNav-12)+','+r1(cx-waistD)+' '+yNav+
         'C'+r1(cx-gluteD*0.5)+' '+(yNav+14)+','+r1(cx-gluteD-1)+' '+(yCro-16)+','+r1(cx-gluteD*0.72)+' '+(yCro+2)+
         'L'+r1(cx+waistD*0.85)+' '+(yCro+2)+
         'C'+r1(cx+waistD+1)+' '+(yNav+10)+','+r1(cx+waistD*1.1)+' '+(yNav-4)+','+r1(cx+waistD*1.15)+' '+(yNav-12)+
         'C'+r1(cx+nipD*0.85)+' '+(yNip+12)+','+r1(cx+nipD)+' '+(yNip-3)+','+r1(cx+nipD*0.52)+' '+ySh+
         'Z" fill="'+SKF+'"/>';

    /* the pec, seen from the side: the whole point of the pose */
    s += '<path d="M'+r1(cx+nipD*0.5)+' '+r1(yNip-5)+
         'C'+r1(cx+nipD*0.95)+' '+r1(yNip-3)+','+r1(cx+nipD*0.98)+' '+r1(yNip+PH*0.9)+','+r1(cx+nipD*0.45)+' '+r1(yNip+PH*1.25)+
         'C'+r1(cx+nipD*0.2)+' '+r1(yNip+PH*0.7)+','+r1(cx+nipD*0.24)+' '+r1(yNip)+','+r1(cx+nipD*0.5)+' '+r1(yNip-5)+
         'Z" fill="'+lite+'" opacity="'+r1(cl01((.5+.35*d.chest)*defn))+'"/>' +
         '<path d="M'+r1(cx+nipD*0.28)+' '+r1(yNip+PH*1.3)+'Q'+r1(cx+nipD*0.7)+' '+r1(yNip+PH*1.5)+' '+r1(cx+nipD*0.92)+' '+r1(yNip+PH*0.95)+
         '" stroke="'+shade+'" stroke-width="'+r1((1.4+1.6*d.chest)*defn)+'" fill="none" stroke-linecap="round"/>' +
         /* serratus and the oblique running down to the hip */
         '<path d="M'+r1(cx+waistD*0.5)+' '+r1(yNip+PH*1.7)+'l'+r1(waistD*0.5)+' 4M'+r1(cx+waistD*0.45)+' '+r1(yNip+PH*2.1)+'l'+r1(waistD*0.5)+' 3.4' +
         '" stroke="'+shade+'" stroke-width="1.4" stroke-linecap="round" opacity=".55"/>' +
         /* lat, sweeping from the armpit down the back edge */
         '<path d="M'+r1(cx-backD*0.55)+' '+(ySh+12)+'Q'+r1(cx-backD-1)+' '+r1(yNav-22)+' '+r1(cx-waistD-1)+' '+r1(yNav-2)+
         '" stroke="'+shade+'" stroke-width="'+r1((2+2.4*d.back)*defn)+'" fill="none" stroke-linecap="round" opacity=".7"/>' +
         '<path d="M'+r1(cx-backD*0.2)+' '+(ySh+16)+'Q'+r1(cx-backD*0.6)+' '+r1(yNav-24)+' '+r1(cx-waistD*0.5)+' '+r1(yNav-6)+
         '" stroke="'+lite+'" stroke-width="'+r1(1.8+2*d.back)+'" fill="none" stroke-linecap="round" opacity="'+r1(.2+.3*d.back)+'"/>';
    /* rim light down the front */
    s += '<path d="M'+r1(cx+nipD*0.5)+' '+(ySh+3)+'C'+r1(cx+nipD)+' '+(yNip-2)+','+r1(cx+nipD*0.9)+' '+(yNip+14)+','+r1(cx+waistD*1.12)+' '+(yNav-11)+
         '" stroke="'+lite+'" stroke-width="1.8" fill="none" opacity=".45" stroke-linecap="round"/>';

    /* trunks in profile */
    const sTop = yCro - 24;
    s += '<path d="M'+r1(cx-gluteD*0.78)+' '+sTop+
         'C'+r1(cx-gluteD-2)+' '+(sTop+14)+','+r1(cx-gluteD-1)+' '+(yCro-4)+','+r1(cx-gluteD*0.6)+' '+(yCro+8)+
         'L'+r1(cx+waistD*0.9)+' '+(yCro+10)+
         'C'+r1(cx+waistD*1.2)+' '+(sTop+16)+','+r1(cx+waistD*1.1)+' '+(sTop+6)+','+r1(cx+waistD*0.95)+' '+sTop+
         'Z" fill="url(#'+id+'t)"/>' +
         '<path d="M'+r1(cx-gluteD*0.78)+' '+sTop+'L'+r1(cx+waistD*0.95)+' '+sTop+'l0 4.5L'+r1(cx-gluteD*0.78)+' '+(sTop+4.5)+
         'Z" fill="rgba(0,0,0,.26)"/>';
    if (L.acc === 'belt')
      s += '<rect x="'+r1(cx-gluteD*0.8)+'" y="'+(sTop-13)+'" width="'+r1(gluteD*0.8 + waistD)+'" height="13" rx="2.5" fill="#5a3a1c"/>';

    /* near leg — raised onto the toe for the chest, flat for the triceps */
    const nx = r1(cx + 5), heel = chestUp ? 8 : 0;
    s += '<path d="M'+nx+' '+(yCro+4)+'L'+r1(nx+2)+' '+yKnee+
         '" stroke="'+SKF+'" stroke-width="'+r1(TH*2)+'" stroke-linecap="round" fill="none"/>' +
         '<path d="M'+r1(nx+2)+' '+(yKnee-4)+'L'+r1(nx+1)+' '+(yAnk-2-heel)+
         '" stroke="'+SKF+'" stroke-width="'+r1(CA*2)+'" stroke-linecap="round" fill="none"/>' +
         /* the calf head, which is what a raised heel is for */
         '<path d="M'+r1(nx-CA*0.7)+' '+(yKnee+8)+'Q'+r1(nx-CA*1.35)+' '+(yKnee+20)+' '+r1(nx-CA*0.2)+' '+r1(yKnee+38-heel)+
         '" stroke="'+shade+'" stroke-width="'+r1((1.6+2.2*d.calves)*defn)+'" fill="none" stroke-linecap="round" opacity=".78"/>' +
         '<ellipse cx="'+r1(nx-CA*0.25)+'" cy="'+r1(yKnee+20-heel*0.4)+'" rx="'+r1(CA*0.72)+'" ry="'+r1(CA*1.35)+
         '" fill="'+lite+'" opacity="'+r1(.14+.24*d.calves)+'"/>' +
         '<ellipse cx="'+r1(nx+TH*0.25)+'" cy="'+r1(yCro + (yKnee-yCro)*0.45)+'" rx="'+r1(TH*0.5)+'" ry="'+r1((yKnee-yCro)*0.3)+
         '" fill="'+lite+'" opacity="'+r1(.12+.2*d.legs)+'"/>';
    /* foot: flat, or up on the ball of the foot */
    s += chestUp
      ? '<path d="M'+r1(nx-CA*0.8)+' '+(ySole-16)+'q'+r1(CA*1.6)+' 0 '+r1(CA*2.6)+' 10q1.6 2-1.6 4h-'+r1(CA*2.4)+'z" fill="'+SKF+'"/>'
      : '<path d="M'+r1(nx-CA*0.8)+' '+(ySole-15)+'h'+r1(CA*1.5)+'l'+r1(CA*2.1)+' 10q1.6 2-1.6 5h-'+r1(CA*3.2)+'z" fill="'+SKF+'"/>';

    /* near arm: locked down and back for the triceps, across the front for the chest */
    /* The near arm sits forward of the torso and gets its own contour, or it
       vanishes into the silhouette — in profile it is the whole pose. */
    const asx = r1(cx + chestD*0.42), asy = ySh + 6;
    const aex = chestUp ? r1(cx + chestD*0.62) : r1(cx - backD*0.28);
    const aey = chestUp ? ySh + 40 : ySh + 44;
    const ahx = chestUp ? r1(cx + waistD*1.25) : r1(cx - waistD*0.05);
    const ahy = chestUp ? yNav + 20 : yCro + 22;
    s += '<path d="M'+asx+' '+asy+'L'+aex+' '+aey+'" stroke="'+SKF+'" stroke-width="'+r1(AU*2)+'" stroke-linecap="round" fill="none"/>' +
         '<path d="M'+aex+' '+aey+'L'+ahx+' '+ahy+'" stroke="'+SKF+'" stroke-width="'+r1(AF*2)+'" stroke-linecap="round" fill="none"/>' +
         /* contour along the back edge of the arm, against the ribcage */
         '<path d="M'+r1(asx - AU*0.95)+' '+r1(asy+4)+'L'+r1(aex - AU*0.75)+' '+r1(aey-2)+
         '" stroke="'+shade+'" stroke-width="1.6" fill="none" opacity=".6" stroke-linecap="round"/>' +
         '<path d="M'+r1(asx + AU*0.9)+' '+r1(asy+6)+'L'+r1(aex + AU*0.6)+' '+r1(aey-4)+
         '" stroke="'+lite+'" stroke-width="1.6" fill="none" opacity=".4" stroke-linecap="round"/>';
    if (!chestUp)
      /* the tricose horseshoe on the back edge of the locked arm */
      s += '<path d="M'+r1(asx-AU*0.75)+' '+(asy+8)+'Q'+r1(aex-AU*1.05)+' '+r1((asy+aey)/2)+' '+r1(aex-AU*0.5)+' '+(aey-4)+
           '" stroke="'+shade+'" stroke-width="'+r1((2+2.4*d.arms)*defn)+'" fill="none" stroke-linecap="round" opacity=".8"/>' +
           '<path d="M'+r1(asx-AU*0.1)+' '+(asy+14)+'Q'+r1(aex-AU*0.3)+' '+r1((asy+aey)/2)+' '+r1(aex-AU*0.1)+' '+(aey-6)+
           '" stroke="'+shade+'" stroke-width="'+r1((1.2+1.6*d.arms)*defn)+'" fill="none" stroke-linecap="round" opacity=".55"/>';
    else
      s += '<ellipse cx="'+r1((asx+aex)/2 + 2)+'" cy="'+r1((asy+aey)/2 - 4)+'" rx="'+r1(AU*0.95)+'" ry="'+r1(AU*0.78)+
           '" fill="'+lite+'" opacity="'+r1(cl01((.42+.4*d.arms)*defn))+'"/>';
    if (tat.arm)
      s += '<mask id="'+id+'sa" maskUnits="userSpaceOnUse">' +
           '<path d="M'+asx+' '+asy+'L'+aex+' '+aey+'" stroke="#fff" stroke-width="'+r1(AU*2)+'" stroke-linecap="round" fill="none"/>' +
           (tat.arm === 'sleeve' ? '<path d="M'+aex+' '+aey+'L'+ahx+' '+ahy+'" stroke="#fff" stroke-width="'+r1(AF*2)+'" stroke-linecap="round" fill="none"/>' : '') +
           '</mask><g mask="url(#'+id+'sa)">' +
           '<path d="M'+asx+' '+asy+'L'+aex+' '+aey+'" stroke="'+ink+'" stroke-width="'+r1(AU*2)+'" opacity=".86" fill="none"/>' +
           (tat.arm === 'sleeve' ? '<path d="M'+aex+' '+aey+'L'+ahx+' '+ahy+'" stroke="'+ink+'" stroke-width="'+r1(AF*2)+'" opacity=".8" fill="none"/>' : '') +
           '<path d="M'+r1(asx-AU*1.4)+' '+r1(asy+AU)+'Q'+r1((asx+aex)/2)+' '+r1((asy+aey)/2 - AU*0.4)+' '+r1(aex+AU*1.4)+' '+r1(aey-AU*0.4)+
           '" stroke="'+sk+'" stroke-width="'+r1(AU*0.4)+'" fill="none" opacity=".9"/></g>';
    /* deltoid, then the hand */
    s += '<circle cx="'+asx+'" cy="'+asy+'" r="'+r1(DR*0.95)+'" fill="'+SKF+'"/>' +
         '<path d="M'+r1(asx-DR*0.7)+' '+r1(asy-DR*0.25)+'A'+r1(DR*0.95)+' '+r1(DR*0.95)+' 0 0 0 '+r1(asx-DR*0.1)+' '+r1(asy+DR*0.8)+
         '" stroke="'+shade+'" stroke-width="'+r1((1.3+1.7*d.delts)*defn)+'" fill="none" stroke-linecap="round" opacity=".8"/>' +
         '<ellipse cx="'+r1(asx+DR*0.15)+'" cy="'+r1(asy-DR*0.4)+'" rx="'+r1(DR*0.5)+'" ry="'+r1(DR*0.34)+
         '" fill="'+lite+'" opacity="'+r1(.3+.45*d.delts)+'"/>' +
         hand(ahx, ahy, aex, aey, 1, false);

    /* head, in profile: brow, nose, lips and chin all project forward */
    let hp = '<path d="M'+r1(cx-12)+' '+headCy+
      'C'+r1(cx-12)+' '+(headCy-15)+','+r1(cx-5)+' '+yCrown+','+r1(cx+2)+' '+yCrown+
      'C'+r1(cx+10)+' '+yCrown+','+r1(cx+12)+' '+(headCy-8)+','+r1(cx+11.5)+' '+(headCy-2)+
      'L'+r1(cx+15)+' '+(headCy+3)+'L'+r1(cx+11)+' '+(headCy+5)+
      'C'+r1(cx+11.5)+' '+(headCy+9)+','+r1(cx+8)+' '+(yChin-1)+','+cx+' '+yChin+
      'C'+r1(cx-8)+' '+(yChin-1)+','+r1(cx-12)+' '+(headCy+9)+','+r1(cx-12)+' '+headCy+'Z" fill="'+SKF+'"/>';
    hp += '<ellipse cx="'+r1(cx-6)+'" cy="'+(headCy+1)+'" rx="2.6" ry="3.6" fill="'+mid+'"/>' +
          '<circle cx="'+r1(cx+7)+'" cy="'+r1(headCy-1)+'" r="1.3" fill="#2b1d12"/>' +
          '<path d="M'+r1(cx+3)+' '+r1(headCy-5)+'l5 1.4" stroke="'+hc+'" stroke-width="2.1" stroke-linecap="round"/>' +
          '<path d="M'+r1(cx+8.5)+' '+(headCy+8)+'q-2.4 1.4-4.6 1" stroke="'+shade+'" stroke-width="1.1" fill="none" opacity=".55" stroke-linecap="round"/>';
    if (L.beard === 'full')
      hp += '<path d="M'+r1(cx-11)+' '+(headCy+4)+'q1 14 11 15.5t9-15.5q-3 9-10 9t-10-9z" fill="'+hc+'"/>';
    else if (L.beard === 'goatee')
      hp += '<path d="M'+r1(cx-1)+' '+(yChin-4)+'q5 2.5 7-1.5v-1.5q-4 2-7 0z" fill="'+hc+'"/>';
    if (L.hair !== 'bald')
      hp += '<path d="M'+r1(cx-12.5)+' '+(headCy-2)+
            'C'+r1(cx-12.5)+' '+(headCy-16)+','+r1(cx-5)+' '+(yCrown-2)+','+r1(cx+2)+' '+(yCrown-2)+
            'C'+r1(cx+10)+' '+(yCrown-2)+','+r1(cx+12.5)+' '+(headCy-9)+','+r1(cx+11.5)+' '+(headCy-5)+
            'q-6-5-12-3-6 2-11.5 6Z" fill="'+hc+'"/>';
    if (L.acc === 'headband')
      hp += '<path d="M'+r1(cx-12.5)+' '+(headCy-8)+'q12-4.5 24 0v4.5q-12-4.5-24 0z" fill="'+L.trunks+'"/>';
    s += hp;

    const sph = o.h || 200;
    return '<svg class="mmf" viewBox="2 4 166 292" width="'+r1(sph*166/292)+'" height="'+sph+
           '" role="img" aria-hidden="true">' + s + '</svg>';
  }
  /* ground */
  s += '<ellipse cx="'+cx+'" cy="'+(ySole+2)+'" rx="'+r1(hipX + TH + 9)+'" ry="5" fill="#000" opacity=".26"/>';

  /* ---------- hair behind the head ---------- */
  const hairBack = () => {
    if (L.hair === 'afro')     return '<circle cx="'+cx+'" cy="'+(headCy-4)+'" r="21.5" fill="'+hc+'"/>';
    if (L.hair === 'long')     return '<path d="M'+(cx-16)+' '+(headCy+2)+'q0-19 16-19t16 19v32q-5.5 5-10-3V'+(headCy+4)+'h-12v27q-4.5 8-10 3z" fill="'+hc+'"/>';

       'C'+r1(cx-hipX-1)+' '+(yCro+13)+','+r1(cx-HW+3)+' '+(yCro+9)+','+tL+' '+legY+
       'C'+tL+' '+(tTop+15)+','+r1(wL-3)+' '+(tTop+9)+','+wL+' '+tTop+
       'Z" fill="url(#'+id+'t)"/>' +
       '<path d="M'+wL+' '+tTop+'H'+wR+'v4.5H'+wL+'Z" fill="rgba(0,0,0,.26)"/>' +
       '<path d="M'+r1(wL+1)+' '+(tTop+7)+'Q'+r1(tL+2)+' '+(tTop+16)+' '+r1(tL+2)+' '+r1(yCro-2)+
       'M'+r1(wR-1)+' '+(tTop+7)+'Q'+r1(tR-2)+' '+(tTop+16)+' '+r1(tR-2)+' '+r1(yCro-2)+
       '" stroke="rgba(255,255,255,.18)" stroke-width="1.3" fill="none"/>';
  if (L.acc === 'belt')
    s += '<rect x="'+r1(cx-WW-4)+'" y="'+(tTop-13)+'" width="'+r1((WW+4)*2)+'" height="13" rx="2.5" fill="#5a3a1c"/>' +
         '<rect x="'+r1(cx-WW-4)+'" y="'+(tTop-13)+'" width="'+r1((WW+4)*2)+'" height="3.6" rx="1.8" fill="rgba(255,255,255,.12)"/>' +
         '<rect x="'+r1(cx-5.5)+'" y="'+(tTop-10)+'" width="11" height="7.5" rx="1.5" fill="#c9922f"/>';

  /* ---------- arms ---------- */
  const arm = (g) => {
    const sx = r1(cx + g*SD*0.80), sy = ySh + 4;
    let out = '', ex, ey, hx, hy, bulge = '', open = false;
    const peak = () => '<ellipse cx="'+r1((sx+ex)/2 + g*2)+'" cy="'+r1((sy+ey)/2 - 5)+'" rx="'+r1(AU*1.02)+
                       '" ry="'+r1(AU*0.8)+'" fill="'+lite+'" opacity="'+r1(cl01((.42+.4*d.arms)*defn))+'"/>';
    if (L.pose === 'flex' || L.pose === 'back'){
      ex = r1(cx + g*(SD + 11)); ey = ySh + 3;
      hx = r1(cx + g*(SD - 5));  hy = ySh - 30;
      bulge = peak();
    } else if (L.pose === 'abs'){
      /* hands behind the head, elbows wide */
      ex = r1(cx + g*(SD + 8));  ey = ySh - 8;
      hx = r1(cx + g*(headRx + 3)); hy = r1(headCy - 6);
      bulge = peak();
    } else if (L.pose === 'most'){
      /* most muscular: both arms forward and down, hands meeting low */
      ex = r1(cx + g*(SD + 5));  ey = ySh + 28;
      hx = r1(cx + g*6);         hy = r1(yNav + 8);
      bulge = peak();
    } else if (L.pose === 'lat' || L.pose === 'backlat'){
      ex = r1(cx + g*(SD + 12)); ey = ySh + 32;
      hx = r1(cx + g*(WW + 5));  hy = yNav + 4;
    } else if (L.pose === 'cross'){
      ex = r1(cx + g*(SD + 5));   ey = ySh + 30;
      hx = r1(cx - g*(PW*0.5));   hy = r1(yNip + PH*1.4);
    } else if (L.pose === 'wave' || L.pose === 'wave2'){
      if (g === 1){
        ex = r1(cx + g*(SD + 8)); ey = ySh - 3;
        hx = r1(cx + g*(SD + (L.pose === 'wave' ? 16 : 3)));
        hy = ySh - (L.pose === 'wave' ? 32 : 38);
        open = true;
      } else {
        ex = r1(cx + g*(SD*0.94 + 4)); ey = ySh + 40;
        hx = r1(cx + g*(WW + 12));     hy = yCro + 22;
      }
    } else {
      ex = r1(cx + g*(SD*0.94 + 4)); ey = ySh + 40;
      hx = r1(cx + g*(WW + 12));     hy = yCro + 22;
    }
    out += '<path d="M'+sx+' '+sy+'L'+ex+' '+ey+'" stroke="'+SKF+'" stroke-width="'+r1(AU*2)+'" stroke-linecap="round" fill="none"/>' + bulge +
           '<path d="M'+ex+' '+ey+'L'+hx+' '+hy+'" stroke="'+SKF+'" stroke-width="'+r1(AF*2)+'" stroke-linecap="round" fill="none"/>' +
           '<path d="M'+r1(sx + g*AU*0.55)+' '+(sy+4)+'L'+r1(ex + g*AU*0.4)+' '+(ey-3)+
             '" stroke="'+shade+'" stroke-width="'+r1((1.1+1.7*d.arms)*defn)+'" stroke-linecap="round" opacity=".7"/>' +
           '<path d="M'+r1(ex - g*AF*0.3)+' '+r1(ey + (hy-ey)*0.2)+'L'+r1(hx - g*AF*0.2)+' '+r1(hy - (hy-ey)*0.22)+
             '" stroke="'+shade+'" stroke-width="'+r1(0.8+1.2*d.arms)+'" stroke-linecap="round" opacity=".55"/>' +
           '<circle cx="'+ex+'" cy="'+ey+'" r="'+r1(AF*0.72)+'" fill="'+lite+'" opacity=".28"/>' +
           /* vascularity: only once the arm is developed and the midsection lean */
           (d.arms > 0.55 && cut > 0.45
             ? '<path d="M'+r1(ex + g*AF*0.25)+' '+r1(ey + (hy-ey)*0.26)+'q'+r1(-g*AF*0.55)+' '+r1((hy-ey)*0.18)+' '+r1(g*AF*0.2)+' '+r1((hy-ey)*0.42)+
               '" stroke="'+lite+'" stroke-width=".9" fill="none" opacity=".5" stroke-linecap="round"/>' +
               '<path d="M'+r1(sx + g*DR*0.1)+' '+r1(sy+DR*0.2)+'q'+r1(g*DR*0.4)+' '+r1(DR*0.3)+' '+r1(g*DR*0.2)+' '+r1(DR*0.7)+
               '" stroke="'+lite+'" stroke-width=".8" fill="none" opacity=".42" stroke-linecap="round"/>'
             : '');
    if (tat.arm && g === 1){
      /* Ink masked to the arm itself, so it can be any shape and still cannot
         spill off the limb. Banded dashes read as a striped bandage; real
         blackwork is mostly solid with negative space cut back out of it. */
      const am = id + 'a';
      const mx = r1((ex + hx) / 2), my = r1((ey + hy) / 2);
      const bandA = r1(0.3), bandB = r1(0.66);         /* along the upper arm */
      const px = (t) => r1(sx + (ex - sx) * t), py = (t) => r1(sy + (ey - sy) * t);
      out += '<mask id="'+am+'" maskUnits="userSpaceOnUse">' +
        '<path d="M'+sx+' '+sy+'L'+ex+' '+ey+'" stroke="#fff" stroke-width="'+r1(AU*2)+'" stroke-linecap="round" fill="none"/>' +
        '<path d="M'+ex+' '+ey+'L'+hx+' '+hy+'" stroke="#fff" stroke-width="'+r1(AF*2)+'" stroke-linecap="round" fill="none"/>' +
        '</mask><g mask="url(#'+am+')">';
      if (tat.arm === 'band'){
        out += '<path d="M'+px(bandA)+' '+py(bandA)+'L'+px(bandB)+' '+py(bandB)+
               '" stroke="'+ink+'" stroke-width="'+r1(AU*2)+'" opacity=".88" fill="none"/>' +
               '<path d="M'+r1(px(0.44)-AU*1.5)+' '+py(0.44)+'l'+r1(AU*3)+' 0" stroke="'+sk+
               '" stroke-width="'+r1(AU*0.26)+'" opacity=".9"/>' +
               '<path d="M'+r1(px(0.56)-AU*1.5)+' '+py(0.56)+'l'+r1(AU*3)+' 0" stroke="'+sk+
               '" stroke-width="'+r1(AU*0.18)+'" opacity=".75"/>';
      } else {
        /* solid over the upper arm; the full sleeve carries on down the forearm */
        out += '<path d="M'+sx+' '+sy+'L'+ex+' '+ey+'" stroke="'+ink+'" stroke-width="'+r1(AU*2)+'" opacity=".88" fill="none"/>';
        if (tat.arm === 'sleeve')
          out += '<path d="M'+ex+' '+ey+'L'+mx+' '+my+'" stroke="'+ink+'" stroke-width="'+r1(AF*2)+'" opacity=".84" fill="none"/>' +
                 '<path d="M'+mx+' '+my+'L'+r1(mx + (hx-mx)*0.22)+' '+r1(my + (hy-my)*0.22)+
                 '" stroke="'+ink+'" stroke-width="'+r1(AF*2)+'" opacity=".5" fill="none"/>' +
                 '<path d="M'+r1(ex-AF*1.6)+' '+r1(ey+AF*1.2)+'Q'+mx+' '+r1(my-AF*0.4)+' '+r1(mx+AF*1.6)+' '+r1(my+AF*0.8)+
                 '" stroke="'+sk+'" stroke-width="'+r1(AF*0.34)+'" fill="none" opacity=".85"/>';
        /* negative space: skin cut back through the ink in sweeping arcs */
        out += '<path d="M'+r1(sx-AU*1.4)+' '+r1(sy+AU*0.7)+'Q'+r1((sx+ex)/2)+' '+r1((sy+ey)/2 - AU*0.5)+' '+r1(ex+AU*1.4)+' '+r1(ey+AU*0.5)+
               '" stroke="'+sk+'" stroke-width="'+r1(AU*0.42)+'" fill="none" opacity=".92"/>' +
               '<path d="M'+r1(sx-AU*1.4)+' '+r1(sy+AU*1.6)+'Q'+r1((sx+ex)/2)+' '+r1((sy+ey)/2 + AU*0.5)+' '+r1(ex+AU*1.4)+' '+r1(ey+AU*1.4)+
               '" stroke="'+sk+'" stroke-width="'+r1(AU*0.3)+'" fill="none" opacity=".8"/>' +
               '<path d="M'+r1(px(0.22)-AU*1.5)+' '+py(0.22)+'l'+r1(AU*3)+' 0" stroke="'+sk+
               '" stroke-width="'+r1(AU*0.2)+'" opacity=".7"/>';
      }
      out += '</g>';
    }
    out += '<circle cx="'+sx+'" cy="'+sy+'" r="'+r1(DR)+'" fill="'+SKF+'"/>' +
           '<path d="M'+r1(sx - g*DR*0.75)+' '+r1(sy-DR*0.3)+'A'+r1(DR)+' '+r1(DR)+' 0 0 '+(g>0?1:0)+' '+r1(sx + g*DR*0.2)+' '+r1(sy+DR*0.85)+
             '" stroke="'+shade+'" stroke-width="'+r1((1.2+1.6*d.delts)*defn)+'" fill="none" stroke-linecap="round" opacity=".8"/>' +
           '<path d="M'+r1(sx - g*DR*0.2)+' '+r1(sy-DR*0.8)+'A'+r1(DR*0.9)+' '+r1(DR*0.9)+' 0 0 '+(g>0?1:0)+' '+r1(sx + g*DR*0.6)+' '+r1(sy+DR*0.3)+
             '" stroke="'+shade+'" stroke-width="'+r1(0.8+1*d.delts)+'" fill="none" stroke-linecap="round" opacity=".45"/>' +
           '<ellipse cx="'+r1(sx + g*DR*0.18)+'" cy="'+r1(sy-DR*0.42)+'" rx="'+r1(DR*0.55)+'" ry="'+r1(DR*0.36)+
             '" fill="'+lite+'" opacity="'+r1(.3+.45*d.delts)+'"/>' +
           hand(hx, hy, ex, ey, g, open);
    if (L.acc === 'wraps')
      out += '<path d="M'+r1(hx - g*AF*1.2)+' '+r1(hy - AF*1.7)+'l'+r1(g*AF*2.4)+' 0" stroke="#e8e8e8" stroke-width="4.6" stroke-linecap="round"/>';
    return out;
  };
  const armsLast = L.pose === 'cross' || L.pose === 'most';
  if (!armsLast) s += arm(-1) + arm(1);

  /* ---------- head ---------- */
  let h = '';
  if (rear){
    /* the back of the head: a skull and hair, no face */
    h += '<path d="M'+(cx-headRx)+' '+headCy+'C'+(cx-headRx)+' '+(headCy-15)+','+(cx-7)+' '+yCrown+','+cx+' '+yCrown+
         'C'+(cx+7)+' '+yCrown+','+(cx+headRx)+' '+(headCy-15)+','+(cx+headRx)+' '+headCy+
         'C'+(cx+headRx)+' '+(headCy+9)+','+(cx+8)+' '+(yChin-1)+','+cx+' '+yChin+
         'C'+(cx-8)+' '+(yChin-1)+','+(cx-headRx)+' '+(headCy+9)+','+(cx-headRx)+' '+headCy+'Z" fill="'+SKF+'"/>' +
         '<ellipse cx="'+(cx-headRx)+'" cy="'+(headCy+1)+'" rx="2.4" ry="3.3" fill="'+SKF+'"/>' +
         '<ellipse cx="'+(cx+headRx)+'" cy="'+(headCy+1)+'" rx="2.4" ry="3.3" fill="'+SKF+'"/>';
    /* hair covers the back of the skull for every style but bald */
    if (L.hair !== 'bald')
      h += '<path d="M'+(cx-headRx-0.5)+' '+(headCy+2)+'C'+(cx-headRx-0.5)+' '+(headCy-15)+','+(cx-7)+' '+(yCrown-1)+','+cx+' '+(yCrown-1)+
           'C'+(cx+7)+' '+(yCrown-1)+','+(cx+headRx+0.5)+' '+(headCy-15)+','+(cx+headRx+0.5)+' '+(headCy+2)+
           'q-'+headRx+' 5-'+(headRx*2)+' 0Z" fill="'+hc+'"/>';
    h += hairBack();
    if (L.acc === 'cap')      h += '<path d="M'+(cx-headRx-1)+' '+(headCy-4)+'q1-13 '+(headRx+1)+'-13t'+(headRx+1)+' 13z" fill="'+L.trunks+'"/>';
    if (L.acc === 'headband') h += '<path d="M'+(cx-headRx-1)+' '+(headCy-6)+'q'+(headRx+1)+'-4 '+(headRx*2+2)+' 0v4.5q-'+(headRx+1)+'-4-'+(headRx*2+2)+' 0z" fill="'+L.trunks+'"/>';
  } else {
    h += '<path d="M'+(cx-headRx)+' '+headCy+'C'+(cx-headRx)+' '+(headCy-15)+','+(cx-7)+' '+yCrown+','+cx+' '+yCrown+
         'C'+(cx+7)+' '+yCrown+','+(cx+headRx)+' '+(headCy-15)+','+(cx+headRx)+' '+headCy+
         'C'+(cx+headRx)+' '+(headCy+9)+','+(cx+8)+' '+(yChin-1)+','+cx+' '+yChin+
         'C'+(cx-8)+' '+(yChin-1)+','+(cx-headRx)+' '+(headCy+9)+','+(cx-headRx)+' '+headCy+'Z" fill="'+SKF+'"/>' +
         '<ellipse cx="'+(cx-headRx)+'" cy="'+(headCy+1)+'" rx="2.4" ry="3.3" fill="'+SKF+'"/>' +
         '<ellipse cx="'+(cx+headRx)+'" cy="'+(headCy+1)+'" rx="2.4" ry="3.3" fill="'+SKF+'"/>' +
         '<path d="M'+(cx-headRx+1)+' '+(headCy+1)+'q1 1.5 0 3M'+(cx+headRx-1)+' '+(headCy+1)+'q-1 1.5 0 3" stroke="'+shade+'" stroke-width=".8" fill="none" opacity=".5"/>' +
         '<path d="M'+(cx-11.5)+' '+(headCy+1)+'Q'+(cx-8)+' '+(headCy+6)+' '+(cx-5.5)+' '+(headCy+7.5)+
         'M'+(cx+11.5)+' '+(headCy+1)+'Q'+(cx+8)+' '+(headCy+6)+' '+(cx+5.5)+' '+(headCy+7.5)+
         '" stroke="'+shade+'" stroke-width="1" fill="none" opacity=".38"/>' +
         '<path d="M'+cx+' '+(headCy+1)+'v4.2l2 1.3" stroke="'+shade+'" stroke-width="1.2" fill="none" stroke-linecap="round" opacity=".7"/>' +
         /* brow ridge, nostrils and a lower lip — the small marks that keep a
            face from reading as a mask */
         '<path d="M'+(cx-9)+' '+(headCy-6.5)+'Q'+cx+' '+(headCy-9)+' '+(cx+9)+' '+(headCy-6.5)+
         '" stroke="'+shade+'" stroke-width="1.1" fill="none" opacity=".32"/>' +
         '<circle cx="'+(cx-1.9)+'" cy="'+(headCy+6.4)+'" r=".7" fill="'+shade+'" opacity=".55"/>' +
         '<circle cx="'+(cx+1.9)+'" cy="'+(headCy+6.4)+'" r=".7" fill="'+shade+'" opacity=".55"/>' +
         '<path d="M'+(cx-2.6)+' '+(headCy+12.6)+'q2.6 1.3 5.2 0" stroke="'+shade+
         '" stroke-width="1" fill="none" opacity=".42" stroke-linecap="round"/>';
    const bY = L.brow === 'hard' ? headCy - 4.2 : headCy - 4.6;
    h += L.brow === 'hard'
      ? '<path d="M'+(cx-8.5)+' '+(bY-1.2)+'l5.5 1.9M'+(cx+8.5)+' '+(bY-1.2)+'l-5.5 1.9" stroke="'+hc+'" stroke-width="2.2" stroke-linecap="round"/>'
      : '<path d="M'+(cx-9)+' '+bY+'h5.5M'+(cx+3.5)+' '+bY+'h5.5" stroke="'+hc+'" stroke-width="1.9" stroke-linecap="round"/>';
    if (L.acc === 'shades'){
      h += '<path d="M'+(cx-11.5)+' '+(bY+2)+'h9.2v5.6h-9.2zM'+(cx+2.3)+' '+(bY+2)+'h9.2v5.6h-9.2z" fill="#11151a"/>' +
           '<path d="M'+(cx-2.3)+' '+(bY+3.6)+'h4.6M'+(cx-11.5)+' '+(bY+2)+'l-2.3-1.5M'+(cx+11.5)+' '+(bY+2)+'l2.3-1.5" stroke="#11151a" stroke-width="1.6" stroke-linecap="round"/>' +
           '<path d="M'+(cx-10.6)+' '+(bY+3)+'h2.8" stroke="rgba(255,255,255,.35)" stroke-width="1.1" stroke-linecap="round"/>';
    } else {
      h += '<ellipse cx="'+(cx-4.8)+'" cy="'+(bY+3.4)+'" rx="2.3" ry="1.75" fill="#f4f6f8"/>' +
           '<ellipse cx="'+(cx+4.8)+'" cy="'+(bY+3.4)+'" rx="2.3" ry="1.75" fill="#f4f6f8"/>' +
           '<circle cx="'+(cx-4.6)+'" cy="'+(bY+3.5)+'" r="1.35" fill="#2b1d12"/>' +
           '<circle cx="'+(cx+4.6)+'" cy="'+(bY+3.5)+'" r="1.35" fill="#2b1d12"/>';
    }
    const mY = headCy + 10.5;
    if (L.beard === 'full'){
      h += '<path d="M'+(cx-11.5)+' '+(headCy+3)+'q.5 14 11.5 15t11.5-15q-3 8.5-11.5 8.5t-11.5-8.5z" fill="'+hc+'"/>' +
           '<path d="M'+(cx-3.6)+' '+mY+'h7.2" stroke="#171717" stroke-width="1.7" stroke-linecap="round"/>';
    } else {
      h += '<path d="M'+(cx-3.4)+' '+mY+'q3.4 2.6 6.8 0" stroke="#3b2018" stroke-width="1.7" fill="none" stroke-linecap="round"/>';
      if (L.beard === 'stache')  h += '<path d="M'+(cx-5.2)+' '+(mY-2.2)+'h10.4" stroke="'+hc+'" stroke-width="2.7" stroke-linecap="round"/>';
      if (L.beard === 'goatee')  h += '<path d="M'+(cx-4.4)+' '+(mY+3.4)+'q4.4 3.4 8.8 0v-1.2q-4.4 2.2-8.8 0z" fill="'+hc+'"/>';
      if (L.beard === 'stubble') h += '<path d="M'+(cx-10.5)+' '+(headCy+5)+'q2 9.5 10.5 9.5t10.5-9.5" stroke="'+hc+'" stroke-width="1.2" fill="none" opacity=".42" stroke-dasharray="1.5 2.4"/>';
    }
    h += hairTop(L, hc, cx, yCrown, headCy, headRx);
    if (L.acc === 'headband') h += '<path d="M'+(cx-headRx-0.5)+' '+(headCy-9)+'q'+(headRx+0.5)+'-4.5 '+(headRx*2+1)+' 0v4.6q-'+(headRx+0.5)+'-4.5-'+(headRx*2+1)+' 0z" fill="'+L.trunks+'"/>';
    if (L.acc === 'cap')      h += '<path d="M'+(cx-headRx-1)+' '+(headCy-8)+'q1.8-12.5 '+(headRx+1)+'-12.5t'+(headRx+1)+' 12.5z" fill="'+L.trunks+'"/>' +
                                   '<path d="M'+(cx-headRx-1)+' '+(headCy-8)+'h'+(headRx*2-4)+'l8 3.4H'+(cx-headRx-1)+'z" fill="'+mix(L.trunks,'#000000',.28)+'"/>';
    if (L.acc === 'chain')    h += '<path d="M'+(cx-9)+' '+(yChin+3)+'q9 9.5 18 0" stroke="#c9922f" stroke-width="2.2" fill="none" stroke-linecap="round"/>';
  }
  s += h;
  if (armsLast) s += arm(-1) + arm(1);

  const bust = o.crop === 'bust';
  const box  = bust ? (cx-31) + ' 11 62 66' : '2 4 166 292';
  const vbW  = bust ? 62 : 166, vbH = bust ? 66 : 292;
  const ph   = o.h || 200;
  return '<svg class="mmf" viewBox="'+box+'" width="'+r1(ph*vbW/vbH)+'" height="'+ph+'" role="img" aria-hidden="true">' + s + '</svg>';
}

/* ------------------------------------------------------------
   Hair, drawn against the head landmarks rather than guessed at.
   Kept out of mmFigure so adding a style is a one-line change.
------------------------------------------------------------ */
function hairTop(L, hc, cx, yCrown, headCy, R){
  const t = headCy - 11;                    // hairline
  const dark = mix(hc, '#000000', .3);
  switch (L.hair){
    case 'bald':
      return '<path d="M'+(cx-6)+' '+(yCrown+4)+'q6-4 12 0" stroke="rgba(255,255,255,.22)" stroke-width="1.7" fill="none" stroke-linecap="round"/>';
    case 'buzz':
      return '<path d="M'+(cx-R-0.5)+' '+(t+2)+'C'+(cx-R-0.5)+' '+(yCrown-1)+','+(cx-6)+' '+(yCrown-2)+','+cx+' '+(yCrown-2)+
             'C'+(cx+6)+' '+(yCrown-2)+','+(cx+R+0.5)+' '+(yCrown-1)+','+(cx+R+0.5)+' '+(t+2)+
             'q-'+R+' -4.5-'+(R*2)+' 0Z" fill="'+hc+'"/>';
    case 'crew':
      return '<path d="M'+(cx-R-0.5)+' '+(t+1)+'C'+(cx-R-0.5)+' '+(yCrown-3)+','+(cx-6)+' '+(yCrown-4)+','+cx+' '+(yCrown-4)+
             'C'+(cx+6)+' '+(yCrown-4)+','+(cx+R+0.5)+' '+(yCrown-3)+','+(cx+R+0.5)+' '+(t+1)+
             'q-'+R+' -6-'+(R*2)+' 0Z" fill="'+hc+'"/>' +
             '<path d="M'+(cx-R)+' '+(t+1)+'q'+R+' -3 '+(R*2)+' 0" stroke="'+dark+'" stroke-width="2" fill="none"/>';
    case 'flattop':
      return '<path d="M'+(cx-R-1)+' '+(t+1)+'V'+(yCrown-5)+'h'+(R*2+2)+'v'+(t+6-yCrown)+
             'q-'+(R+1)+' -5-'+(R*2+2)+' 0Z" fill="'+hc+'"/>';
    case 'short':
      return '<path d="M'+(cx-R-1)+' '+(t+4)+'C'+(cx-R-1)+' '+(yCrown-4)+','+(cx-6)+' '+(yCrown-5)+','+cx+' '+(yCrown-5)+
             'C'+(cx+6)+' '+(yCrown-5)+','+(cx+R+1)+' '+(yCrown-4)+','+(cx+R+1)+' '+(t+4)+
             'q-4 -6-'+(R-2)+' -6t-'+(R-2)+' 6q-4 0-4 0Z" fill="'+hc+'"/>';
    case 'slick':
      return '<path d="M'+(cx-R-1)+' '+(t+3)+'C'+(cx-R-1)+' '+(yCrown-4)+','+(cx-4)+' '+(yCrown-6)+','+(cx+R+2)+' '+(yCrown-1)+

const DEV_MUSCLES = {
  delts:  ['fdelt','sdelt','rdelt'],
  chest:  ['chest'],
  back:   ['lats','upback'],
  traps:  ['traps','lback'],
  arms:   ['bi','tri','fore'],
  abs:    ['abs'],
  legs:   ['quad','ham','glute','add'],
  calves: ['calf']
};
/* lifetime kg·reps that reads as a fully developed region */
const DEV_SCALE = { delts:150000, chest:190000, back:260000, traps:120000,
                    arms:140000, abs:60000, legs:340000, calves:90000 };
/* top e1RM as a multiple of bodyweight that reads as strong for the region */
const DEV_STD   = { delts:0.75, chest:1.35, back:1.45, traps:1.60,
                    arms:0.62, abs:0.55, legs:2.05, calves:1.55 };

/* one pass over the log gives everything the character needs.
   Memoised on the shape of the log so a render is cheap. */
let _logKey = '', _logStats = null;
function logStats(){
  const done = doneSessions();
  const last = done.length ? done[done.length-1] : null;
  const key  = done.length + ':' + (last ? last.id + ':' + sessionWorkSets(last) : '') + ':' + today();
  if (key === _logKey && _logStats) return _logStats;

  const cut30 = addDays(today(), -30);
  const zero  = () => { const o = {}; MUSCLE_KEYS.forEach(k => o[k] = 0); return o; };
  const vol = zero(), volOld = zero(), best = zero(), bestOld = zero();
  const seen = {};
  let prs = 0, prsOld = 0, sets = 0, tonnage = 0;

  done.forEach(ses => {
    const old = ses.date < cut30;
    (ses.entries||[]).forEach(en => {
      const ex = exById(en.exId); if (!ex) return;
      const work = (en.sets||[]).filter(isWork);
      if (!work.length) return;
      let topE = 0;
      work.forEach(s => {
        const v = setVol(s), e = setE1rm(s);
        if (e > topE) topE = e;
        sets++; tonnage += v;
        vol[ex.primary] += v;
        if (old) volOld[ex.primary] += v;
        ex.sec.forEach(m => {
          if (vol[m] == null) return;
          vol[m] += v * 0.5;
          if (old) volOld[m] += v * 0.5;
        });
      });
      if (topE > best[ex.primary]) best[ex.primary] = topE;
      if (old && topE > bestOld[ex.primary]) bestOld[ex.primary] = topE;
      /* a PR is a top set that beats this exercise's own previous best */
      if (seen[en.exId] == null) seen[en.exId] = topE;
      else if (topE > seen[en.exId] * 1.0001){ prs++; if (old) prsOld++; seen[en.exId] = topE; }
    });
  });
  _logKey = key;
  _logStats = { vol, volOld, best, bestOld, prs, prsOld, sets, tonnage, sessions: done.length };
  return _logStats;
}

/* Development is mostly accumulated work, because that is the thing that
   actually takes time. Strength and PRs are gated behind that work: walking
   in strong on day one should not hand you a finished physique, but once the
   volume is there, strength is what separates big from merely busy. */
function devFrom(vol, best, prs, bw){
  const out = {};
  DEV_KEYS.forEach(k => {
    const v    = sum(DEV_MUSCLES[k], m => vol[m] || 0);
    const vT   = 1 - Math.exp(-Math.pow(v / DEV_SCALE[k], 0.72));
    const gate = cl01(vT * 2);
    const top  = Math.max.apply(null, DEV_MUSCLES[k].map(m => best[m] || 0).concat([0]));
    const sT   = cl01(top / (bw * DEV_STD[k]));
    const pr   = Math.min(0.10, prs * 0.004);
    out[k] = cl01(0.05 + 0.95 * (0.75*vT + 0.25*sT*gate + pr*gate));
  });
  return out;
}
function charDev(){
  const st = logStats(), b = latestBw();
  return devFrom(st.vol, st.best, st.prs, (b && b.kg) || 80);
}
function charDevOld(){                                   /* the same man, 30 days ago */
  const st = logStats(), b = latestBw();
  return devFrom(st.volOld, st.bestOld, st.prsOld, (b && b.kg) || 80);
}

const LEVEL_N = ['Untrained','Novice','Beginner','Trainee','Lifter','Athlete',
                 'Built','Strong','Advanced','Freak','Monster'];
function charLevel(dev){
  const d = dev || charDev();
  const overall = sum(DEV_KEYS, k => d[k]) / DEV_KEYS.length;
  const raw = overall * 10.999, lv = Math.min(10, Math.floor(raw));
  return { overall, lv, name: LEVEL_N[lv], next: LEVEL_N[Math.min(10, lv+1)], pct: cl01(raw - lv) };
}
/* one place that turns the saved cosmetics into a look, so the character
   page, the greeting and the rail figure can never drift apart */
function charLook(pose){
  const c = CH();
  return { skin:c.skin, hair:c.hair, hairCol:c.hairCol, beard:c.beard, brow:c.brow,
           acc:c.acc, trunks:c.trunks, tattoo:c.tattoo, pose: pose || c.pose };
}
function charFigure(h){
  return mmFigure(charLook(), charDev(), { h: h || 250 });
}
/* which development region an exercise trains */
function regionOf(exId){
  const ex = exById(exId); if (!ex) return 'chest';
  return DEV_KEYS.find(k => DEV_MUSCLES[k].indexOf(ex.primary) >= 0) || 'chest';
}

/* the silhouette under the plates: limbs as thick round strokes, torso as
   one path. Primitives rather than one hand-drawn outline, so it cannot
   drift out of register with the plates above. */
function bodySil(){
  const f = 'var(--panel-in)', ln = 'var(--line)';
  const LIMBS = [
    ['M26 58L24 92L33 128', 18],   /* left arm  */
    ['M90 58L92 92L83 128', 18],   /* right arm */
    ['M46 128L45 170L46 202', 22], /* left leg  */
    ['M70 128L71 170L70 202', 22]  /* right leg */
  ];
  const TORSO = 'M40 48C24 52 16 58 16 70C16 84 20 94 24 104L34 100' +
                'C34 114 35 124 37 132L79 132C81 124 82 114 82 100L92 104' +
                'C96 94 100 84 100 70C100 58 92 52 76 48Z';
  /* each shape is laid down twice — a wider pass in the line colour, then the
     fill on top. That is what gives the chart an outline it can be read by. */
  const limbs = (col, pad) => LIMBS.map(l =>
    '<path d="' + l[0] + '" stroke="' + col + '" stroke-width="' + (l[1] + pad) +
    '" stroke-linecap="round" fill="none"/>').join('');
  return '<g>' +
    limbs(ln, 2) + limbs(f, 0) +
    '<g stroke="' + ln + '" stroke-width="1" fill="' + f + '">' +
      '<ellipse cx="45" cy="208" rx="7.5" ry="5"/>' +
      '<ellipse cx="71" cy="208" rx="7.5" ry="5"/>' +

      '<path d="' + TORSO + '"/>' +
      '<ellipse cx="58" cy="27" rx="13" ry="15"/>' +
    '</g></g>';
}
function bodyMap(map, opt){
  const o = opt || {};
  const peak = Math.max.apply(null, MUSCLE_KEYS.map(k => map[k] || 0).concat([1]));
  const fill   = o.done ? 'var(--good)' : 'var(--acc)';
  const stroke = o.done ? 'var(--good)' : 'var(--acc-hi)';
  const view = (side, dx) => {
    const P = BODY_PLATES[side];
    let g = '<g transform="translate(' + dx + ',0)">' + bodySil();
    Object.keys(P).forEach(k => {
      const v = cl01((map[k] || 0) / peak);
      if (v <= 0.001){
        /* an unworked muscle still has to be legible, or the chart reads as
           a silhouette with a few floating patches on it */
        g += '<path d="' + P[k] + '" fill="var(--line)" opacity=".72">' +
             '<title>' + esc(MUSCLES[k].n) + ' · not worked today</title></path>';
      } else {
        g += '<path d="' + P[k] + '" fill="' + fill + '" opacity="' + r1(0.26 + 0.56*v) + '" stroke="' + stroke +
             '" stroke-width="' + r1(0.4 + 0.9*v) + '"' + (v > 0.6 ? ' filter="url(#mglow)"' : '') + '>' +
             '<title>' + esc(MUSCLES[k].n) + ' · ' + num(map[k],1) + ' sets</title></path>';
      }
    });
    g += '<text x="58" y="220" text-anchor="middle" class="bm-l">' + (side === 'front' ? 'FRONT' : 'BACK') + '</text></g>';
    return g;
  };
  return '<svg class="bmap" viewBox="0 0 250 226" role="img" aria-label="Muscle groups worked today">' +
    '<defs><filter id="mglow" x="-45%" y="-45%" width="190%" height="190%">' +
      '<feGaussianBlur stdDeviation="2.2" result="b"/>' +
      '<feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>' +
    view('front', 4) + view('back', 130) + '</svg>';
}

/* what today asks for: logged if there is a session, planned otherwise */
function daySetMap(date){
  const ses = doneSessions().filter(s => s.date === date);
  if (ses.length) return { map: rangeMuscle(ses).sets, done:true };
  const map = {};
  MUSCLE_KEYS.forEach(k => map[k] = 0);
  const plan = splitFor(parseDate(date).getDay());
  if (plan.kind === 'tpl'){
    plan.tpl.ex.forEach(x => {
      const ex = exById(x.exId); if (!ex) return;
      map[ex.primary] += x.sets;
      ex.sec.forEach(m => { if (map[m] != null) map[m] += x.sets * 0.5; });
    });
  }
  return { map, done:false };
}

/* the Today card — a body that changes with the day */
function todayBodyCard(){
  const t = daySetMap(today());
  const plan = splitFor(parseDate(today()).getDay());
  const worked = MUSCLE_KEYS.filter(k => t.map[k] > 0).sort((a,b) => t.map[b] - t.map[a]);
  const lv = charLevel();

  let head, sub;
  if (t.done){
    head = 'Lit up today';
    sub = num(sum(worked, k => t.map[k]),0) + ' sets across ' + worked.length + ' muscle' + (worked.length===1?'':'s');
  } else if (plan.kind === 'rest'){
    head = 'Dark today';
    sub = 'Rest day on your split — nothing is being worked';
  } else if (plan.kind === 'tpl'){
    head = shortTplName(plan.tpl) + ' day';
    sub = worked.slice(0,5).map(k => MUSCLES[k].n).join(', ') + (worked.length > 5 ? ' +' + (worked.length-5) + ' more' : '');
  } else {
    head = 'Open day';
    sub = 'No routine set for ' + DOW_FULL[parseDate(today()).getDay()] + ' — start anything and it lights up live';
  }

  return '<div class="panel pad stack-sm">' +
    '<div class="between wrap" style="gap:8px">' +
      '<div style="min-width:0"><div class="eyebrow">' + (t.done ? 'Worked today' : 'On the board') + '</div>' +
        '<b style="font-family:var(--f-disp);font-size:16.5px">' + esc(head) + '</b>' +
        '<div class="tiny muted" style="margin-top:2px">' + esc(sub) + '</div></div>' +
      '<span class="tag">' + (t.done ? 'Logged' : 'Planned') + '</span></div>' +
    '<div class="bmwrap">' + bodyMap(t.map, { done: t.done }) + '</div>' +
    (worked.length
      ? '<div class="row wrap" style="gap:5px">' + worked.slice(0,8).map(k =>
          '<span class="chip' + (t.done ? ' on' : '') + '">' + esc(MUSCLES[k].n) +
          ' <b class="num">' + num(t.map[k],1) + '</b></span>').join('') + '</div>'
      : '') +
    '<button class="lrow slim" data-act="go" data-v="character">' +
      '<span class="chwrap sm">' + mmFigure(charLook('relaxed'), charDev(), { h:42, crop:'bust' }) + '</span>' +
      '<span class="grow" style="text-align:left">' +
        '<span class="ln">' + esc(CH().name || 'Your character') + '</span>' +
        '<span class="lm">Level ' + lv.lv + ' · ' + esc(lv.name) + ' — grows as you get stronger</span></span>' +
      '<span style="width:17px;color:var(--ink-3)">' + I.chev + '</span></button>' +
  '</div>';
}

            (up > 0.004 ? '<span class="chip pr">+' + r1(up*100) + '</span>' : '<span class="tiny dim">held</span>') +
            '<b class="num">' + Math.round(now*100) + '</b></span></div>' +
        '<div class="bar"><i style="width:' + r1(now*100) + '%"></i>' +
          (up > 0.004 ? '<u style="left:' + r1(was*100) + '%;width:' + r1(up*100) + '%"></u>' : '') + '</div>' +
        '<div class="mini dim">' + DEV_MUSCLES[k].map(m => MUSCLES[m].n).join(' · ') + '</div></div>';
    }).join('') + '</div>';

  const rp = recentPRs(30);
  out += '<div class="sec"><span class="eyebrow">What grew him</span><span class="tiny dim">last 30 days</span></div>';
  out += rp.length
    ? '<div class="stack-sm">' + rp.map(p =>
        '<div class="lrow slim"><span class="grow" style="text-align:left">' +
          '<span class="ln">' + esc(exName(p.exId)) + '</span>' +
          '<span class="lm">' + fmtDate(p.date,'short') + ' · ' + esc(DEV_LABEL[regionOf(p.exId)]) + '</span></span>' +
          '<span class="lv" style="color:var(--hot)">+' + U.w(p.gain,1) + '</span></div>').join('') + '</div>'
    : '<div class="panel pad tiny muted">No PRs in the last 30 days. Beat a top set and he changes shape — ' +
      'the region that did the work is the region that grows.</div>';

  out += '<div class="sec"><span class="eyebrow">Customise</span><span class="tiny dim">look only</span></div>';
  out += '<div class="panel pad stack">' +
    '<div class="field"><label>Name</label>' +
      '<input class="inp" id="chName" value="' + esc(c.name) + '" placeholder="Give him a name" maxlength="24" data-act="chName"></div>' +
    '<div class="field"><label>Pose</label><div class="seg wrap">' +
      POSES.map(p => '<button class="' + (c.pose===p?'on':'') + '" data-act="chSet" data-k="pose" data-v="' + p + '">' +
        esc(POSE_N[p]) + '</button>').join('') + '</div></div>' +
    '<div class="field"><label>Skin</label><div class="swrow">' +
      SKINS.map(v => '<button class="sw' + (c.skin===v?' on':'') + '" style="background:' + v +
        '" data-act="chSet" data-k="skin" data-v="' + v + '" aria-label="Skin tone"></button>').join('') + '</div></div>' +
    '<div class="field"><label>Hair</label><div class="row wrap" style="gap:5px">' +
      HAIRS.map(v => '<button class="chip' + (c.hair===v?' on':'') + '" data-act="chSet" data-k="hair" data-v="' + v + '">' +
        esc(HAIR_N[v]) + '</button>').join('') + '</div></div>' +
    '<div class="field"><label>Hair colour</label><div class="swrow">' +
      HAIRCOLS.map(v => '<button class="sw' + (c.hairCol===v?' on':'') + '" style="background:' + v +
        '" data-act="chSet" data-k="hairCol" data-v="' + v + '" aria-label="Hair colour"></button>').join('') + '</div></div>' +
    '<div class="field"><label>Face</label><div class="row wrap" style="gap:5px">' +
      BEARDS.map(v => '<button class="chip' + (c.beard===v?' on':'') + '" data-act="chSet" data-k="beard" data-v="' + v + '">' +
        esc(BEARD_N[v]) + '</button>').join('') +
      '<button class="chip' + (c.brow==='hard'?' on':'') + '" data-act="chSet" data-k="brow" data-v="' +
        (c.brow==='hard'?'calm':'hard') + '">Hard brow</button></div></div>' +
    '<div class="field"><label>Gear</label><div class="row wrap" style="gap:5px">' +
      ACCS.map(v => '<button class="chip' + (c.acc===v?' on':'') + '" data-act="chSet" data-k="acc" data-v="' + v + '">' +
        esc(ACC_N[v]) + '</button>').join('') + '</div></div>' +
    '<div class="field"><label>Ink</label><div class="row wrap" style="gap:5px">' +
      TATTOOS.map(v => '<button class="chip' + (c.tattoo===v?' on':'') + '" data-act="chSet" data-k="tattoo" data-v="' + v + '">' +
        esc(TATTOO_N[v]) + '</button>').join('') + '</div></div>' +
    '<div class="field"><label>Trunks</label><div class="swrow">' +
      TRUNKS.map(v => '<button class="sw' + (c.trunks===v?' on':'') + '" style="background:' + v +
        '" data-act="chSet" data-k="trunks" data-v="' + v + '" aria-label="Trunks colour"></button>').join('') + '</div></div>' +
  '</div>';

  out += '<div class="panel pad mini muted">A cartoon, not a body-composition estimate. It reflects what you have logged, ' +
    'not what you look like in the mirror — and it only moves when the numbers do.</div>';
  return out;
};

ACTS.chSet   = (el) => { CH()[el.dataset.k] = el.dataset.v; saveNow(); render(); };
ACTS.chName  = (el) => { CH().name = el.value.trim().slice(0,24); saveNow(); render(); };
ACTS.chReset = () => {
  const keep = CH().name;
  DB.character = defaultCharacter();
  DB.character.name = keep;
  saveNow(); toast('Look reset — muscle stays earned'); render();
};

/* ------------------------------------------------------------
   He is never quite still. Four poses stacked and cross-faded on
   a loop in CSS — waves, flexes, settles, waves again. No timers
   to leak, and under prefers-reduced-motion he simply stands.
------------------------------------------------------------ */
/* the routine, in order: he waves you in, then runs the round */
const GREET_FRAMES = ['relaxed','wave','wave2','flex','abs','sidetri','sidechest','back','most'];
function charFrames(h){
  const dev = charDev();
  return GREET_FRAMES.map((p,i) => '<span class="gf g' + i + '">' +
    mmFigure(charLook(p), dev, { h: h }) + '</span>').join('');
}
function charGreeter(h){
  const ph = h || 92;
  return '<button class="greeter loop" data-act="go" data-v="character"' +
    ' style="height:' + ph + 'px;width:' + Math.round(ph*166/292) + 'px"' +
    ' aria-label="' + esc(CH().name || 'Your character') + '">' +
    charFrames(ph) + '</button>';
}
/* the rail runs out of tabs long before it runs out of column,
   so he stands in whatever is left of it */
function railFigure(){
  const lv = charLevel();
  return '<button class="railfig" data-act="go" data-v="character" aria-label="Your character">' +
    '<span class="rf-stage loop">' + charFrames(260) + '</span>' +
    '<span class="rf-cap"><b>' + esc(CH().name || 'Your character') + '</b>' +
      '<span>Level ' + lv.lv + ' · ' + esc(lv.name) + '</span></span></button>';
}

/* ============================================================
   COACH ROSTER — pick one of the eight
   ============================================================ */
function coachRoster(){
  const cur = activeCoach();
  return '<div class="sec"><span class="eyebrow">Your coach</span>' +
      '<button class="sec-link" data-act="coachRename">Rename ' + esc(coachName(cur)) + '</button></div>' +
    '<div class="croster">' + COACHES.map(c => {
      const on = c.id === cur.id;
      return '<button class="ccard' + (on ? ' on' : '') + '" style="--ca:' + c.accent + '" data-act="coachPick" data-v="' + c.id + '">' +
        '<span class="cfig">' + coachAvatar(c, 130) + '</span>' +
        '<span class="cn">' + esc(coachName(c)) + '</span>' +
        '<span class="ct">' + esc(c.tag) + '</span>' +
        '<span class="cwm" aria-hidden="true">' + esc(c.name.split(' ').pop()) + '</span>' +
        '<span class="cb">' + esc(c.blurb) + '</span>' +
        (on ? '<span class="cmark">' + I.check + '</span>' : '') +
      '</button>';
    }).join('') + '</div>' +
    '<div class="panel pad mini muted">Each preset is named for the lifter whose documented method it ' +
      'encodes, and each carries its own instructions — so the advice genuinely changes when you switch. ' +
      'They are coaches built on those methods, not those men: no likeness is used, none speaks in the ' +
      'first person as him, and none will invent a quote. Rename any of them to whatever you like.</div>';
}
ACTS.coachPick = (el) => {
  CFG.coachId = el.dataset.v; saveCfg();
  toast(coachName(activeCoach()) + ' is your coach');
  render();
};
ACTS.coachRename = () => {
  const c = activeCoach();
  openSheet({
    title:'Rename ' + c.name,
    sub:'Your label for this coach — the instructions behind him do not change',
    body:'<div class="stack"><div class="field"><label>Name</label>' +
      '<input class="inp" id="cnm" maxlength="22" value="' + esc(coachName(c)) + '" placeholder="' + esc(c.name) + '"></div>' +
      '<button class="btn btn-pri btn-block" id="cnmSave">Save</button>' +
      '<button class="btn btn-ghost btn-block tiny" id="cnmReset">Back to ' + esc(c.name) + '</button></div>',
    mount(root, inst){
      const done = () => { saveCfg(); inst.close(); render(); };
      root.querySelector('#cnmSave').onclick = () => {
        const v = root.querySelector('#cnm').value.trim().slice(0,22);
        CFG.coachNames = CFG.coachNames || {};
        if (v && v !== c.name) CFG.coachNames[c.id] = v; else delete CFG.coachNames[c.id];
        done();
      };
      root.querySelector('#cnmReset').onclick = () => {
        if (CFG.coachNames) delete CFG.coachNames[c.id];
        done();
      };
    }
  });
};

/* ============================================================
   THE WAY IN
   The first screen used to be a form on a grey page. It is the
   only part of the app a new person sees before they trust it
   with anything, so it gets a loaded bar and a lifter instead.
   ============================================================ */
function barbellSvg(){
  /* calibrated plate colours, heaviest inboard, the way a bar is actually loaded */
  const P = [['var(--p25)',26],['var(--p20)',23],['var(--p15)',20],['var(--p10)',17]];
  let g = '<rect x="18" y="32" width="264" height="6" rx="3" fill="#8d949b"/>' +
          '<rect x="18" y="32" width="264" height="2.2" rx="1.1" fill="#cfd6dc"/>';
  for (let i = 0; i < 9; i++) g += '<path d="M'+(128+i*5.6)+' 32.5v5" stroke="#5c6773" stroke-width="1"/>';
  P.forEach((p, i) => {
    const off = 45 + i*17;
    [-1,1].forEach(sgn => {
      const x = 150 + sgn*off;
      g += '<rect x="'+(x-5)+'" y="'+(35-p[1])+'" width="10" height="'+(p[1]*2)+'" rx="3.5" fill="'+p[0]+'"/>' +
           '<rect x="'+(x-5)+'" y="'+(35-p[1])+'" width="3.2" height="'+(p[1]*2)+'" rx="1.6" fill="rgba(255,255,255,.20)"/>' +
           '<rect x="'+(x-5)+'" y="'+(35-p[1])+'" width="10" height="'+(p[1]*2)+'" rx="3.5" fill="none" stroke="rgba(0,0,0,.35)"/>';
    });
  });
  [-1,1].forEach(sgn => {
    const x = 150 + sgn*112;
    g += '<rect x="'+(x-4)+'" y="25" width="8" height="20" rx="2" fill="#6b7885"/>';
  });
  return '<svg class="bbell" viewBox="0 0 300 70" role="img" aria-hidden="true">' +
    '<g class="bb-lift">' + g + '</g></svg>';
}
function gateStage(title, sub){
  return '<div class="stage">' +
    '<div class="st-mark">Iron Ledger</div>' +
    '<div class="st-name">' + esc(title) + '</div>' +
    (sub ? '<div class="st-sub">' + esc(sub) + '</div>' : '') +
    '<div class="st-fig loop">' + charFrames(150) + '</div>' +
    '<div class="st-bar">' + barbellSvg() + '</div>' +
  '</div>';
}
