<title>Iron Ledger</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">

<style>
/* ============================================================
   IRON LEDGER — tokens
   Dark-first design. Bare :root carries the DARK palette;
   light is layered on via prefers-color-scheme AND [data-theme].
   ============================================================ */
:root{
  color-scheme: dark;

  --bg:        #04070a;
  --bg-deep:   #000000;
  --panel:     #0f1418;
  --panel-hi:  #171e25;
  --panel-in:  #090d11;
  --line:      #242d37;
  --line-soft: #181f26;

  --ink:       #eef2f5;
  --ink-2:     #9aa8b4;
  --ink-3:     #6b7885;

  --acc:       #2f7fe0;
  --acc-hi:    #589bee;
  --acc-wash:  rgba(47,127,224,.14);
  --acc-ink:   #06101c;

  --hot:       #e0453f;
  --hot-wash:  rgba(224,69,63,.14);

  --good:      #0ca30c;
  --warn:      #fab219;
  --crit:      #d03b3b;

  /* validated categorical series — dark column */
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500;
  --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767;

  --grid:      rgba(154,168,180,.16);

  /* calibrated plate colors */
  --p25:#c8102e; --p20:#0057b8; --p15:#ffd100; --p10:#009639;
  --p5:#e8e8e8;  --p2:#0b0b0b;  --p1:#8d949b;

  --r:6px; --r-lg:10px;
  --shadow: 0 1px 0 rgba(255,255,255,.04) inset, 0 8px 24px -18px #000;

  --f-disp:'Archivo','Helvetica Neue',Arial,sans-serif;
  --f-body:'IBM Plex Sans',system-ui,-apple-system,sans-serif;
  --f-num:'IBM Plex Mono',ui-monospace,Menlo,monospace;

  --tab-h: 62px;
}

@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    color-scheme: light;
    --bg:#f2f4f6; --bg-deep:#e7eaed; --panel:#ffffff; --panel-hi:#f7f9fa;
    --panel-in:#eef1f4; --line:#dbe1e7; --line-soft:#e7ecf0;
    --ink:#0f1519; --ink-2:#52606c; --ink-3:#7b8792;
    --acc:#0057b8; --acc-hi:#00449c; --acc-wash:rgba(0,87,184,.10); --acc-ink:#ffffff;
    --hot:#c8102e; --hot-wash:rgba(200,16,46,.10);
    --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100;
    --s5:#e87ba4; --s6:#008300; --s7:#4a3aa7; --s8:#e34948;
    --grid:rgba(15,21,25,.12);
    --p5:#d7dade; --p2:#141414;
    --shadow: 0 1px 0 rgba(255,255,255,.7) inset, 0 8px 22px -18px rgba(15,21,25,.5);
  }
}
:root[data-theme="light"]{
  color-scheme: light;
  --bg:#f2f4f6; --bg-deep:#e7eaed; --panel:#ffffff; --panel-hi:#f7f9fa;
  --panel-in:#eef1f4; --line:#dbe1e7; --line-soft:#e7ecf0;
  --ink:#0f1519; --ink-2:#52606c; --ink-3:#7b8792;
  --acc:#0057b8; --acc-hi:#00449c; --acc-wash:rgba(0,87,184,.10); --acc-ink:#ffffff;
  --hot:#c8102e; --hot-wash:rgba(200,16,46,.10);
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100;
  --s5:#e87ba4; --s6:#008300; --s7:#4a3aa7; --s8:#e34948;
  --grid:rgba(15,21,25,.12);
  --p5:#d7dade; --p2:#141414;
  --shadow: 0 1px 0 rgba(255,255,255,.7) inset, 0 8px 22px -18px rgba(15,21,25,.5);
}

*,*::before,*::after{ box-sizing:border-box; }
html,body{ margin:0; padding:0; }
body{
  background:var(--bg);
  color:var(--ink);
  font-family:var(--f-body);
  font-size:15px;
  line-height:1.5;
  -webkit-text-size-adjust:100%;
  -webkit-font-smoothing:antialiased;
  overscroll-behavior-y:none;
}
button,input,select,textarea{ font:inherit; color:inherit; }
button{ background:none; border:0; cursor:pointer; }
:focus-visible{ outline:2px solid var(--acc-hi); outline-offset:2px; border-radius:4px; }
::-webkit-scrollbar{ width:10px; height:10px; }
::-webkit-scrollbar-thumb{ background:var(--line); border-radius:8px; }
::-webkit-scrollbar-track{ background:transparent; }

@media (prefers-reduced-motion: reduce){
  *{ animation-duration:.001ms !important; transition-duration:.001ms !important; }
}

/* ---------- primitives ---------- */
.num{ font-family:var(--f-num); font-variant-numeric:tabular-nums; letter-spacing:-.02em; }
.eyebrow{
  font-family:var(--f-disp); font-weight:700; font-size:10.5px;
  letter-spacing:.14em; text-transform:uppercase; color:var(--ink-3);
}
h1,h2,h3,h4{ font-family:var(--f-disp); margin:0; text-wrap:balance; letter-spacing:-.015em; }
h1{ font-size:26px; font-weight:800; }
h2{ font-size:19px; font-weight:700; }
h3{ font-size:15px; font-weight:700; }
h4{ font-size:13px; font-weight:600; }

.panel{
  background:var(--panel); border:1px solid var(--line);
  border-radius:var(--r); box-shadow:var(--shadow);
}
.pad{ padding:14px; }
.row{ display:flex; align-items:center; gap:10px; }
.col{ display:flex; flex-direction:column; }
.between{ display:flex; align-items:center; justify-content:space-between; gap:10px; }
.wrap{ flex-wrap:wrap; }
.grow{ flex:1 1 auto; min-width:0; }
.muted{ color:var(--ink-2); }
.dim{ color:var(--ink-3); }
.hot{ color:var(--hot); }
.tiny{ font-size:12px; }
.mini{ font-size:11px; }
.center{ text-align:center; }
.hide{ display:none !important; }
.stack{ display:flex; flex-direction:column; gap:12px; }
.stack-sm{ display:flex; flex-direction:column; gap:8px; }
.grid2{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.grid3{ display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
.scroll-x{ overflow-x:auto; -webkit-overflow-scrolling:touch; }
.nowrap{ white-space:nowrap; }
.trunc{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

/* ---------- buttons ---------- */
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:7px;
  padding:10px 14px; border-radius:var(--r); border:1px solid var(--line);
  background:var(--panel-hi); color:var(--ink);
  font-family:var(--f-disp); font-weight:600; font-size:13.5px;
  transition:background .12s, border-color .12s, transform .06s;
  min-height:42px; user-select:none;
}
.btn:hover{ border-color:var(--ink-3); }
.btn:active{ transform:translateY(1px); }
.btn-pri{ background:var(--acc); border-color:var(--acc); color:var(--acc-ink); }
.btn-pri:hover{ background:var(--acc-hi); border-color:var(--acc-hi); }
.btn-hot{ background:var(--hot); border-color:var(--hot); color:#fff; }
.btn-ghost{ background:transparent; }
.btn-sm{ padding:6px 10px; min-height:32px; font-size:12.5px; }
.btn-lg{ padding:14px 18px; min-height:52px; font-size:15px; }
.btn-block{ width:100%; }
.btn[disabled]{ opacity:.42; pointer-events:none; }
.btn > svg{ width:16px; height:16px; flex:0 0 auto; }
.btn-lg > svg{ width:18px; height:18px; }
.btn-sm > svg{ width:14px; height:14px; }
.chip > svg{ width:13px; height:13px; flex:0 0 auto; }
.lrow > svg, .goal > svg{ width:17px; height:17px; flex:0 0 auto; }
.icon-btn > svg{ width:19px; height:19px; flex:0 0 auto; }
.icon-btn{
  width:38px; height:38px; min-height:38px; padding:0; border-radius:var(--r);
  display:inline-flex; align-items:center; justify-content:center;
  border:1px solid var(--line); background:var(--panel-hi); flex:0 0 auto;
}
.icon-btn.bare{ border-color:transparent; background:transparent; color:var(--ink-2); }
.icon-btn.bare:hover{ color:var(--ink); background:var(--panel-hi); }
.icon-btn[disabled]{ opacity:.35; pointer-events:none; }

/* ---------- fields ---------- */
.field{ display:flex; flex-direction:column; gap:5px; min-width:0; }
.field > label{ font-size:11px; letter-spacing:.09em; text-transform:uppercase; color:var(--ink-3); font-weight:600; }
.inp{
  width:100%; padding:10px 12px; min-height:42px;
  background:var(--panel-in); border:1px solid var(--line);
  border-radius:var(--r); color:var(--ink); font-size:15px;
}
.inp:focus{ border-color:var(--acc); outline:none; }
.inp.num{ font-family:var(--f-num); }
select.inp{
  appearance:none; padding-right:32px;
  background-image:linear-gradient(45deg,transparent 49%,var(--ink-3) 51%),linear-gradient(-45deg,transparent 49%,var(--ink-3) 51%);
  background-size:6px 6px,6px 6px;
  background-position:calc(100% - 17px) calc(50% + 2px),calc(100% - 11px) calc(50% + 2px);
  background-repeat:no-repeat;
}
textarea.inp{ min-height:70px; resize:vertical; line-height:1.45; }

/* ---------- chips ---------- */
.chip{
  display:inline-flex; align-items:center; gap:6px;
  padding:5px 10px; border-radius:100px; border:1px solid var(--line);
  background:var(--panel-hi); font-size:12px; font-weight:500; color:var(--ink-2);
  white-space:nowrap;
}
.chip.on{ background:var(--acc-wash); border-color:var(--acc); color:var(--ink); }
.chip.pr{ background:var(--hot-wash); border-color:var(--hot); color:var(--hot); font-weight:600; }
.tag{
  font-family:var(--f-disp); font-weight:700; font-size:9.5px; letter-spacing:.1em;
  text-transform:uppercase; padding:3px 6px; border-radius:3px;
  background:var(--panel-in); color:var(--ink-3); border:1px solid var(--line-soft);
  white-space:nowrap;
}
.dot{ width:9px; height:9px; border-radius:3px; flex:0 0 auto; }

/* ---------- segmented ---------- */
.seg{ display:inline-flex; background:var(--panel-in); border:1px solid var(--line); border-radius:var(--r); padding:3px; gap:2px; }
.seg > button{
  padding:7px 12px; border-radius:4px; font-size:12.5px; font-weight:600;
  font-family:var(--f-disp); color:var(--ink-3); white-space:nowrap;
}
.seg > button.on{ background:var(--panel); color:var(--ink); box-shadow:0 1px 3px -1px rgba(0,0,0,.4); }

/* ---------- app shell ---------- */
#shell{ display:flex; min-height:100vh; }
#rail{ display:none; }
main{ flex:1 1 auto; min-width:0; padding-bottom:calc(var(--tab-h) + env(safe-area-inset-bottom,0px) + 12px); }
.view{ max-width:940px; margin:0 auto; padding:14px 14px 24px; }

.topbar{
  position:sticky; top:0; z-index:30;
  background:var(--bg); border-bottom:1px solid var(--line-soft);
}
.topbar-in{ max-width:940px; margin:0 auto; padding:12px 14px; display:flex; align-items:center; gap:12px; }
.brand{ display:flex; align-items:center; gap:9px; }
.brand-mark{
  width:28px; height:28px; border-radius:5px; flex:0 0 auto;
  background:linear-gradient(160deg,var(--acc),var(--acc-hi));
  display:grid; place-items:center; color:var(--acc-ink);
  font-family:var(--f-disp); font-weight:800; font-size:14px;
  padding:5px;
}
.brand-mark > svg{ width:100%; height:100%; display:block; }
.brand-name{ font-family:var(--f-disp); font-weight:800; font-size:15px; letter-spacing:-.01em; white-space:nowrap; }
@media (max-width:440px){
  .icon-btn{ width:34px; height:34px; min-height:34px; }
  .topbar-in{ gap:8px; padding:10px 12px; }
  #topactions{ gap:2px; }
}

#tabbar{
  position:fixed; bottom:0; left:0; right:0; z-index:40;
  height:calc(var(--tab-h) + env(safe-area-inset-bottom,0px));
  padding-bottom:env(safe-area-inset-bottom,0px);
  background:var(--bg-deep);
  border-top:1px solid var(--line);
  display:flex;
}
#tabbar button{
  flex:1 1 0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px;
  color:var(--ink-3); position:relative; padding:0 2px;
}
#tabbar button .tb-l{ font-family:var(--f-disp); font-weight:700; font-size:9.5px; letter-spacing:.06em; text-transform:uppercase; }
#tabbar button.on{ color:var(--acc-hi); }
#tabbar button.on::before{ content:''; position:absolute; top:0; left:22%; right:22%; height:2px; background:var(--acc); border-radius:0 0 3px 3px; }
#tabbar svg{ width:21px; height:21px; }

@media (min-width:860px){
  #tabbar{ display:none; }
  main{ padding-bottom:24px; }
  .view{ padding:20px 24px 40px; }
  #rail{
    display:flex; flex-direction:column; gap:4px;
    width:214px; flex:0 0 214px; padding:16px 12px;
    border-right:1px solid var(--line); background:var(--bg-deep);
    position:sticky; top:0; height:100vh;
  }
  #rail .rb{
    display:flex; align-items:center; gap:11px; padding:10px 11px; border-radius:var(--r);
    color:var(--ink-2); font-family:var(--f-disp); font-weight:600; font-size:13.5px; text-align:left;
  }
  #rail .rb:hover{ background:var(--panel); color:var(--ink); }
  #rail .rb.on{ background:var(--acc-wash); color:var(--ink); box-shadow:inset 2px 0 0 var(--acc); }
  #rail svg{ width:19px; height:19px; flex:0 0 auto; }
  /* the rail already carries the wordmark — don't repeat it in the bar */
  .topbar .brand-mark, .topbar .brand-name{ display:none; }
  .topbar-in{ padding:14px 24px; }
  #topdate{ font-size:12px; }
}
</style>

<style>
/* ============================================================
   IRON LEDGER — components
   ============================================================ */

/* ---------- section header ---------- */
.sec{ display:flex; align-items:baseline; justify-content:space-between; gap:10px; margin:2px 0 -2px; }
.sec .eyebrow{ color:var(--ink-3); }
.sec-link{ font-family:var(--f-disp); font-weight:600; font-size:12px; color:var(--acc-hi); }

/* ---------- stat tile ---------- */
.tile{
  background:var(--panel); border:1px solid var(--line); border-radius:var(--r);
  padding:12px 13px; display:flex; flex-direction:column; gap:3px; min-width:0;
}
.tile .tl{ font-family:var(--f-disp); font-weight:700; font-size:9.5px; letter-spacing:.12em; text-transform:uppercase; color:var(--ink-3); }
.tile .tv{ font-family:var(--f-num); font-weight:600; font-size:23px; line-height:1.1; font-variant-numeric:tabular-nums; letter-spacing:-.03em; }
.tile .ts{ font-size:11.5px; color:var(--ink-3); }
.tile .tv small{ font-size:12px; font-weight:500; color:var(--ink-3); letter-spacing:0; }

/* hero number (today's hard sets etc.) */
.hero{
  background:linear-gradient(170deg,var(--panel-hi),var(--panel));
  border:1px solid var(--line); border-radius:var(--r-lg); padding:16px 16px 14px;
  position:relative; overflow:hidden;
}
.hero::after{
  content:''; position:absolute; inset:0 0 auto 0; height:1px;
  background:linear-gradient(90deg,transparent,var(--acc),transparent); opacity:.5;
}
.hero-v{ font-family:var(--f-num); font-weight:600; font-size:44px; line-height:1; letter-spacing:-.045em; font-variant-numeric:tabular-nums; }
.hero-v small{ font-size:16px; color:var(--ink-3); letter-spacing:0; margin-left:4px; }

/* ---------- delta ---------- */
.delta{ display:inline-flex; align-items:center; gap:3px; font-family:var(--f-num); font-size:11.5px; font-weight:500; }
.delta.up{ color:var(--good); }
.delta.dn{ color:var(--crit); }
.delta.flat{ color:var(--ink-3); }

/* ---------- progress bar ---------- */
.pbar{ height:8px; border-radius:100px; background:var(--panel-in); overflow:hidden; border:1px solid var(--line-soft); }
.pbar > i{ display:block; height:100%; border-radius:100px; background:var(--acc); transition:width .5s cubic-bezier(.2,.7,.3,1); }
.pbar.thick{ height:12px; }
.pbar > i.done{ background:var(--good); }
.pbar > i.late{ background:var(--warn); }

/* ---------- ring ---------- */
.ring{ position:relative; display:grid; place-items:center; flex:0 0 auto; }
.ring svg{ transform:rotate(-90deg); display:block; }
.ring .rc{ position:absolute; text-align:center; line-height:1.15; }
.ring .rc b{ font-family:var(--f-num); font-weight:600; font-size:15px; display:block; font-variant-numeric:tabular-nums; }
.ring .rc span{ font-size:9px; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-3); font-family:var(--f-disp); font-weight:700; }
.ring-track{ stroke:var(--panel-in); }

/* ---------- charts ---------- */
.chart{ width:100%; display:block; overflow:visible; touch-action:pan-y; }
.chart .gl{ stroke:var(--grid); stroke-width:1; }
.chart .al{ stroke:var(--line); stroke-width:1; }
.chart text{ font-family:var(--f-num); font-size:9.5px; fill:var(--ink-3); font-variant-numeric:tabular-nums; }
.chart .ttl{ font-family:var(--f-disp); font-weight:700; }
.chart-wrap{ position:relative; }
.tipbox{
  position:absolute; pointer-events:none; z-index:5; opacity:0; transition:opacity .1s;
  background:var(--panel-hi); border:1px solid var(--line); border-radius:5px;
  padding:7px 9px; font-size:11.5px; box-shadow:0 8px 20px -10px rgba(0,0,0,.7);
  min-width:96px; transform:translate(-50%,-118%);
}
.tipbox.on{ opacity:1; }
.tipbox b{ font-family:var(--f-num); font-weight:600; font-variant-numeric:tabular-nums; }
.tipbox .tk{ color:var(--ink-3); font-size:10px; letter-spacing:.06em; text-transform:uppercase; font-family:var(--f-disp); font-weight:700; }
.legend{ display:flex; flex-wrap:wrap; gap:4px 14px; }
.legend > span{ display:inline-flex; align-items:center; gap:6px; font-size:11.5px; color:var(--ink-2); }

/* ---------- muscle volume bars ---------- */
.mvrow{ display:grid; grid-template-columns:78px 1fr auto; align-items:center; gap:9px; }
.mvrow .mvn{ font-size:12px; color:var(--ink-2); }
.mvrow .mvb{ height:14px; background:var(--panel-in); border-radius:3px; overflow:hidden; position:relative; }
.mvrow .mvb i{ position:absolute; inset:0 auto 0 0; border-radius:0 3px 3px 0; }
.mvrow .mvb u{ position:absolute; top:0; bottom:0; width:2px; background:var(--ink-2); opacity:.55; }
.mvrow .mvv{ font-family:var(--f-num); font-size:11.5px; color:var(--ink-3); min-width:52px; text-align:right; font-variant-numeric:tabular-nums; }

/* ---------- avatar ---------- */
.avatar{
  border-radius:100px; object-fit:cover; flex:0 0 auto; display:inline-block;
  border:1px solid var(--line); background:var(--panel-in);
}
.avatar-i{
  display:inline-flex; align-items:center; justify-content:center;
  background:linear-gradient(160deg,var(--acc),var(--acc-hi)); color:var(--acc-ink);
  font-family:var(--f-disp); font-weight:800; letter-spacing:-.01em; border-color:transparent;
}

/* ---------- coach chat ---------- */
.chatlog{
  display:flex; flex-direction:column; gap:8px;
  max-height:46vh; overflow-y:auto; padding:2px;
}
.bubble{
  max-width:88%; padding:10px 12px; border-radius:var(--r-lg);
  font-size:13.5px; line-height:1.5; border:1px solid var(--line);
}
.bubble.me{ align-self:flex-end; background:var(--acc-wash); border-color:var(--acc); }
.bubble.coach{ align-self:flex-start; background:var(--panel); }

/* ---------- meal scan ---------- */
.scanstep{ display:flex; flex-direction:column; gap:8px; }
.scandrop{
  display:flex; flex-direction:column; align-items:center; gap:4px;
  border:1px dashed var(--line); border-radius:var(--r-lg);
  padding:22px 16px; background:var(--panel-in); cursor:pointer; text-align:center;
}
.scandrop:hover{ border-color:var(--acc); }
.scandrop b{ font-family:var(--f-disp); font-size:14px; }
.scandrop .scanicon{ color:var(--acc-hi); display:block; }
.scandrop .scanicon svg{ width:26px; height:26px; }
.scanimg{
  width:100%; max-height:200px; object-fit:cover;
  border-radius:var(--r-lg); border:1px solid var(--line); display:block;
}
.scanprompt{
  margin:0; padding:10px 11px; background:var(--panel-in); border:1px solid var(--line);
  border-radius:var(--r); font-family:var(--f-num); font-size:11px; line-height:1.5;
  color:var(--ink-2); white-space:pre-wrap; word-break:break-word; max-height:150px; overflow-y:auto;
}
.scangrid{ display:grid; grid-template-columns:repeat(5,1fr); gap:5px; }
.scanfield{ display:flex; flex-direction:column; gap:3px; min-width:0; }
.scanfield > span{
  font-family:var(--f-disp); font-weight:700; font-size:8.5px; letter-spacing:.08em;
  text-transform:uppercase; color:var(--ink-3); text-align:center;
}
.mealthumb{
  width:38px; height:38px; border-radius:5px; object-fit:cover;
  border:1px solid var(--line); flex:0 0 auto;
}

/* ---------- weekly split ---------- */
.wk{ display:grid; grid-template-columns:repeat(7,1fr); gap:4px; }
.wkd{
  position:relative; overflow:hidden; text-align:center;
  border:1px solid var(--line); border-radius:var(--r);
  background:var(--panel-in); padding:8px 2px 6px;
}
.wkd .wkb{ position:absolute; left:0; right:0; top:0; height:2px; }
.wkd .wkn{ font-family:var(--f-disp); font-weight:700; font-size:8.5px; letter-spacing:.08em; color:var(--ink-3); }
.wkd .wkl{
  font-size:10px; font-weight:600; margin-top:2px; line-height:1.15;
  min-height:2.3em; overflow:hidden; hyphens:none; padding:0 1px;
}
.wkd .wkt{ height:13px; display:flex; align-items:center; justify-content:center; margin-top:3px; }
.wkd .wkt svg{ width:12px; height:12px; color:var(--good); }
.wkd .wkdot{ width:5px; height:5px; border-radius:100px; background:var(--acc); display:block; }
.wkd.rest .wkl{ color:var(--ink-3); font-weight:500; }
.wkd.future{ opacity:.72; }
.wkd.today{ border-color:var(--acc); background:var(--acc-wash); opacity:1; }
.wkd.today .wkn{ color:var(--acc-hi); }

.splitrow{
  display:flex; align-items:center; gap:10px;
  padding:8px 9px; border:1px solid var(--line-soft); border-radius:var(--r);
  background:var(--panel-in); min-height:48px;
}
.splitrow.today{ border-color:var(--acc); background:var(--acc-wash); }
.splitrow .exbar{ min-height:34px; }
.splitrow .splitname{
  font-size:12.5px; color:var(--ink-2); line-height:1.25;
  display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
}

/* ---------- heatmap ---------- */
.hm{ display:grid; grid-auto-flow:column; grid-template-rows:repeat(7,11px); gap:3px; }
.hm i{ width:11px; height:11px; border-radius:2px; background:var(--panel-in); }
.hm i[data-l="1"]{ background:color-mix(in srgb, var(--acc) 28%, var(--panel-in)); }
.hm i[data-l="2"]{ background:color-mix(in srgb, var(--acc) 52%, var(--panel-in)); }
.hm i[data-l="3"]{ background:color-mix(in srgb, var(--acc) 76%, var(--panel-in)); }
.hm i[data-l="4"]{ background:var(--acc); }

/* ---------- exercise / set logger ---------- */
.exblock{ border:1px solid var(--line); border-radius:var(--r); background:var(--panel); overflow:hidden; }
.exhead{ display:flex; align-items:center; gap:10px; padding:11px 12px; background:var(--panel-hi); border-bottom:1px solid var(--line); }
.exhead .exname{ font-family:var(--f-disp); font-weight:700; font-size:14px; }
.exhead .exmeta{ font-size:11px; color:var(--ink-3); }
.exbar{ width:3px; align-self:stretch; border-radius:2px; flex:0 0 auto; min-height:26px; }

.setgrid{ display:grid; grid-template-columns:30px 1fr 1fr 54px 38px; gap:6px; align-items:center; padding:7px 12px; }
.setgrid.head{ padding-top:9px; padding-bottom:2px; }
.setgrid.head > div{ font-family:var(--f-disp); font-weight:700; font-size:9.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-3); text-align:center; }
.setgrid.head > div:first-child{ text-align:left; }
.setno{ font-family:var(--f-num); font-size:12px; color:var(--ink-3); text-align:center; }
.setno.warm{ color:var(--warn); }
.setno.drop{ color:var(--s7); }
.setinp{
  width:100%; text-align:center; padding:9px 4px; min-height:44px;
  background:var(--panel-in); border:1px solid var(--line); border-radius:5px;
  font-family:var(--f-num); font-size:16px; font-variant-numeric:tabular-nums; font-weight:500;
}
.setinp:focus{ border-color:var(--acc); outline:none; background:var(--panel); }
.setinp::placeholder{ color:var(--ink-3); font-weight:400; }
.setrow.logged .setinp{ border-color:color-mix(in srgb, var(--good) 45%, var(--line)); }
.setrow.logged{ background:color-mix(in srgb, var(--good) 5%, transparent); }
.chk{
  width:38px; height:38px; border-radius:5px; border:1px solid var(--line);
  background:var(--panel-in); display:grid; place-items:center; color:var(--ink-3);
}
.chk.on{ background:var(--good); border-color:var(--good); color:#fff; }
.chk svg{ width:17px; height:17px; }
.e1rm{ font-family:var(--f-num); font-size:11px; color:var(--ink-3); text-align:center; font-variant-numeric:tabular-nums; }
.e1rm.rec{ color:var(--hot); font-weight:600; }
.exfoot{ display:flex; gap:6px; padding:8px 12px 12px; flex-wrap:wrap; }
.prevhint{ padding:0 12px 8px; font-size:11.5px; color:var(--ink-3); font-family:var(--f-num); }

/* ---------- rest timer ---------- */
#resttimer{
  position:fixed; left:10px; right:10px; z-index:45;
  bottom:calc(var(--tab-h) + env(safe-area-inset-bottom,0px) + 10px);
  background:var(--panel-hi); border:1px solid var(--acc); border-radius:var(--r-lg);
  padding:10px 12px; display:flex; align-items:center; gap:12px;
  box-shadow:0 12px 30px -14px rgba(0,0,0,.8);
  max-width:920px; margin:0 auto;
}
#resttimer .rt-v{ font-family:var(--f-num); font-weight:600; font-size:26px; letter-spacing:-.04em; font-variant-numeric:tabular-nums; min-width:76px; }
#resttimer .rt-bar{ flex:1 1 auto; height:5px; background:var(--panel-in); border-radius:100px; overflow:hidden; }
#resttimer .rt-bar i{ display:block; height:100%; background:var(--acc); }
#resttimer.over .rt-v{ color:var(--good); }
#resttimer.over{ border-color:var(--good); }
@media (min-width:860px){ #resttimer{ bottom:14px; left:238px; right:14px; } }

/* ---------- sheet / modal ---------- */
.scrim{
  position:fixed; inset:0; z-index:60; background:rgba(5,8,11,.66);
  backdrop-filter:blur(3px); display:flex; align-items:flex-end; justify-content:center;
  animation:fade .16s ease-out;
}
@keyframes fade{ from{opacity:0} to{opacity:1} }
@keyframes rise{ from{transform:translateY(16px); opacity:.6} to{transform:none; opacity:1} }
.sheet{
  background:var(--bg); border:1px solid var(--line); border-bottom:0;
  border-radius:var(--r-lg) var(--r-lg) 0 0;
  width:100%; max-width:620px; max-height:92vh; display:flex; flex-direction:column;
  animation:rise .2s cubic-bezier(.2,.8,.3,1);
}
.sheet-h{ display:flex; align-items:center; gap:10px; padding:14px 14px 10px; border-bottom:1px solid var(--line-soft); }
.sheet-b{ padding:14px; overflow-y:auto; flex:1 1 auto; }
.sheet-f{ padding:12px 14px calc(14px + env(safe-area-inset-bottom,0px)); border-top:1px solid var(--line-soft); display:flex; gap:8px; background:var(--bg-deep); }
.sheet-grab{ width:38px; height:4px; border-radius:100px; background:var(--line); margin:8px auto 0; }
@media (min-width:640px){
  .scrim{ align-items:center; padding:20px; }
  .sheet{ border-radius:var(--r-lg); border-bottom:1px solid var(--line); max-height:86vh; }
  .sheet-grab{ display:none; }
  .sheet-f{ padding-bottom:14px; }
}

/* ---------- list rows ---------- */
.lrow{
  display:flex; align-items:center; gap:11px; width:100%; text-align:left;
  padding:11px 12px; border:1px solid var(--line); border-radius:var(--r);
  background:var(--panel); min-height:52px;
}
.lrow:hover{ border-color:var(--ink-3); }
.lrow.slim{ padding:9px 11px; min-height:44px; }
.lrow .ln{ font-weight:500; font-size:14px; }
.lrow .lm{ font-size:11.5px; color:var(--ink-3); }
.lrow .lv{ font-family:var(--f-num); font-size:13px; font-variant-numeric:tabular-nums; }

/* ---------- table ---------- */
.tbl{ width:100%; border-collapse:collapse; font-size:13px; }
.tbl th{
  text-align:left; font-family:var(--f-disp); font-weight:700; font-size:9.5px;
  letter-spacing:.1em; text-transform:uppercase; color:var(--ink-3);
  padding:7px 9px; border-bottom:1px solid var(--line); white-space:nowrap;
}
.tbl td{ padding:9px; border-bottom:1px solid var(--line-soft); vertical-align:middle; }
.tbl tr:last-child td{ border-bottom:0; }
.tbl td.n{ font-family:var(--f-num); font-variant-numeric:tabular-nums; text-align:right; white-space:nowrap; }
.tbl th.n{ text-align:right; }

/* ---------- macro / plate ---------- */
.macro{ display:grid; grid-template-columns:auto 1fr auto; gap:8px; align-items:center; }
.macro .mk{ font-size:11px; font-family:var(--f-disp); font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-3); width:56px; }
.macro .mv{ font-family:var(--f-num); font-size:12px; color:var(--ink-2); white-space:nowrap; font-variant-numeric:tabular-nums; }

.plates{ display:flex; align-items:center; gap:3px; flex-wrap:wrap; }
.plate{
  display:inline-flex; align-items:center; justify-content:center;
  min-width:26px; height:30px; padding:0 5px; border-radius:3px;
  font-family:var(--f-num); font-size:11px; font-weight:600; color:#fff;
  border:1px solid rgba(0,0,0,.35); text-shadow:0 1px 2px rgba(0,0,0,.5);
}
.plate.lt{ color:#111; text-shadow:none; border-color:rgba(0,0,0,.25); }
.bar-graphic{ height:4px; background:var(--p1); border-radius:2px; flex:1 1 30px; min-width:22px; }

/* ---------- goal card ---------- */
.goal{ border:1px solid var(--line); border-radius:var(--r); background:var(--panel); padding:13px; display:flex; flex-direction:column; gap:10px; }
.goal.hit{ border-color:color-mix(in srgb, var(--good) 55%, var(--line)); }
.goal-t{ font-family:var(--f-disp); font-weight:700; font-size:14.5px; }
.goal-pct{ font-family:var(--f-num); font-weight:600; font-size:19px; font-variant-numeric:tabular-nums; letter-spacing:-.03em; }
.goal-scale{ display:flex; justify-content:space-between; font-family:var(--f-num); font-size:10.5px; color:var(--ink-3); }
.pace{ font-size:11px; display:inline-flex; align-items:center; gap:5px; }

/* ---------- lock / onboarding ---------- */
#gate{
  position:fixed; inset:0; z-index:80; background:var(--bg-deep);
  display:flex; align-items:center; justify-content:center; padding:22px;
  overflow-y:auto;
}
.gate-card{ width:100%; max-width:390px; display:flex; flex-direction:column; gap:16px; }
.ob-dots{ display:flex; gap:5px; justify-content:center; }
.ob-dots i{ width:22px; height:3px; border-radius:100px; background:var(--line); }
.ob-dots i.on{ background:var(--acc); }

/* ---------- welcome ---------- */
#welcome{
  position:fixed; inset:0; z-index:70; background:var(--bg-deep);
  display:flex; align-items:center; justify-content:center; padding:26px;
  cursor:pointer; animation:wfade .28s ease-out;
}
#welcome.out{ animation:wout .34s ease-in forwards; pointer-events:none; }
@keyframes wfade{ from{opacity:0} to{opacity:1} }
@keyframes wout{ to{opacity:0; transform:scale(1.015)} }
.wcard{ width:100%; max-width:360px; display:flex; flex-direction:column; align-items:center; gap:5px; text-align:center; }
.wcard > *{ animation:wrise .42s cubic-bezier(.2,.8,.3,1) backwards; }
.wcard > *:nth-child(1){ animation-delay:.02s }
.wcard > *:nth-child(2){ animation-delay:.09s }
.wcard > *:nth-child(3){ animation-delay:.15s }
.wcard > *:nth-child(4){ animation-delay:.21s }
.wcard > *:nth-child(5){ animation-delay:.27s }
@keyframes wrise{ from{opacity:0; transform:translateY(9px)} to{opacity:1; transform:none} }
.wgreet{ font-family:var(--f-disp); font-weight:700; font-size:12px; letter-spacing:.16em; text-transform:uppercase; color:var(--acc-hi); }
.wname{ font-family:var(--f-disp); font-weight:800; font-size:33px; letter-spacing:-.025em; line-height:1.05; }
.wdate{ font-family:var(--f-num); font-size:12px; color:var(--ink-3); }
.wplan{
  margin-top:12px; padding:13px 16px; border:1px solid var(--line); border-radius:var(--r-lg);
  background:var(--panel); display:flex; flex-direction:column; gap:3px; min-width:210px;
}
.wplan .wpl{ font-family:var(--f-disp); font-weight:700; font-size:9.5px; letter-spacing:.13em; text-transform:uppercase; color:var(--ink-3); }
.wplan .wpv{ font-family:var(--f-disp); font-weight:700; font-size:18px; }
.wplan .wps{ font-size:11.5px; color:var(--ink-2); }
.wstreak{ display:inline-flex; align-items:center; gap:6px; font-size:12.5px; color:var(--ink-2); margin-top:9px; }
.wstreak b{ font-family:var(--f-num); font-weight:600; font-size:15px; color:var(--ink); }
.wstreak svg{ width:15px; height:15px; color:var(--hot); }
.wtap{ font-size:11px; color:var(--ink-3); margin-top:16px; }
@media (prefers-reduced-motion: reduce){
  #welcome, .wcard > *{ animation:none !important; }
}

/* ---------- toast ---------- */
#toasts{
  position:fixed; z-index:90; left:10px; right:10px; display:flex; flex-direction:column;
  gap:7px; align-items:center; pointer-events:none;
  bottom:calc(var(--tab-h) + env(safe-area-inset-bottom,0px) + 74px);
}
.toast{
  background:var(--ink); color:var(--bg); border-radius:100px; padding:9px 16px;
  font-size:13px; font-weight:500; box-shadow:0 10px 26px -12px rgba(0,0,0,.8);
  animation:rise .18s ease-out; max-width:100%;
}
.toast.pr{ background:var(--hot); color:#fff; font-family:var(--f-disp); font-weight:700; letter-spacing:.02em; }
@media (min-width:860px){ #toasts{ bottom:22px; } }

/* ---------- empty state ---------- */
.empty{
  border:1px dashed var(--line); border-radius:var(--r); padding:26px 18px;
  text-align:center; color:var(--ink-3); display:flex; flex-direction:column; gap:9px; align-items:center;
}
.empty h4{ color:var(--ink-2); }
.empty svg{ width:26px; height:26px; opacity:.5; }

/* ---------- misc ---------- */
.hr{ height:1px; background:var(--line-soft); border:0; margin:0; }
.searchwrap{ position:relative; }
.searchwrap svg{ position:absolute; left:11px; top:50%; transform:translateY(-50%); width:16px; height:16px; color:var(--ink-3); pointer-events:none; }
.searchwrap .inp{ padding-left:34px; }
.pillrow{ display:flex; gap:6px; overflow-x:auto; padding-bottom:2px; -webkit-overflow-scrolling:touch; }
.pillrow::-webkit-scrollbar{ height:0; }
.kv{ display:flex; justify-content:space-between; gap:10px; font-size:13px; padding:5px 0; }
.kv b{ font-family:var(--f-num); font-weight:600; font-variant-numeric:tabular-nums; }
.stepper{ display:flex; align-items:center; gap:0; }
.stepper button{ width:40px; height:44px; border:1px solid var(--line); background:var(--panel-hi); font-family:var(--f-num); font-size:17px; }
.stepper button:first-child{ border-radius:5px 0 0 5px; }
.stepper button:last-child{ border-radius:0 5px 5px 0; }
.stepper .setinp{ border-radius:0; border-left:0; border-right:0; }








/* ============================================================
   PHYSIQUE — figures, body map, character customiser
   ============================================================ */
.mmf{ display:block; overflow:visible; }

/* a coach's head and shoulders, in a ring of his own accent */
.bust{
  display:inline-flex; align-items:flex-end; justify-content:center;
  width:40px; height:40px; flex:0 0 auto; border-radius:50%; overflow:hidden;
  background:color-mix(in srgb, var(--ba) 16%, var(--panel-in));
  border:1px solid color-mix(in srgb, var(--ba) 40%, var(--line));
}
.bust > svg{ width:100%; height:auto; }

/* a progress bar with an optional "gained since" band */
.bar{
  position:relative; height:7px; background:var(--panel-in);
  border:1px solid var(--line-soft); border-radius:4px; overflow:hidden;
}
.bar > i{
  position:absolute; top:0; bottom:0; left:0; border-radius:3px;
  background:linear-gradient(90deg,var(--acc),var(--acc-hi));
}
.bar > u{ position:absolute; top:0; bottom:0; background:var(--hot); opacity:.95; }

/* swatch pickers */
.swrow{ display:flex; flex-wrap:wrap; gap:7px; }
.sw{
  width:31px; height:31px; border-radius:50%; flex:0 0 auto;
  border:2px solid var(--line); cursor:pointer; padding:0;
}
.sw.on{ border-color:var(--acc); box-shadow:0 0 0 3px var(--acc-wash); }

/* the body map on Today */
.bmwrap{
  background:var(--panel-in); border:1px solid var(--line-soft);
  border-radius:var(--r); padding:10px 6px 4px;
}
.bmap{ display:block; width:100%; height:auto; max-width:430px; max-height:300px; margin:0 auto; }
.bm-l{
  font-family:var(--f-disp); font-weight:700; font-size:8px; letter-spacing:.16em;
  fill:var(--ink-3);
}

/* the character stage */
.chstage{ display:flex; gap:16px; align-items:flex-start; flex-wrap:wrap; }
.chwrap{
  flex:0 0 auto; display:flex; align-items:flex-end; justify-content:center;
  padding:6px 10px; border-radius:var(--r);
  background:radial-gradient(120% 90% at 50% 100%, var(--acc-wash), transparent 70%);
}
.chwrap.sm{
  width:42px; height:42px; padding:0; align-items:center; justify-content:center;
  border-radius:50%; overflow:hidden; background:var(--panel-in); border:1px solid var(--line);
}
.devrow{
  background:var(--panel); border:1px solid var(--line); border-radius:var(--r);
  padding:10px 12px; display:flex; flex-direction:column; gap:6px;
}

/* the coach roster */
.croster{ display:grid; grid-template-columns:repeat(auto-fill,minmax(148px,1fr)); gap:10px; }
.ccard{
  position:relative; display:flex; flex-direction:column; align-items:center; gap:2px;
  padding:12px 10px 13px; border-radius:var(--r-lg); text-align:center; cursor:pointer;
  background:linear-gradient(180deg,var(--panel-hi),var(--panel));
  border:1px solid var(--line); overflow:hidden;
}
.ccard::before{
  content:''; position:absolute; inset:auto 0 0 0; height:3px; background:var(--ca); opacity:.5;
}
.ccard.on{ border-color:var(--ca); box-shadow:0 0 0 1px var(--ca) inset; }
.ccard.on::before{ opacity:1; }
.ccard .cfig{
  display:flex; align-items:flex-end; justify-content:center; height:138px; margin-bottom:2px;
  border-radius:var(--r); align-self:stretch;
  background:radial-gradient(120% 80% at 50% 100%, color-mix(in srgb, var(--ca) 22%, transparent), transparent 72%);
}
.ccard .cn{ font-family:var(--f-disp); font-weight:700; font-size:13.5px; color:var(--ink); }
.ccard .ct{
  font-family:var(--f-disp); font-weight:700; font-size:9px; letter-spacing:.11em;
  text-transform:uppercase; color:var(--ca);
}
/* the surname behind the card — the credit, sized as decoration */
.ccard .cwm{
  position:absolute; inset:auto 0 24px 0; text-align:center; pointer-events:none;
  font-family:var(--f-disp); font-weight:800; font-size:30px; letter-spacing:-.03em;
  text-transform:uppercase; color:var(--ca); opacity:.14; white-space:nowrap; overflow:hidden;
}
.ccard .cb{ font-size:11px; line-height:1.35; color:var(--ink-3); margin-top:3px; }
.ccard .cmark{
  position:absolute; top:8px; right:8px; width:19px; height:19px; border-radius:50%;
  background:var(--ca); color:#fff; display:flex; align-items:center; justify-content:center;
}
.ccard .cmark svg{ width:12px; height:12px; }

/* The routine. Nine stacked frames cross-faded on one 16s loop: he waves you in,
   front double bi, abs and thighs, side triceps turning into side chest, rear
   double bi, most muscular, and stands back down. The two side poses share the
   whole body and differ only in the near arm and leg, so their crossfade is
   deliberately long — it reads as him turning into the chest rather than cutting
   to it. The resting frame is first so a page with animations disabled shows him
   standing rather than blank. */
.greeter, .rf-stage, .st-fig{ position:relative; display:block; }
.greeter{ flex:0 0 auto; padding:0; }
.gf{
  position:absolute; inset:0; opacity:0;
  display:flex; align-items:flex-end; justify-content:center;
}
.gf > svg{ display:block; }
.g0{ opacity:1; }
.loop{ animation:gbob 4.1s ease-in-out infinite; }
.loop .g0{ animation:gwA 16s linear infinite; }
.loop .g1{ animation:gwB 16s linear infinite; }
.loop .g2{ animation:gwC 16s linear infinite; }
.loop .g3{ animation:gwD 16s linear infinite; }
.loop .g4{ animation:gwE 16s linear infinite; }
.loop .g5{ animation:gwF 16s linear infinite; }
.loop .g6{ animation:gwG 16s linear infinite; }
.loop .g7{ animation:gwH 16s linear infinite; }
.loop .g8{ animation:gwI 16s linear infinite; }
@keyframes gbob{ 0%,100%{ transform:translateY(0) } 50%{ transform:translateY(-2px) } }
/* relaxed */
@keyframes gwA{ 0%,5%{ opacity:1 } 7%,90%{ opacity:0 } 92%,100%{ opacity:1 } }
/* wave / wave2, alternating twice */
@keyframes gwB{
  0%,5%{ opacity:0 } 7%,10%{ opacity:1 } 12%,14%{ opacity:0 }
  16%,18%{ opacity:1 } 20%,100%{ opacity:0 }
}
@keyframes gwC{ 0%,10%{ opacity:0 } 12%,14%{ opacity:1 } 16%,18%{ opacity:0 } 20%,22%{ opacity:1 } 24%,100%{ opacity:0 } }
/* front double bi */
@keyframes gwD{ 0%,22%{ opacity:0 } 24%,35%{ opacity:1 } 37%,100%{ opacity:0 } }
/* abs and thighs */
@keyframes gwE{ 0%,35%{ opacity:0 } 37%,48%{ opacity:1 } 50%,100%{ opacity:0 } }
/* side triceps — holds, then hands over slowly */
@keyframes gwF{ 0%,48%{ opacity:0 } 50%,58%{ opacity:1 } 64%,100%{ opacity:0 } }
/* side chest — fades up while the triceps is still there, so it turns */
@keyframes gwG{ 0%,58%{ opacity:0 } 64%,72%{ opacity:1 } 74%,100%{ opacity:0 } }
/* rear double bi */
@keyframes gwH{ 0%,72%{ opacity:0 } 74%,82%{ opacity:1 } 84%,100%{ opacity:0 } }
/* most muscular */
@keyframes gwI{ 0%,82%{ opacity:0 } 84%,90%{ opacity:1 } 92%,100%{ opacity:0 } }

/* the rail's dead space, occupied */
.railfig{
  flex:1 1 auto; min-height:150px; display:flex; flex-direction:column;
  align-items:center; justify-content:flex-end; gap:7px;
  padding:10px 4px 12px; margin:6px 0; border-radius:var(--r);
  position:relative; overflow:hidden; text-align:center;

/* the way in: a lifter under a spotlight, not a form on a grey page */

  content:''; position:absolute; inset:auto 0 0 0; height:52%; z-index:-1;

<script>
/* ============================================================
   Utilities
   ============================================================ */
const KEY = 'ironledger.v1';
const KG_PER_LB = 0.45359237;

const uid = (p) => (p||'x') + Math.random().toString(36).slice(2,9) + (performance.now()|0).toString(36);
const pad2 = (n) => String(n).padStart(2,'0');
const dkey = (d) => d.getFullYear() + '-' + pad2(d.getMonth()+1) + '-' + pad2(d.getDate());
const today = () => dkey(new Date());
const parseDate = (k) => { const [y,m,d] = k.split('-').map(Number); return new Date(y, m-1, d); };
const addDays = (k, n) => { const d = parseDate(k); d.setDate(d.getDate()+n); return dkey(d); };
const daysBetween = (a,b) => Math.round((parseDate(b) - parseDate(a)) / 86400000);
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
const sum = (arr, f) => arr.reduce((t,x)=> t + (f?f(x):x), 0);
const esc = (s) => String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const DOW = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

function fmtDate(k, style){
  const d = parseDate(k);
  if (style === 'long') return DOW[d.getDay()] + ', ' + MON[d.getMonth()] + ' ' + d.getDate() + ', ' + d.getFullYear();
  if (style === 'dow') return DOW[d.getDay()] + ' ' + MON[d.getMonth()] + ' ' + d.getDate();
  return MON[d.getMonth()] + ' ' + d.getDate();
}
function relDate(k){
  const n = daysBetween(k, today());
  if (n === 0) return 'Today';
  if (n === 1) return 'Yesterday';
  if (n === -1) return 'Tomorrow';
  if (n > 1 && n < 7) return n + ' days ago';
  return fmtDate(k, 'dow');
}
function num(v, dp){
  if (v == null || !isFinite(v)) return '—';
  const d = dp == null ? 0 : dp;
  const s = Math.abs(v) >= 1000 && d === 0 ? Math.round(v).toLocaleString('en-US') : v.toFixed(d);
  return d > 0 ? s.replace(/\.0+$/,'') : s;
}
function compact(v){
  if (v == null || !isFinite(v)) return '—';
  const a = Math.abs(v);
  if (a >= 1e6) return (v/1e6).toFixed(1).replace(/\.0$/,'') + 'M';
  if (a >= 10000) return Math.round(v/1000) + 'k';
  if (a >= 1000) return (v/1000).toFixed(1).replace(/\.0$/,'') + 'k';
  return String(Math.round(v));
}
function clock(sec){
  sec = Math.max(0, Math.round(sec));
  const m = Math.floor(sec/60), s = sec%60;
  return m + ':' + pad2(s);
}

/* ============================================================
   Store
   ============================================================ */
function seedExercises(){
  return EX_SEED.split('\n').map(line => {
    const [name, primary, sec, eq, uni, bar] = line.split('|');
    return {
      id: uid('e'), name: name.trim(), primary,
      sec: sec ? sec.split(',').filter(Boolean) : [],
      eq, uni: uni === '1', bar: bar === '1', custom: false
    };
  });
}
function seedFoods(){
  return FOOD_SEED.split('\n').map(line => {
    const [name, unit, kcal, p, c, f, fib, group] = line.split('|');
    return {
      id: uid('f'), name: name.trim(), unit: unit.trim(),
      kcal: +kcal, p: +p, c: +c, f: +f, fib: +fib || 0,
      group: group.trim(), custom: false
    };
  });
}
function seedTemplates(exs){
  const byName = {}; exs.forEach(e => byName[e.name] = e.id);
  return TPL_SEED.map(t => ({
    id: uid('t'), name: t.name, tag: t.tag, stock: true,
    ex: t.ex.map(([n, sets, reps]) => ({ exId: byName[n], sets, reps })).filter(x => x.exId)
  }));
}
/* Monday-first weekly schedule. Stored 0..6 = Sunday..Saturday so it
   maps straight onto Date.getDay(); rendered Monday first. */
const WEEK_ORDER = [1,2,3,4,5,6,0];
const DOW_FULL = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
function defaultSplit(templates){
  /* matched on the leading word so renaming a routine does not orphan the split */
  const id = frag => (templates.find(t => t.name.indexOf(frag) === 0) || {}).id || null;
  const push = id('Push'), pull = id('Pull'), legs = id('Legs');
  return { days: ['rest', push, pull, legs, push, pull, legs] };   // Sun rest, Mon–Sat PPL twice
}
function freshDb(){
  const exercises = seedExercises();
  const templates = seedTemplates(exercises);
  return {
    v: 1,
    split: defaultSplit(templates),
    profile: { name:'', email:'', passHash:'', photo:'', lockOnOpen:false,
               unit:'lb', sex:'', birthYear:null, heightCm:null, pin:'', theme:'dark', activity:1.6,
               targets:{ kcal:3000, p:200, c:330, f:80, water:3500 },
               restDefault:120, onboarded:false },
    exercises,
    foods: seedFoods(),
    templates,
    sessions: [],
    active: null,
    meals: [],
    water: {},
    goals: [],
    measures: [],
    character: defaultCharacter(),
    bw: [],
    meta: { created: today(), lastBackup: null }
  };
}

let DB = null;
function load(){
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) {
      const p = JSON.parse(raw);
      if (p && p.profile && Array.isArray(p.exercises)) { DB = p; hydrate(); return; }
    }
  } catch(e){ console.warn('Could not read saved data', e); }
  DB = freshDb();
}
function hydrate(){
  const d = freshDb();
  for (const k in d) if (DB[k] === undefined) DB[k] = d[k];
  for (const k in d.profile) if (DB.profile[k] === undefined) DB.profile[k] = d.profile[k];
  for (const k in d.profile.targets) if (DB.profile.targets[k] === undefined) DB.profile.targets[k] = d.profile.targets[k];
  if (!DB.exercises.length) DB.exercises = seedExercises();
  else {
    /* Fold in any exercise added to the library since this record was made.
       Matched on name so a user's own entries and their ids are untouched —
       without this, everyone who already had the app would never see a new
       movement again. */
    const have = {};
    DB.exercises.forEach(e => have[e.name.trim().toLowerCase()] = 1);
    seedExercises().forEach(e => {
      if (!have[e.name.trim().toLowerCase()]) DB.exercises.push(e);
    });
  }
  if (!DB.foods.length) DB.foods = seedFoods();
  /* the split holds template ids, so it has to be built against this
     user's own routines rather than copied from a fresh database */
  /* The split holds template ids, so a copy taken from a fresh database points
     at routines this user does not have. Rebuild unless every id resolves. */
  const splitBroken = !DB.split || !Array.isArray(DB.split.days) || DB.split.days.length !== 7 ||
    DB.split.days.some(v => v && v !== 'rest' && !DB.templates.some(t => t.id === v));
  if (splitBroken) DB.split = defaultSplit(DB.templates);

  /* Black is the default and it stays black. 'auto' followed the device and
     flipped to the light palette in daylight. Pin it to dark once; after that
     `themeSet` is on the record and an explicit choice always wins.
     NOTE: themeSet is deliberately absent from freshDb — if it were there the
     key-backfill above would set it before this runs and the flip would never
     happen. */
  if (!DB.profile.themeSet){ DB.profile.theme = 'dark'; DB.profile.themeSet = true; }
}
/* If the browser refuses to persist, say so plainly rather than quietly
   dropping everything on the next reload. */
let storageBroken = false;
function checkStorage(){
  try {
    localStorage.setItem(KEY + '.probe', '1');
    localStorage.removeItem(KEY + '.probe');
    storageBroken = false;
  } catch(e){ storageBroken = true; }
}
function storageBanner(){
  if (!storageBroken) return '';
  return '<div class="panel pad stack-sm" style="border-color:var(--warn)">' +
    '<div class="row" style="gap:8px;color:var(--warn)">' +
      '<span style="width:17px;height:17px;flex:0 0 auto">' + I.note + '</span>' +
      '<b style="font-family:var(--f-disp);font-size:13px">This browser is not saving</b></div>' +
    '<div class="tiny muted">Storage is blocked here, so anything you log will be gone on reload. ' +
      'Private browsing is the usual cause — open the app in a normal window. ' +
      'Until then, export a backup before you close the tab.</div>' +
  '</div>';
}
let saveT = null, saveFailed = false;
function save(){
  if (saveT) clearTimeout(saveT);
  saveT = setTimeout(() => {
    try { localStorage.setItem(KEY, JSON.stringify(DB)); saveFailed = false; }
    catch(e){
      if (!saveFailed) { saveFailed = true; toast('Storage is full — export a backup and trim old data.', 5000); }
    }
    cloudQueue();
  }, 180);
}
function saveNow(){ if (saveT) clearTimeout(saveT); try { localStorage.setItem(KEY, JSON.stringify(DB)); } catch(e){} cloudQueue(); }
IL.get = () => DB;
IL.save = save;

/* ============================================================
   Units
   ============================================================ */
const U = {
  get unit(){ return DB.profile.unit; },
  toDisp(kg){ return DB.profile.unit === 'kg' ? kg : kg / KG_PER_LB; },
  toKg(v){ return DB.profile.unit === 'kg' ? v : v * KG_PER_LB; },
  w(kg, dp){ return num(U.toDisp(kg), dp == null ? 1 : dp); },
  wu(kg, dp){ return U.w(kg, dp) + ' ' + DB.profile.unit; },
  vol(kg){ return compact(U.toDisp(kg)); },
  // smallest sensible increment in display units
  step(){ return DB.profile.unit === 'kg' ? 2.5 : 5; },
  lenToDisp(cm){ return DB.profile.unit === 'kg' ? cm : cm / 2.54; },
  lenToStore(v){ return DB.profile.unit === 'kg' ? v : v * 2.54; },
  lenUnit(){ return DB.profile.unit === 'kg' ? 'cm' : 'in'; }
};
IL.U = U;

/* ============================================================
   Lookups
   ============================================================ */
const exById = (id) => DB.exercises.find(e => e.id === id);
const foodById = (id) => DB.foods.find(f => f.id === id);
const tplById = (id) => DB.templates.find(t => t.id === id);
function exName(id){ const e = exById(id); return e ? e.name : 'Unknown exercise'; }
function exArea(id){ const e = exById(id); return e ? MUSCLES[e.primary].area : 'Chest'; }

/* ============================================================
   Set / session math
   ============================================================ */
const isWork = (s) => s.done && s.t !== 'w' && (+s.r > 0);
function e1rm(w, r){
  if (!w || !r) return 0;
  if (r === 1) return w;
  return w * (1 + r/30);                 // Epley
}
function setE1rm(s){ return isWork(s) ? e1rm(+s.w || 0, +s.r || 0) : 0; }
function setVol(s){ return isWork(s) ? (+s.w || 0) * (+s.r || 0) : 0; }

function sessionSets(ses){ return (ses.entries||[]).flatMap(en => (en.sets||[]).map(s => ({ ...s, exId: en.exId }))); }
function sessionVolume(ses){ return sum(sessionSets(ses), setVol); }
function sessionWorkSets(ses){ return sessionSets(ses).filter(isWork).length; }
function sessionReps(ses){ return sum(sessionSets(ses).filter(isWork), s => +s.r || 0); }
function sessionTop(ses){
  let best = null;
  sessionSets(ses).forEach(s => { const v = setE1rm(s); if (v > 0 && (!best || v > best.v)) best = { v, exId: s.exId, w:+s.w, r:+s.r }; });
  return best;
}

/* muscle-level volume + hard sets for one session */
function sessionMuscle(ses){
  const vol = {}, sets = {};
  MUSCLE_KEYS.forEach(k => { vol[k] = 0; sets[k] = 0; });
  (ses.entries||[]).forEach(en => {
    const ex = exById(en.exId); if (!ex) return;
    (en.sets||[]).forEach(s => {
      if (!isWork(s)) return;
      const v = setVol(s);
      vol[ex.primary] += v; sets[ex.primary] += 1;
      ex.sec.forEach(m => { if (vol[m] != null) { vol[m] += v * 0.5; sets[m] += 0.5; } });
    });
  });
  return { vol, sets };
}
function rangeMuscle(sessions){
  const vol = {}, sets = {};
  MUSCLE_KEYS.forEach(k => { vol[k] = 0; sets[k] = 0; });
  sessions.forEach(ses => {
    const m = sessionMuscle(ses);
    MUSCLE_KEYS.forEach(k => { vol[k] += m.vol[k]; sets[k] += m.sets[k]; });
  });
  return { vol, sets };
}
function areaTotals(muscleMap){
  const out = {}; AREAS.forEach(a => out[a] = 0);
  MUSCLE_KEYS.forEach(k => out[MUSCLES[k].area] += muscleMap[k]);
  return out;
}

/* ============================================================
   PRs & history per exercise
   ============================================================ */
function doneSessions(){ return DB.sessions.filter(s => s.entries && s.entries.length).sort((a,b) => a.date < b.date ? -1 : a.date > b.date ? 1 : 0); }

function exHistory(exId){
  const out = [];
  doneSessions().forEach(ses => {
    (ses.entries||[]).filter(en => en.exId === exId).forEach(en => {
      const work = (en.sets||[]).filter(isWork);
      if (!work.length) return;
      let top = work[0], bestE = 0;
      work.forEach(s => { const e = setE1rm(s); if (e > bestE) { bestE = e; top = s; } });
      out.push({
        date: ses.date, sesId: ses.id,
        sets: work.map(s => ({ w:+s.w, r:+s.r, rpe:s.rpe, t:s.t })),
        vol: sum(work, setVol),
        reps: sum(work, s => +s.r||0),
        e1rm: bestE, topW: Math.max(...work.map(s => +s.w||0)),
        top: { w:+top.w, r:+top.r }
      });
    });
  });
  return out;
}
function exPR(exId){
  const h = exHistory(exId);
  if (!h.length) return null;
  const be = h.reduce((a,b) => b.e1rm > a.e1rm ? b : a);
  const bw = h.reduce((a,b) => b.topW > a.topW ? b : a);
  const bv = h.reduce((a,b) => b.vol > a.vol ? b : a);
  return {
    e1rm: be.e1rm, e1rmDate: be.date, e1rmSet: be.top,
    weight: bw.topW, weightDate: bw.date,
    vol: bv.vol, volDate: bv.date,
    sessions: h.length, last: h[h.length-1]
  };
}
/* PR check that ignores the session currently being logged */
function prBaseline(exId, excludeSesId){
  let bestE = 0, bestW = 0;
  doneSessions().forEach(ses => {
    if (ses.id === excludeSesId) return;
    (ses.entries||[]).filter(en => en.exId === exId).forEach(en => {
      (en.sets||[]).filter(isWork).forEach(s => {
        bestE = Math.max(bestE, setE1rm(s));
        bestW = Math.max(bestW, +s.w || 0);
      });
    });
  });
  return { e1rm: bestE, weight: bestW };
}
function lastPerformance(exId, excludeSesId){
  const list = doneSessions().filter(s => s.id !== excludeSesId);
  for (let i = list.length - 1; i >= 0; i--){
    const en = (list[i].entries||[]).find(e => e.exId === exId && (e.sets||[]).some(isWork));
    if (en) return { date: list[i].date, sets: en.sets.filter(isWork) };
  }
  return null;
}

/* ============================================================
   Streak / consistency
   ============================================================ */
function trainedDays(){ return new Set(doneSessions().map(s => s.date)); }
function streak(){
  const days = trainedDays();
  if (!days.size) return 0;
  let k = today(), n = 0;
  if (!days.has(k)) k = addDays(k, -1);            // today not logged yet is fine
  while (days.has(k)) { n++; k = addDays(k, -1); }
  return n;
}
function weekSessions(offset){
  // offset 0 = current 7-day window ending today, 1 = previous 7 days
  const end = addDays(today(), -7 * (offset||0));
  const start = addDays(end, -6);
  return doneSessions().filter(s => s.date >= start && s.date <= end);
}
function sessionsBetween(a, b){ return doneSessions().filter(s => s.date >= a && s.date <= b); }

/* ============================================================
   Nutrition
   ============================================================ */
const SLOTS = ['Breakfast','Lunch','Dinner','Snacks','Pre-Workout','Post-Workout'];
function mealsOn(date){ return DB.meals.filter(m => m.date === date); }
function macroTotals(entries){
  return entries.reduce((t,m) => {
    const q = +m.qty || 0;
    t.kcal += m.kcal * q; t.p += m.p * q; t.c += m.c * q; t.f += m.f * q; t.fib += (m.fib||0) * q;
    return t;
  }, { kcal:0, p:0, c:0, f:0, fib:0 });
}
function dayMacros(date){ return macroTotals(mealsOn(date)); }
function macroKcalSplit(t){
  const pk = t.p * 4, ck = t.c * 4, fk = t.f * 9;
  const tot = pk + ck + fk || 1;
  return { pk, ck, fk, pPct: pk/tot*100, cPct: ck/tot*100, fPct: fk/tot*100 };
}
function avgMacros(days){
  const list = [];
  for (let i = 0; i < days; i++){
    const d = addDays(today(), -i);
    const m = dayMacros(d);
    if (m.kcal > 0) list.push(m);
  }
  if (!list.length) return null;
  const t = list.reduce((a,m) => ({ kcal:a.kcal+m.kcal, p:a.p+m.p, c:a.c+m.c, f:a.f+m.f, fib:a.fib+m.fib }), {kcal:0,p:0,c:0,f:0,fib:0});
  const n = list.length;
  return { kcal:t.kcal/n, p:t.p/n, c:t.c/n, f:t.f/n, fib:t.fib/n, days:n };
}

/* ============================================================
   Bodyweight & measurements
   ============================================================ */
function latestBw(){ const l = DB.bw.slice().sort((a,b) => a.date < b.date ? -1 : 1); return l.length ? l[l.length-1] : null; }
function bwAt(date){
  const l = DB.bw.filter(b => b.date <= date).sort((a,b) => a.date < b.date ? -1 : 1);
  return l.length ? l[l.length-1].kg : null;
}
function logBw(date, kg){
  const ex = DB.bw.find(b => b.date === date);
  if (ex) ex.kg = kg; else DB.bw.push({ date, kg });
  save();
}
const MEASURE_FIELDS = [
  ['neck','Neck'], ['shoulders','Shoulders'], ['chest','Chest'], ['arm','Arm (flexed)'],
  ['forearm','Forearm'], ['waist','Waist'], ['hips','Hips'], ['thigh','Thigh'], ['calf','Calf']
];
function latestMeasure(){ const l = DB.measures.slice().sort((a,b) => a.date < b.date ? -1 : 1); return l.length ? l[l.length-1] : null; }

/* ============================================================
   Goals
   ============================================================ */
const GOAL_TYPES = {
  lift:   { n:'Lift target',       hint:'Estimated 1RM on one exercise',      unit:'w' },
  liftw:  { n:'Working weight',    hint:'Heaviest weight moved on one lift',  unit:'w' },
  sets:   { n:'Weekly hard sets',  hint:'Hard sets per week for one muscle',  unit:'n' },
  bw:     { n:'Bodyweight',        hint:'Scale weight target',                unit:'w' },
  measure:{ n:'Measurement',       hint:'Tape measurement on one site',       unit:'l' },
  kcal:   { n:'Daily calories',    hint:'7-day average intake',               unit:'n' },
  protein:{ n:'Daily protein',     hint:'7-day average protein in grams',     unit:'n' },
  freq:   { n:'Sessions per week', hint:'Training frequency',                 unit:'n' },
  habit:  { n:'Session count',     hint:'Total sessions logged since start',  unit:'n' }
};
function goalCurrent(g){
  switch (g.type){
    case 'lift': { const pr = exPR(g.exId); return pr ? pr.e1rm : null; }
    case 'liftw': { const pr = exPR(g.exId); return pr ? pr.weight : null; }
    case 'sets': { const m = rangeMuscle(weekSessions(0)); return m.sets[g.muscle] || 0; }
    case 'bw': { const b = latestBw(); return b ? b.kg : null; }
    case 'measure': { const m = latestMeasure(); return m && m[g.site] != null ? m[g.site] : null; }
    case 'kcal': { const a = avgMacros(7); return a ? a.kcal : null; }
    case 'protein': { const a = avgMacros(7); return a ? a.p : null; }
    case 'freq': return weekSessions(0).length;
    case 'habit': return doneSessions().filter(s => s.date >= g.created).length;
  }
  return null;
}
function goalPct(g){
  const cur = goalCurrent(g);
  if (cur == null) return { pct:0, cur:null };
  const start = g.start, target = g.target;
  if (target === start) return { pct: cur >= target ? 100 : 0, cur };
  let pct = (cur - start) / (target - start) * 100;
  return { pct: clamp(pct, 0, 100), cur, over: cur >= target && target > start || (target < start && cur <= target) };
}
function goalUnitLabel(g){
  const t = GOAL_TYPES[g.type];
  if (!t) return '';
  if (t.unit === 'w') return DB.profile.unit;
  if (t.unit === 'l') return U.lenUnit();
  if (g.type === 'kcal') return 'kcal';
  if (g.type === 'protein') return 'g';
  if (g.type === 'sets') return 'sets/wk';
  if (g.type === 'freq') return 'per week';
  return '';
}
function goalDisp(g, v){
  if (v == null) return '—';
  const t = GOAL_TYPES[g.type];
  if (t.unit === 'w') return num(U.toDisp(v), 1);
  if (t.unit === 'l') return num(U.lenToDisp(v), 1);
  return num(v, g.type === 'sets' ? 1 : 0);
}
function goalPace(g){
  if (!g.deadline) return null;
  const total = daysBetween(g.created, g.deadline);
  const gone = daysBetween(g.created, today());
  if (total <= 0) return null;
  const timePct = clamp(gone / total * 100, 0, 100);
  const p = goalPct(g).pct;
  const left = daysBetween(today(), g.deadline);
  return { timePct, progPct: p, ahead: p >= timePct, daysLeft: left };
}

IL.calc = { e1rm, setE1rm, setVol, sessionVolume, sessionWorkSets, sessionMuscle, rangeMuscle,
            areaTotals, exHistory, exPR, prBaseline, lastPerformance, streak, doneSessions,
            weekSessions, dayMacros, macroTotals, macroKcalSplit, avgMacros, goalPct, goalCurrent };
</script>

<script>
/* ============================================================
   UI primitives: toasts, sheets, rings, bars
   ============================================================ */
function toast(msg, ms, cls){
  const el = document.createElement('div');
  el.className = 'toast' + (cls ? ' ' + cls : '');
  el.textContent = msg;
  document.getElementById('toasts').appendChild(el);
  setTimeout(() => { el.style.transition = 'opacity .25s'; el.style.opacity = '0';
    setTimeout(() => el.remove(), 260); }, ms || 2100);
}
function prToast(msg){ toast(msg, 3200, 'pr'); }
IL.toast = toast;

let sheetStack = [];
function openSheet(o){
  const root = document.getElementById('sheetroot');
  const scrim = document.createElement('div');
  scrim.className = 'scrim';
  scrim.innerHTML =
    '<div class="sheet" role="dialog" aria-modal="true" aria-label="' + esc(o.title||'Dialog') + '">' +
      '<div class="sheet-grab"></div>' +
      '<div class="sheet-h">' +
        '<div class="grow"><h2>' + esc(o.title||'') + '</h2>' +
        (o.sub ? '<div class="tiny dim">' + esc(o.sub) + '</div>' : '') + '</div>' +
        '<button class="icon-btn bare" data-close aria-label="Close">' + I.x + '</button>' +
      '</div>' +
      '<div class="sheet-b">' + (o.body||'') + '</div>' +
      (o.foot ? '<div class="sheet-f">' + o.foot + '</div>' : '') +
    '</div>';
  root.appendChild(scrim);
  const inst = { el: scrim, close(){ closeSheet(inst); } };
  sheetStack.push(inst);
  scrim.addEventListener('click', e => { if (e.target === scrim) closeSheet(inst); });
  scrim.querySelector('[data-close]').addEventListener('click', () => closeSheet(inst));
  if (o.mount) o.mount(scrim, inst);
  mountCharts(scrim);
  const f = scrim.querySelector('[data-focus]');
  if (f) setTimeout(() => { f.focus(); if (f.select) f.select(); }, 60);
  return inst;
}
function closeSheet(inst){
  if (!inst) inst = sheetStack[sheetStack.length-1];
  if (!inst) return;
  sheetStack = sheetStack.filter(s => s !== inst);
  inst.el.style.transition = 'opacity .14s'; inst.el.style.opacity = '0';
  setTimeout(() => inst.el.remove(), 150);
}
function closeAllSheets(){ sheetStack.slice().forEach(closeSheet); }
document.addEventListener('keydown', e => { if (e.key === 'Escape' && sheetStack.length) closeSheet(); });
IL.openSheet = openSheet; IL.closeSheet = closeSheet;

function confirmSheet(o, onYes){
  openSheet({
    title: o.title, sub: o.sub,
    body: '<p class="muted" style="margin:0">' + esc(o.msg) + '</p>',
    foot: '<button class="btn grow" data-no>Cancel</button>' +
          '<button class="btn ' + (o.danger ? 'btn-hot' : 'btn-pri') + ' grow" data-yes>' + esc(o.yes || 'Confirm') + '</button>',
    mount(el, inst){
      el.querySelector('[data-no]').onclick = () => inst.close();
      el.querySelector('[data-yes]').onclick = () => { inst.close(); onYes(); };
    }
  });
}

function ring(pct, size, stroke, color, label, val){
  const s = size || 68, sw = stroke || 7, r = (s - sw)/2, c = 2*Math.PI*r;
  const p = clamp(pct, 0, 100);
  const off = c * (1 - p/100);
  return '<div class="ring" style="width:' + s + 'px;height:' + s + 'px">' +
    '<svg width="' + s + '" height="' + s + '" viewBox="0 0 ' + s + ' ' + s + '" aria-hidden="true">' +
      '<circle class="ring-track" cx="' + s/2 + '" cy="' + s/2 + '" r="' + r + '" fill="none" stroke-width="' + sw + '"/>' +
      '<circle cx="' + s/2 + '" cy="' + s/2 + '" r="' + r + '" fill="none" stroke="' + (color||'var(--acc)') + '" ' +
        'stroke-width="' + sw + '" stroke-linecap="round" stroke-dasharray="' + c.toFixed(1) + '" ' +
        'stroke-dashoffset="' + off.toFixed(1) + '"/>' +
    '</svg>' +
    '<div class="rc">' + (val != null ? '<b>' + val + '</b>' : '') + (label ? '<span>' + esc(label) + '</span>' : '') + '</div>' +
  '</div>';
}
function pbar(pct, cls){
  const p = clamp(pct, 0, 100);
  return '<div class="pbar' + (cls ? ' ' + cls : '') + '"><i style="width:' + p.toFixed(1) + '%"></i></div>';
}
function deltaChip(cur, prev, opts){
  const o = opts || {};
  if (prev == null || !isFinite(prev) || prev === 0) return '<span class="delta flat">new</span>';
  const d = (cur - prev) / Math.abs(prev) * 100;
  if (Math.abs(d) < 0.5) return '<span class="delta flat">±0%</span>';
  const up = d > 0, good = o.inverse ? !up : up;
  return '<span class="delta ' + (good ? 'up' : 'dn') + '">' + (up ? '▲' : '▼') + ' ' + Math.abs(d).toFixed(0) + '%</span>';
}

/* ============================================================
   Charts — measured at mount, drawn at real pixel width
   ============================================================ */
const CHARTS = {};
function chartSlot(kind, opts){
  const id = uid('c');
  CHARTS[id] = { kind, opts };
  return '<div class="chart-wrap" data-chart="' + id + '" style="min-height:' + (opts.h || 150) + 'px"></div>';
}
function mountCharts(scope){
  (scope || document).querySelectorAll('[data-chart]').forEach(el => {
    const c = CHARTS[el.dataset.chart]; if (!c) return;
    const w = Math.max(240, el.clientWidth || el.parentElement.clientWidth || 320);
    el.innerHTML = '';
    (c.kind === 'bar' ? drawBars : drawLine)(el, w, c.opts);
  });
}
let rzT = null;
window.addEventListener('resize', () => { clearTimeout(rzT); rzT = setTimeout(() => mountCharts(document), 200); });

function niceDomain(vals, zeroBase){
  let mn = Math.min.apply(null, vals), mx = Math.max.apply(null, vals);
  if (zeroBase) mn = Math.min(0, mn);
  if (mx === mn) { mx = mn + (Math.abs(mn) * 0.1 || 1); }
  const span = mx - mn;
  return { mn: mn - span * (zeroBase ? 0 : 0.08), mx: mx + span * 0.12 };
}
function svgEl(tag, attrs){
  const e = document.createElementNS('http://www.w3.org/2000/svg', tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  return e;
}

/* --- line / area chart --- */
function drawLine(host, w, o){
  const data = o.data || [];
  const h = o.h || 160;
  const pad = { l: o.padL == null ? 38 : o.padL, r: 10, t: 12, b: 20 };
  if (data.length === 0){
    host.innerHTML = '<div class="empty" style="min-height:' + h + 'px;justify-content:center">' + I.progress +
      '<div class="tiny">' + esc(o.emptyMsg || 'Not enough data yet') + '</div></div>';
    return;
  }
  const iw = w - pad.l - pad.r, ih = h - pad.t - pad.b;
  const dom = niceDomain(data.map(d => d.v), o.zeroBase);
  const X = i => data.length === 1 ? pad.l + iw/2 : pad.l + (i/(data.length-1)) * iw;
  const Y = v => pad.t + ih - ((v - dom.mn) / (dom.mx - dom.mn)) * ih;
  const color = o.color || 'var(--s1)';
  const gid = uid('g');

  const svg = svgEl('svg', { class:'chart', width:w, height:h, viewBox:'0 0 ' + w + ' ' + h, role:'img',
                             'aria-label': o.aria || 'Line chart' });
  svg.innerHTML = '<defs><linearGradient id="' + gid + '" x1="0" y1="0" x2="0" y2="1">' +
    '<stop offset="0%" stop-color="' + color + '" stop-opacity="0.26"/>' +
    '<stop offset="100%" stop-color="' + color + '" stop-opacity="0"/></linearGradient></defs>';

  // gridlines + y labels
  const ticks = 3;
  for (let t = 0; t <= ticks; t++){
    const v = dom.mn + (dom.mx - dom.mn) * (t/ticks);
    const y = Y(v);
    svg.appendChild(svgEl('line', { class:'gl', x1:pad.l, y1:y.toFixed(1), x2:w-pad.r, y2:y.toFixed(1) }));
    const lb = svgEl('text', { x:pad.l-6, y:(y+3.2).toFixed(1), 'text-anchor':'end' });
    lb.textContent = o.fmtY ? o.fmtY(v) : compact(v);
    svg.appendChild(lb);
  }
  // area + line
  let dLine = '', dArea = '';
  data.forEach((d,i) => {
    const x = X(i).toFixed(1), y = Y(d.v).toFixed(1);
    dLine += (i ? 'L' : 'M') + x + ' ' + y;
    dArea += (i ? 'L' : 'M' + x + ' ' + (pad.t+ih) + 'L') + x + ' ' + y;
  });
  dArea += 'L' + X(data.length-1).toFixed(1) + ' ' + (pad.t+ih) + 'Z';
  if (o.area !== false) svg.appendChild(svgEl('path', { d:dArea, fill:'url(#' + gid + ')' }));
  svg.appendChild(svgEl('path', { d:dLine, fill:'none', stroke:color, 'stroke-width':2,
                                  'stroke-linejoin':'round', 'stroke-linecap':'round' }));
  // points
  data.forEach((d,i) => {
    const last = i === data.length-1;
    if (data.length <= 24 || last){
      svg.appendChild(svgEl('circle', { cx:X(i).toFixed(1), cy:Y(d.v).toFixed(1), r: last ? 4.5 : 3,
        fill: last ? color : 'var(--panel)', stroke: color, 'stroke-width':2 }));
    }
    if (d.pr){
      svg.appendChild(svgEl('circle', { cx:X(i).toFixed(1), cy:Y(d.v).toFixed(1), r:6.5,
        fill:'none', stroke:'var(--hot)', 'stroke-width':1.6 }));
    }
  });
  // x labels (first / mid / last)
  const idxs = data.length <= 2 ? data.map((_,i) => i) : [0, Math.floor((data.length-1)/2), data.length-1];
  [...new Set(idxs)].forEach(i => {
    const t = svgEl('text', { x:X(i).toFixed(1), y:h-5,
      'text-anchor': i === 0 ? 'start' : i === data.length-1 ? 'end' : 'middle' });
    t.textContent = data[i].label || data[i].k;
    svg.appendChild(t);
  });
  // hover layer
  const cross = svgEl('line', { class:'al', x1:0, y1:pad.t, x2:0, y2:pad.t+ih, opacity:0, stroke:color });
  const hdot = svgEl('circle', { r:5, fill:color, stroke:'var(--panel)', 'stroke-width':2, opacity:0 });
  svg.appendChild(cross); svg.appendChild(hdot);
  const hit = svgEl('rect', { x:pad.l, y:pad.t, width:Math.max(1,iw), height:Math.max(1,ih), fill:'transparent' });
  svg.appendChild(hit);
  host.appendChild(svg);

  const tip = document.createElement('div');
  tip.className = 'tipbox';
  host.appendChild(tip);
  const idxAt = px => {
    if (data.length === 1) return 0;
    return clamp(Math.round((px - pad.l) / iw * (data.length-1)), 0, data.length-1);
  };
  const show = e => {
    const r = svg.getBoundingClientRect();
    const i = idxAt(e.clientX - r.left);
    const d = data[i], x = X(i), y = Y(d.v);
    cross.setAttribute('x1', x); cross.setAttribute('x2', x); cross.setAttribute('opacity', .45);
    hdot.setAttribute('cx', x); hdot.setAttribute('cy', y); hdot.setAttribute('opacity', 1);
    tip.innerHTML = '<div class="tk">' + esc(d.tipK || d.label || d.k) + '</div><b>' +
      (o.fmtTip ? o.fmtTip(d) : (o.fmtY ? o.fmtY(d.v) : num(d.v,1))) + '</b>' +
      (d.tipX ? '<div class="tiny dim">' + esc(d.tipX) + '</div>' : '');
    tip.style.left = clamp(x, 54, w - 54) + 'px';
    tip.style.top = y + 'px';
    tip.classList.add('on');
  };
  hit.addEventListener('pointermove', show);
  hit.addEventListener('pointerdown', show);
  hit.addEventListener('pointerleave', () => {
    tip.classList.remove('on'); cross.setAttribute('opacity',0); hdot.setAttribute('opacity',0);
  });
}

/* --- vertical bars --- */
function drawBars(host, w, o){
  const data = o.data || [];
  const h = o.h || 150;
  const pad = { l: o.padL == null ? 38 : o.padL, r: 10, t: 12, b: 22 };
  if (!data.length){
    host.innerHTML = '<div class="empty" style="min-height:' + h + 'px;justify-content:center">' + I.train +
      '<div class="tiny">' + esc(o.emptyMsg || 'No sessions in this window') + '</div></div>';
    return;
  }
  const iw = w - pad.l - pad.r, ih = h - pad.t - pad.b;
  const mx = Math.max.apply(null, data.map(d => d.v)) || 1;
  const dom = { mn:0, mx: mx * 1.14 };
  const slot = iw / data.length;
  const bw = Math.max(4, Math.min(o.maxBar || 34, slot - 4));
  const Y = v => pad.t + ih - (v / dom.mx) * ih;
  const svg = svgEl('svg', { class:'chart', width:w, height:h, viewBox:'0 0 ' + w + ' ' + h,
                             role:'img', 'aria-label': o.aria || 'Bar chart' });
  for (let t = 0; t <= 2; t++){
    const v = dom.mx * (t/2), y = Y(v);
    svg.appendChild(svgEl('line', { class:'gl', x1:pad.l, y1:y.toFixed(1), x2:w-pad.r, y2:y.toFixed(1) }));
    const lb = svgEl('text', { x:pad.l-6, y:(y+3.2).toFixed(1), 'text-anchor':'end' });
    lb.textContent = o.fmtY ? o.fmtY(v) : compact(v);
    svg.appendChild(lb);
  }
  const tip = document.createElement('div');
  tip.className = 'tipbox';
  data.forEach((d,i) => {
    const x = pad.l + slot*i + (slot - bw)/2;
    const y = Y(d.v), bh = Math.max(d.v > 0 ? 2 : 0, pad.t + ih - y);
    const rect = svgEl('rect', { x:x.toFixed(1), y:y.toFixed(1), width:bw.toFixed(1), height:bh.toFixed(1),
      rx: Math.min(4, bw/2), fill: d.color || o.color || 'var(--s1)', opacity: d.dim ? .45 : 1 });
    rect.style.cursor = 'default';
    svg.appendChild(rect);
    const hit = svgEl('rect', { x:(pad.l + slot*i).toFixed(1), y:pad.t, width:slot.toFixed(1), height:ih,
      fill:'transparent' });
    const on = () => {
      tip.innerHTML = '<div class="tk">' + esc(d.tipK || d.label) + '</div><b>' +
        (o.fmtTip ? o.fmtTip(d) : (o.fmtY ? o.fmtY(d.v) : num(d.v,0))) + '</b>' +
        (d.tipX ? '<div class="tiny dim">' + esc(d.tipX) + '</div>' : '');
      tip.style.left = clamp(pad.l + slot*i + slot/2, 58, w-58) + 'px';
      tip.style.top = Math.max(pad.t + 6, y) + 'px';
      tip.classList.add('on');
    };
    hit.addEventListener('pointerenter', on);
    hit.addEventListener('pointerdown', on);
    hit.addEventListener('pointerleave', () => tip.classList.remove('on'));
    svg.appendChild(hit);
    const room = Math.max(1, Math.floor(iw / (o.labelW || 36)));
    const lstep = Math.max(1, Math.ceil(data.length / room));
    if (i % lstep === 0 || i === data.length - 1 && lstep === 1){
      const t = svgEl('text', { x:(pad.l + slot*i + slot/2).toFixed(1), y:h-6, 'text-anchor':'middle' });
      t.textContent = d.label;
      svg.appendChild(t);
    }
  });
  host.appendChild(svg);
  host.appendChild(tip);
}

/* --- horizontal muscle bars (HTML) --- */
function muscleBars(map, opts){
  const o = opts || {};
  const keys = (o.keys || MUSCLE_KEYS).filter(k => o.showEmpty || map[k] > 0);
  if (!keys.length) return '<div class="empty">' + I.dumb + '<h4>Nothing logged yet</h4>' +
    '<div class="tiny">Log a session and this fills in per muscle.</div></div>';

        (o.mark && o.mark[k] ? '<u style="left:' + clamp(o.mark[k]/mx*100,0,100).toFixed(1) + '%"></u>' : '') +

function areaLegend(){

    '<span><i class="dot" style="background:' + AREA_COLOR[a] + '"></i>' + a + '</span>').join('') + '</div>';

/* --- training heatmap --- */
function heatmap(weeks){
  const n = (weeks || 18) * 7;
  const days = trainedDays();
  const volByDay = {};
  doneSessions().forEach(s => { volByDay[s.date] = (volByDay[s.date]||0) + sessionWorkSets(s); });
  const vals = Object.values(volByDay).filter(v => v > 0).sort((a,b) => a-b);
  const q = p => vals.length ? vals[Math.floor((vals.length-1)*p)] : 0;
  const q1 = q(.25), q2 = q(.5), q3 = q(.8);
  let start = addDays(today(), -(n-1));
  const sd = parseDate(start).getDay();
  start = addDays(start, -sd);
  let cells = '';
  let k = start;
  const end = today();
  let guard = 0;
  while (k <= end && guard++ < 500){
    const v = volByDay[k] || 0;
    const l = !days.has(k) ? 0 : v > q3 ? 4 : v > q2 ? 3 : v > q1 ? 2 : 1;
    cells += '<i data-l="' + l + '" title="' + fmtDate(k,'dow') + (v ? ' · ' + v + ' hard sets' : ' · rest') + '"></i>';
    k = addDays(k, 1);
  }
  return '<div class="scroll-x"><div class="hm">' + cells + '</div></div>';
}

/* ============================================================
   Plate calculator
   ============================================================ */
const PLATE_SETS = {
  lb: [ [45,'var(--p25)',0], [35,'var(--p20)',0], [25,'var(--p10)',0], [10,'var(--p1)',0], [5,'var(--p5)',1], [2.5,'var(--p5)',1] ],
  kg: [ [25,'var(--p25)',0], [20,'var(--p20)',0], [15,'var(--p15)',1], [10,'var(--p10)',0], [5,'var(--p5)',1], [2.5,'var(--p5)',1], [1.25,'var(--p1)',0] ]
};
function platesFor(totalDisp, barDisp){
  const unit = DB.profile.unit;
  let side = (totalDisp - barDisp) / 2;
  if (side <= 0) return { list: [], left: 0, exact: Math.abs(side) < 0.01 };
  const out = [];
  PLATE_SETS[unit].forEach(([w,color,lt]) => {
    let n = Math.floor((side + 1e-6) / w);
    if (n > 0){ out.push({ w, color, lt, n }); side -= n*w; }
  });
  return { list: out, left: side, exact: side < 0.02 };
}
function plateStrip(totalDisp, barDisp){
  const r = platesFor(totalDisp, barDisp);
  if (!r.list.length) return '<span class="tiny dim">Bar only</span>';
  return '<div class="plates">' +
    r.list.map(p => Array(p.n).fill(0).map(() =>
      '<span class="plate' + (p.lt ? ' lt' : '') + '" style="background:' + p.color + '">' + num(p.w,1) + '</span>'
    ).join('')).join('') +
    '<span class="bar-graphic"></span>' +
    (r.left > 0.02 ? '<span class="tiny hot" style="margin-left:4px">+' + num(r.left,2) + ' short</span>' : '') +
  '</div>';
}

/* ============================================================
   Rest timer
   ============================================================ */
const RT = { end:0, total:0, tick:null, el:null };
function startRest(sec){
  RT.total = sec; RT.end = Date.now() + sec*1000;
  RT.el = document.getElementById('resttimer');
  RT.el.classList.remove('hide');
  if (RT.tick) clearInterval(RT.tick);
  drawRest();
  RT.tick = setInterval(drawRest, 250);
}
function stopRest(){
  if (RT.tick) clearInterval(RT.tick);
  RT.tick = null; RT.end = 0;
  const el = document.getElementById('resttimer');
  if (el) { el.classList.add('hide'); el.classList.remove('over'); }
}
function drawRest(){
  const el = document.getElementById('resttimer'); if (!el) return;
  const leftMs = RT.end - Date.now();
  const over = leftMs <= 0;
  const shown = over ? -leftMs/1000 : leftMs/1000;
  const pct = over ? 100 : clamp((1 - leftMs/1000/RT.total) * 100, 0, 100);
  el.classList.toggle('over', over);
  el.innerHTML =
    '<div class="rt-v">' + (over ? '+' : '') + clock(shown) + '</div>' +
    '<div class="grow"><div class="mini eyebrow" style="margin-bottom:5px">' +
      (over ? 'Rest complete — go' : 'Resting') + '</div>' +
      '<div class="rt-bar"><i style="width:' + pct.toFixed(0) + '%"></i></div></div>' +
    '<button class="btn btn-sm" data-rt="+30">+30s</button>' +
    '<button class="icon-btn bare" data-rt="stop" aria-label="Dismiss timer">' + I.x + '</button>';
  el.querySelectorAll('[data-rt]').forEach(b => b.onclick = () => {
    if (b.dataset.rt === 'stop') stopRest();
    else { RT.end += 30000; RT.total += 30; drawRest(); }
  });
  if (over && !RT.buzzed){ RT.buzzed = true; if (navigator.vibrate) try { navigator.vibrate([120,70,120]); } catch(e){} }
  if (!over) RT.buzzed = false;
}

/* ============================================================

  catch(e){ return false; }
