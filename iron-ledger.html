}
/* ---------------- nutrition plan calculator ----------------
   Mifflin–St Jeor resting rate → activity multiplier → phase
   adjustment. Protein and fat are set from bodyweight first,
   carbohydrate takes what is left.
----------------------------------------------------------- */
const ACTIVITY = [
  { v:1.375, n:'Light',       d:'Desk job, 2–3 sessions a week' },
  { v:1.6,   n:'Active',      d:'4–5 sessions a week' },
  { v:1.8,   n:'Very active', d:'6+ sessions, or on your feet all day' }
];
const PHASE_ADJ = { bulk:0.12, maintain:0, cut:-0.15 };
const PROTEIN_PER_LB = 1.0;   /* 1 g per pound of bodyweight — a ceiling on a cut, not a floor */

function computePlan(d){
  const kg = parseFloat(d.bwKg) || 0;
  if (!kg) return null;                                   // bodyweight is the one number we cannot guess
  const cm = parseFloat(d.heightCm) || 0;
  const age = d.birthYear ? clamp(new Date().getFullYear() - parseInt(d.birthYear,10), 14, 90) : 28;
  const act = parseFloat(d.activity) || 1.6;
  const phase = d.phase || 'maintain';

  const bmr = Math.round(10*kg + 6.25*(cm || 178) - 5*age + (d.sex === 'f' ? -161 : 5));
  const tdee = Math.round(bmr * act);
  const adj = PHASE_ADJ[phase] != null ? PHASE_ADJ[phase] : 0;
  const kcal = Math.round(tdee * (1 + adj) / 10) * 10;

  /* Protein is pinned to 1 g per pound and deliberately not raised on a cut.
     On a cut fat drops to the hormonal floor so carbohydrate — training fuel —
     takes every calorie that is left. Off a cut, fat takes a quarter of intake. */
  const lb = kg / KG_PER_LB;
  const p = Math.round(lb * PROTEIN_PER_LB);
  const fFloor = Math.round(kg * 0.6);
  let f = phase === 'cut' ? fFloor : Math.max(fFloor, Math.round(kcal * 0.25 / 9));
  let c = Math.round((kcal - p*4 - f*9) / 4);
  if (c < 30){                                            // too little room: give it back from fat
    c = 30;
    f = Math.max(20, Math.round((kcal - p*4 - c*4) / 9));
  }

  const deltaKcal = kcal - tdee;
  return {
    targets: { kcal, p, c, f, water: Math.round(kg * 40 / 100) * 100 },
    bmr, tdee, act, phase, adj, kg, lb, cm, age, deltaKcal,
    pPerLb: p / lb, fFloor, fatAtFloor: f === fFloor,
    weeklyKg: deltaKcal * 7 / 7700,                       // ~7,700 kcal per kg of tissue
    bmi: cm ? kg / Math.pow(cm/100, 2) : null
  };
}
function suggestTargets(d){
  const pl = computePlan(d);
  return pl ? pl.targets : { kcal:3000, p:200, c:330, f:80, water:3500 };
}
function bmiBand(b){
  if (b == null) return '';
  return b < 18.5 ? 'Underweight band' : b < 25 ? 'Normal band' : b < 30 ? 'Overweight band' : 'Obese band';
}
function macroSplitBar(t){
  const pk = t.p*4, ck = t.c*4, fk = t.f*9, tot = pk + ck + fk || 1;
  const seg = (kcal, color, label) => '<div style="flex:' + (kcal/tot).toFixed(4) +
    ';background:' + color + ';height:100%;border-radius:2px" title="' + label + '"></div>';
  return '<div class="row" style="gap:2px;height:10px;align-items:stretch">' +
    seg(pk, 'var(--s1)', 'Protein') + seg(ck, 'var(--s4)', 'Carbs') + seg(fk, 'var(--s2)', 'Fat') +
  '</div>';
}
function macroReadRow(name, grams, kcalEach, color, note){
  return '<div class="row" style="gap:10px;align-items:baseline">' +
    '<i class="dot" style="background:' + color + '"></i>' +

      (note ? '<span class="mini dim" style="display:block">' + note + '</span>' : '') + '</span>' +
    '<span class="num" style="font-size:19px;font-weight:600">' + num(grams,0) + '<span class="tiny dim"> g</span></span>' +
    '<span class="num tiny dim" style="min-width:66px;text-align:right">' + num(grams*kcalEach,0) + ' kcal</span>' +
  '</div>';
}
/* Step 3 — a readout, not a questionnaire. Everything here is derived
   from step 2; the manual panel is there only if you disagree with it. */
function obPlanBody(d, t){
  const pl = computePlan(d);
  const phaseName = { bulk:'Bulk', maintain:'Maintain', cut:'Cut' }[d.phase] || 'Maintain';
  const macroKcal = t.p*4 + t.c*4 + t.f*9;

  if (!pl){
    return '<div><div class="eyebrow">Step 3</div><h2>Your numbers</h2></div>' +
      '<div class="panel pad stack-sm">' +

        (pl.deltaKcal === 0
          ? 'Level with your maintenance intake'

    '</div>' +

    /* macros */
    '<div class="panel pad stack-sm">' +
      '<div class="eyebrow">Macros</div>' +
      macroReadRow('Protein', t.p, 4, 'var(--s1)', DB.profile.unit === 'kg'
        ? num(t.p / pl.kg, 1) + ' g per kg of bodyweight'
        : num(pl.pPerLb, 2) + ' g per lb of bodyweight') +
      macroReadRow('Carbs', t.c, 4, 'var(--s4)', d.phase === 'cut' ? 'Everything left over — training fuel first' : 'Fills the remaining calories') +
      macroReadRow('Fat', t.f, 9, 'var(--s2)', pl.fatAtFloor ? 'Held at the hormonal floor, 0.6 g/kg' : 'A quarter of intake') +
      '<hr class="hr">' +
      '<div class="row between tiny dim"><span>Macros total</span>' +
        '<span class="num">' + num(macroKcal,0) + ' kcal' +
        (Math.abs(macroKcal - t.kcal) > 25 ? ' · ' + (macroKcal > t.kcal ? '+' : '') + num(macroKcal - t.kcal,0) + ' vs target' : '') +
        '</span></div>' +

        (DB.profile.unit === 'kg' ? '2.2 g per kilo' : '1 g per pound') + ' rather than climbing, ' +

      : '') +

    /* derivation */
    '<div class="panel pad stack-sm">' +
      '<div class="eyebrow">How that was reached</div>' +
      '<div class="kv"><span class="muted">Resting rate · Mifflin–St Jeor</span><b>' + num(pl.bmr,0) + ' kcal</b></div>' +
      '<div class="kv"><span class="muted">× activity ' + pl.act + ' = maintenance</span><b>' + num(pl.tdee,0) + ' kcal</b></div>' +
      '<div class="kv"><span class="muted">' + phaseName + ' adjustment ' +
        (pl.adj === 0 ? 'none' : (pl.adj > 0 ? '+' : '−') + Math.round(Math.abs(pl.adj)*100) + '%') +

        (pl.cm ? ', ' + (DB.profile.unit === 'kg' ? num(pl.cm,0) + ' cm' : (() => { const q = ftInParts(pl.cm); return q.ft + '′' + num(q.inch,0) + '″'; })()) : '') + '.</div>' +
      '<div class="field" style="margin-top:6px"><label>Activity level</label>' +

          (ACTIVITY.find(a => a.v === pl.act) || ACTIVITY[1]).d + '</div>' +

    /* BMI, with the caveat it deserves */
    (bmiTxt
      ? '<div class="panel pad stack-sm">' +

}
function obManualPanel(t, open){

function obView(){

      gateStage('Every set. Every gram.', 'Your training and nutrition record, kept on this device.') +

      '<div class="field"><label>Weight unit</label><div class="seg" style="width:100%">' +
        '<button class="grow ' + (d.unit === 'lb' ? 'on' : '') + '" data-act="obUnit" data-v="lb">Pounds (lb)</button>' +

      '</div></div>';
  } else if (obStep === 1){
    body =
      '<div><div class="eyebrow">Step 2</div><h2>Your stats</h2>' +
      '<div class="tiny dim">Used for calorie math and progress context. Skip anything you would rather not enter.</div></div>' +

        '<div class="field"><label>Birth year</label>' +
        '<input class="inp num" type="number" inputmode="numeric" placeholder="1994" value="' + esc(d.birthYear) + '" data-act="obYr" data-on="input"></div>' +
        '<div class="field"><label>Sex</label><select class="inp" data-act="obSex">' +
          '<option value="m"' + (d.sex==='m'?' selected':'') + '>Male</option>' +
          '<option value="f"' + (d.sex==='f'?' selected':'') + '>Female</option>' +
        '</select></div>' +
      '</div>' +
      '<div class="field"><label>Current phase</label><div class="seg" style="width:100%">' +
        ['bulk','maintain','cut'].map(p => '<button class="grow ' + (d.phase===p?'on':'') + '" data-act="obPhase" data-v="' + p + '">' +
          p.charAt(0).toUpperCase()+p.slice(1) + '</button>').join('') +

  } else if (obStep === 2){
    const t = d.targets || suggestTargets(d);
    d.targets = t;
    body = obPlanBody(d, t);
  }

  return '<div class="gate-card">' + dots +
    '<div class="ob-step">' + body + '</div>' +

      (obStep > 0 ? '<button class="btn" data-act="obBack">Back</button>' : '') +

ACTS.obName = (el) => { obDraft.name = el.value; };
ACTS.obUnit = (el) => {
  obDraft.unit = el.dataset.v; obDraft.targets = null;
  DB.profile.unit = obDraft.unit;              // so U.* formats correctly for the rest of setup
  obDraft.htFt = ''; obDraft.htIn = '';        // re-derive from the stored centimetres
  renderGate();
};
ACTS.obBw = (el) => { const v = parseFloat(el.value); obDraft.bwKg = isFinite(v) ? (obDraft.unit === 'kg' ? v : v*KG_PER_LB) : ''; obDraft.targets = obDraft.manual ? obDraft.targets : null; };
/* height: centimetres in kg mode, feet + inches in lb mode */
function ftInParts(cm){
  if (!cm) return { ft:'', inch:'' };
  const total = cm / 2.54;
  let ft = Math.floor(total / 12);
  let inch = Math.round((total - ft*12) * 10) / 10;
  if (inch >= 12){ ft += 1; inch = 0; }
  return { ft, inch };
}
function obHeightField(d){
  if (d.unit === 'kg'){
    return '<div class="field"><label>Height (cm)</label>' +
      '<input class="inp num" type="number" step="0.5" inputmode="decimal" value="' +
        (d.heightCm ? num(d.heightCm, 1) : '') + '" data-act="obHtCm" data-on="input"></div>';
  }
  const p = ftInParts(d.heightCm);
  const ft = d.htFt !== '' && d.htFt != null ? d.htFt : p.ft;
  const inch = d.htIn !== '' && d.htIn != null ? d.htIn : p.inch;
  return '<div class="field"><label>Height</label><div class="row" style="gap:6px">' +
    '<input class="inp num" style="text-align:center;flex:1 1 0;min-width:0" type="number" min="3" max="8" inputmode="numeric" ' +
      'placeholder="5" value="' + esc(ft) + '" data-act="obHtFt" data-on="input" aria-label="Height, feet">' +
    '<span class="tiny dim">ft</span>' +
    '<input class="inp num" style="text-align:center;flex:1 1 0;min-width:0" type="number" min="0" max="11.5" step="0.5" inputmode="decimal" ' +
      'placeholder="11" value="' + esc(inch) + '" data-act="obHtIn" data-on="input" aria-label="Height, inches">' +
    '<span class="tiny dim">in</span>' +
  '</div></div>';
}
function obHeightSync(){
  const ft = parseFloat(obDraft.htFt), inch = parseFloat(obDraft.htIn);
  const total = (isFinite(ft) ? ft*12 : 0) + (isFinite(inch) ? inch : 0);
  obDraft.heightCm = total > 0 ? total * 2.54 : '';
  if (!obDraft.manual) obDraft.targets = null;
}
ACTS.obHtCm = (el) => { const v = parseFloat(el.value); obDraft.heightCm = isFinite(v) ? v : ''; obDraft.htFt = ''; obDraft.htIn = ''; obDraft.targets = obDraft.manual ? obDraft.targets : null; };
ACTS.obHtFt = (el) => { obDraft.htFt = el.value; obHeightSync(); };
ACTS.obHtIn = (el) => { obDraft.htIn = el.value; obHeightSync(); };
ACTS.obYr = (el) => { obDraft.birthYear = el.value; obDraft.targets = obDraft.manual ? obDraft.targets : null; };
ACTS.obSex = (el) => { obDraft.sex = el.value; obDraft.targets = obDraft.manual ? obDraft.targets : null; };
ACTS.obPhase = (el) => { obDraft.phase = el.dataset.v; if (!obDraft.manual) obDraft.targets = null; renderGate(); };
let obFocusK = null, obTT = null;
ACTS.obT = (el) => {
  obDraft.targets[el.dataset.k] = parseInt(el.value,10) || 0;
  obDraft.manual = true;
  obFocusK = el.dataset.k;
  clearTimeout(obTT);
  obTT = setTimeout(renderGate, 450);        // let the readout catch up once typing settles
};
ACTS.obActivity = (el) => {
  obDraft.activity = parseFloat(el.dataset.v);
  if (!obDraft.manual) obDraft.targets = null;
  renderGate();
};
ACTS.obEdit = () => { obDraft.editing = true; renderGate(); };
ACTS.obEditReset = () => {
  obDraft.editing = false; obDraft.manual = false; obDraft.targets = null;
  renderGate(); toast('Back to the calculated plan');
};
ACTS.obBack = () => { obStep--; renderGate(); };
ACTS.obNext = () => {
  /* each step commits what it has, so an interrupted setup resumes where it stopped */
  if (obStep === 0){
    if (!obDraft.name.trim()) { toast('Add a name so the log knows whose it is'); return; }
    DB.profile.name = obDraft.name.trim();
    DB.profile.unit = obDraft.unit;
    saveNow();
    obStep = 1; renderGate(); return;
  }
  if (obStep === 1){
    DB.profile.sex = obDraft.sex;
    DB.profile.birthYear = parseInt(obDraft.birthYear,10) || null;
    DB.profile.heightCm = obDraft.heightCm || null;
    DB.profile.phase = obDraft.phase;
    DB.profile.activity = obDraft.activity || 1.6;
    if (obDraft.bwKg) logBw(today(), obDraft.bwKg);
    saveNow();
    obStep = 2; renderGate(); return;
  }
  finishOb();
};
function finishOb(){
  const d = obDraft;
  DB.profile.name = d.name.trim();
  DB.profile.unit = d.unit;
  DB.profile.sex = d.sex;
  DB.profile.birthYear = parseInt(d.birthYear,10) || null;
  DB.profile.heightCm = d.heightCm || null;
  DB.profile.phase = d.phase;
  DB.profile.activity = d.activity || 1.6;
  DB.profile.targets = d.targets || suggestTargets(d);
  DB.profile.pin = '';
  DB.profile.onboarded = true;
  if (d.bwKg) logBw(today(), d.bwKg);
  saveNow();
  locked = false; obDraft = null; obStep = 0;
  document.getElementById('gate').classList.add('hide');
  greeted = true;
  go('today');
  toast('Welcome, ' + DB.profile.name + '. Your ledger is open.');
}

</script>

<script>
/* ============================================================
   VIEW — Today
   ============================================================ */
function greeting(){
  const h = new Date().getHours();
  return h < 5 ? 'Up early' : h < 12 ? 'Good morning' : h < 17 ? 'Good afternoon' : h < 22 ? 'Good evening' : 'Late one';
}

/* ------------------------------------------------------------
   The welcome moment on open. Reads entirely from the loaded
   profile, so it greets whoever signed in — no names in code.
------------------------------------------------------------ */
let greeted = false;
function maybeWelcome(){
  if (greeted) return;
  if (!DB.profile.onboarded) return;                       // setup does its own greeting
  if (cloudOn() && !SESSION) return;                       // wait until they are actually in
  if (!cloudOn() && DB.profile.lockOnOpen && DB.profile.passHash && !signedIn) return;
  greeted = true;
  showWelcome();
}
function showWelcome(){
  const p = DB.profile;
  const s = streak();
  const dow = parseDate(today()).getDay();
  const plan = splitFor(dow);
  const logged = doneSessions().some(x => x.date === today());
  const first = (p.name || '').trim().split(/\s+/)[0] || 'Athlete';

  let planBlock = '';
  if (logged){
    planBlock = '<div class="wplan"><span class="wpl">Today</span>' +
      '<span class="wpv">Already in the book</span>' +
      '<span class="wps">' + sum(doneSessions().filter(x => x.date === today()), sessionWorkSets) + ' hard sets logged</span></div>';
  } else if (plan.kind === 'tpl'){
    planBlock = '<div class="wplan"><span class="wpl">' + DOW_FULL[dow] + '</span>' +
      '<span class="wpv">' + esc(shortTplName(plan.tpl)) + ' day</span>' +
      '<span class="wps">' + plan.tpl.ex.length + ' exercises · ' + sum(plan.tpl.ex, x => x.sets) + ' sets</span></div>';
  } else if (plan.kind === 'rest'){
    planBlock = '<div class="wplan"><span class="wpl">' + DOW_FULL[dow] + '</span>' +
      '<span class="wpv">Rest day</span>' +
      '<span class="wps">Eat, sleep, recover</span></div>';
  } else {
    planBlock = '<div class="wplan"><span class="wpl">' + DOW_FULL[dow] + '</span>' +
      '<span class="wpv">Nothing planned</span>' +
      '<span class="wps">Train whatever you like</span></div>';
  }

  const prev = document.getElementById('welcome');
  if (prev) prev.remove();                                 // never stack two greetings
  const el = document.createElement('div');
  el.id = 'welcome';
  el.setAttribute('role', 'status');
  el.innerHTML = '<div class="wcard">' +
    charGreeter(132) +
    '<div class="wgreet">' + greeting() + '</div>' +
    '<div class="wname">' + esc(first) + '</div>' +
    '<div class="wdate">' + fmtDate(today(), 'long') + '</div>' +
    planBlock +
    (s > 0 ? '<div class="wstreak">' + I.flame + '<b>' + s + '</b> day streak</div>' : '') +
    '<div class="wtap">Tap anywhere to start</div>' +
  '</div>';
  document.body.appendChild(el);

  let gone = false;
  const dismiss = () => {
    if (gone) return; gone = true;
    clearTimeout(t);
    el.classList.add('out');
    setTimeout(() => el.remove(), 360);
  };
  el.addEventListener('click', dismiss);
  el.addEventListener('keydown', dismiss);
  const t = setTimeout(dismiss, 2600);
}
function recentPRs(days){
  const cut = addDays(today(), -(days||30));
  const out = [];
  const seen = {};
  const list = doneSessions().filter(s => s.date >= cut).reverse();
  list.forEach(ses => {
    (ses.entries||[]).forEach(en => {
      const key = ses.id + en.exId;
      if (seen[key]) return; seen[key] = 1;
      const work = (en.sets||[]).filter(isWork);
      if (!work.length) return;
      const best = Math.max.apply(null, work.map(setE1rm));
      const base = prBaselineBefore(en.exId, ses.date, ses.id);
      if (base > 0 && best > base * 1.0001){
        out.push({ date: ses.date, exId: en.exId, e1rm: best, gain: best - base });
      }
    });
  });
  return out.slice(0, 8);
}
function prBaselineBefore(exId, date, sesId){
  let best = 0;
  doneSessions().forEach(ses => {
    if (ses.date > date || ses.id === sesId) return;
    (ses.entries||[]).filter(en => en.exId === exId).forEach(en =>
      (en.sets||[]).filter(isWork).forEach(s => { best = Math.max(best, setE1rm(s)); }));
  });
  return best;
}

VIEWS.today = function(){
  const p = DB.profile, t = p.targets;
  const s = streak();
  const wk0 = weekSessions(0), wk1 = weekSessions(1);
  const reps0 = sum(wk0, sessionReps), reps1 = sum(wk1, sessionReps);
  const m0 = rangeMuscle(wk0);
  const sets0 = sum(wk0, sessionWorkSets);
  const todaySes = doneSessions().filter(x => x.date === today());
  const todaySets = sum(todaySes, sessionWorkSets);
  const mac = dayMacros(today());
  const water = DB.water[today()] || 0;
  const bw = latestBw();
  const prs = recentPRs(30);
  const goals = DB.goals.slice().sort((a,b) => goalPct(b).pct - goalPct(a).pct).slice(0,3);

  let out = '';

  /* header */
  out +=
  '<div class="between wrap" style="gap:10px">' +
    '<div class="row" style="gap:12px;min-width:0">' + charGreeter(92) +
      '<div style="min-width:0"><div class="eyebrow">' + greeting() + '</div>' +
      '<h1>' + esc(p.name || 'Athlete') + '</h1>' +
      '<div class="mini dim">' + (CH().name ? esc(CH().name) + ' · ' : '') +
        'Level ' + charLevel().lv + ' ' + esc(charLevel().name) + '</div></div></div>' +
    '<div class="row" style="gap:14px">' +
      '<div class="col center"><div class="row" style="gap:5px"><span class="hot">' + I.flame + '</span>' +
        '<b class="num" style="font-size:21px">' + s + '</b></div>' +
        '<div class="mini dim">day streak</div></div>' +
      (p.phase ? '<span class="chip on">' + esc(p.phase.charAt(0).toUpperCase()+p.phase.slice(1)) + '</span>' : '') +
    '</div>' +
  '</div>';

  /* training card */
  if (DB.active){
    const a = DB.active;
    out += '<div class="hero stack-sm">' +
      '<div class="between"><div class="eyebrow" style="color:var(--acc-hi)">Session in progress</div>' +
      '<span class="tiny dim num">' + sessionWorkSets(a) + ' sets logged</span></div>' +
      '<h2>' + esc(a.name || 'Freestyle session') + '</h2>' +
      '<div class="row" style="gap:8px">' +
        '<button class="btn btn-pri grow" data-act="go" data-v="train">' + I.train + ' Continue</button>' +
        '<button class="btn" data-act="finishSession">Finish</button>' +
      '</div></div>';
  } else if (todaySes.length){
    const top = sessionTop(todaySes[todaySes.length-1]);
    out += '<div class="hero">' +
      '<div class="between" style="align-items:flex-start">' +
        '<div><div class="eyebrow">Today · hard sets</div>' +
        '<div class="hero-v">' + todaySets + '</div>' +
        '<div class="tiny muted" style="margin-top:3px">' + todaySes.map(x => esc(x.name)).join(' · ') + '</div></div>' +
        '<div class="col" style="gap:6px;align-items:flex-end">' +
          '<span class="tag">' + sum(todaySes, sessionReps) + ' reps</span>' +
          (top ? '<span class="tag">Top ' + U.w(top.v,0) + ' e1RM</span>' : '') +
        '</div>' +
      '</div>' +
      '<div class="row" style="gap:8px;margin-top:12px">' +
        '<button class="btn grow" data-act="startTrain">' + I.plus + ' Another session</button>' +
        '<button class="btn" data-act="openSession" data-v="' + todaySes[todaySes.length-1].id + '">Review</button>' +
      '</div></div>';
  } else {
    const plan = splitFor(parseDate(today()).getDay());
    let head, sub, cta;
    if (plan.kind === 'tpl'){
      head = shortTplName(plan.tpl) + ' day.';
      sub = plan.tpl.name + ' — ' + plan.tpl.ex.length + ' exercises, ' + sum(plan.tpl.ex, x => x.sets) + ' sets planned.';
      cta = '<button class="btn btn-pri btn-lg btn-block" data-act="startTpl" data-v="' + plan.tpl.id + '" style="margin-top:4px">' +
              I.train + ' Start ' + esc(shortTplName(plan.tpl)) + '</button>' +
            '<button class="btn btn-ghost btn-block tiny" data-act="startTrain">Train something else</button>';
    } else if (plan.kind === 'rest'){
      head = 'Rest day.';
      const nextUp = weekDays().find(d => d.date > today() && splitFor(d.dow).kind === 'tpl');
      sub = 'Your split has today off' + (nextUp ? ' — ' + shortTplName(splitFor(nextUp.dow).tpl) + ' next, ' +
            DOW_FULL[nextUp.dow] + '.' : '.') + ' Eat, sleep, recover.';
      cta = '<button class="btn btn-lg btn-block" data-act="startTrain" style="margin-top:4px">' + I.train + ' Train anyway</button>';
    } else {
      head = 'Pick up the bar.';
      sub = s > 0 ? 'You are ' + s + ' day' + (s===1?'':'s') + ' deep. Keep it alive.'
                  : 'Start a routine or build a session as you go.';
      cta = '<button class="btn btn-pri btn-lg btn-block" data-act="startTrain" style="margin-top:4px">' + I.train + ' Start training</button>';
    }
    out += '<div class="hero stack-sm">' +
      '<div class="eyebrow">' + DOW_FULL[parseDate(today()).getDay()] + ' · nothing logged yet</div>' +
      '<h2 style="font-size:22px">' + esc(head) + '</h2>' +
      '<div class="tiny muted">' + esc(sub) + '</div>' +
      cta +
    '</div>';
  }

  /* the body, lit up wherever today's work lands */
  out += todayBodyCard();

  /* the week, with the routine on every day */
  out += splitPanel('This week');

  /* week tiles */
  out += '<div class="sec"><span class="eyebrow">Last 7 days</span>' +
    '<button class="sec-link" data-act="go" data-v="progress">Full progress</button></div>' +
  '<div class="grid2">' +
    '<div class="tile"><div class="tl">Sessions</div><div class="tv">' + wk0.length +
      '<small> / ' + (wk1.length || 0) + ' prior</small></div></div>' +
    '<div class="tile"><div class="tl">Hard sets</div><div class="tv">' + sets0 + '</div>' +
      '<div class="ts">' + deltaChip(sets0, sum(wk1, sessionWorkSets)) + ' vs prior week</div></div>' +
    '<div class="tile"><div class="tl">Reps</div><div class="tv">' + reps0 + '</div>' +
      '<div class="ts">' + deltaChip(reps0, reps1) + ' vs prior week</div></div>' +
    '<div class="tile"><div class="tl">Bodyweight</div><div class="tv">' + (bw ? U.w(bw.kg,1) : '—') +
      '<small> ' + p.unit + '</small></div>' +
      '<div class="ts"><button class="sec-link" data-act="logBw">' + (bw ? 'Update' : 'Log it') + '</button>' +
      (bw ? ' · ' + relDate(bw.date) : '') + '</div></div>' +
  '</div>';

  /* nutrition */
  const kcalPct = t.kcal ? mac.kcal/t.kcal*100 : 0;
  out += '<div class="sec"><span class="eyebrow">Fuel today</span>' +
    '<button class="sec-link" data-act="go" data-v="food">Food log</button></div>' +
  '<div class="panel pad stack">' +
    '<div class="row" style="gap:14px">' +
      ring(kcalPct, 78, 8, kcalPct > 105 ? 'var(--warn)' : 'var(--acc)', 'kcal', num(mac.kcal,0)) +
      '<div class="grow stack-sm">' +
        macroRow('Protein', mac.p, t.p, 'var(--s1)') +
        macroRow('Carbs', mac.c, t.c, 'var(--s4)') +
        macroRow('Fat', mac.f, t.f, 'var(--s2)') +
      '</div>' +
    '</div>' +
    '<div class="row wrap tiny muted" style="gap:4px 14px">' +
      '<span><b class="num">' + num(Math.max(0, t.kcal - mac.kcal),0) + '</b> kcal left</span>' +
      '<span><b class="num">' + num(Math.max(0, t.p - mac.p),0) + '</b> g protein left</span>' +
      '<span><b class="num">' + num(mac.fib,0) + '</b> g fibre</span>' +
    '</div>' +
    '<div class="row" style="gap:8px">' +
      '<button class="btn btn-pri grow" data-act="addFood">' + I.plus + ' Log food</button>' +
      '<button class="btn" data-act="quickMacro">Quick macros</button>' +
    '</div>' +
    '<hr class="hr">' +
    '<div class="between">' +
      '<div class="row" style="gap:9px"><span style="color:var(--s1)">' + I.water + '</span>' +
        '<div><div class="tiny"><b class="num">' + num(water,0) + '</b> / ' + num(t.water,0) + ' ml</div>' +
        '<div style="width:120px;margin-top:4px">' + pbar(t.water ? water/t.water*100 : 0) + '</div></div></div>' +
      '<div class="row" style="gap:6px">' +
        '<button class="btn btn-sm" data-act="water" data-v="250">+250</button>' +
        '<button class="btn btn-sm" data-act="water" data-v="500">+500</button>' +
      '</div>' +
    '</div>' +
  '</div>';

  /* weekly muscle sets */
  out += '<div class="sec"><span class="eyebrow">Hard sets by muscle · this week</span>' +
    '<button class="sec-link" data-act="go" data-v="progress">Detail</button></div>' +
  '<div class="panel pad stack-sm">' +
    muscleBars(m0.sets, { fmt: v => num(v,1), scaleMin: 13,
      mark: MUSCLE_KEYS.reduce((a,k) => (a[k]=10, a), {}) }) +
    '<div class="row between tiny dim" style="margin-top:2px">' +
      '<span>Marker at 10 sets — a common weekly floor for growth.</span>' +
    '</div>' +
    areaLegend() +
  '</div>';

  /* goals */
  out += '<div class="sec"><span class="eyebrow">Goals</span>' +
    '<button class="sec-link" data-act="go" data-v="goals">All goals</button></div>';
  if (!goals.length){
    out += '<div class="empty">' + I.goals + '<h4>No goals set</h4>' +
      '<div class="tiny">Name a target and every session moves the bar.</div>' +
      '<button class="btn btn-sm btn-pri" data-act="go" data-v="goals">Set a goal</button></div>';
  } else {
    out += '<div class="stack-sm">' + goals.map(g => goalCardCompact(g)).join('') + '</div>';
  }

  /* PRs */
  out += '<div class="sec"><span class="eyebrow">Records broken · 30 days</span></div>';
  if (!prs.length){
    out += '<div class="panel pad tiny dim">No new records in the last 30 days. Beat an estimated 1RM and it lands here.</div>';
  } else {
    out += '<div class="stack-sm">' + prs.map(r =>
      '<button class="lrow slim" data-act="openEx" data-v="' + r.exId + '">' +
        '<span class="hot" style="width:17px;height:17px;flex:0 0 auto">' + I.trophy + '</span>' +
        '<span class="grow trunc"><span class="ln">' + esc(exName(r.exId)) + '</span>' +
        '<span class="lm" style="display:block">' + relDate(r.date) + '</span></span>' +
        '<span class="lv">' + U.w(r.e1rm,1) + '<span class="dim" style="font-size:11px"> ' + p.unit + '</span></span>' +
        '<span class="chip pr">+' + U.w(r.gain,1) + '</span>' +
      '</button>').join('') + '</div>';
  }

  /* bodyweight trend */
  const bwPts = DB.bw.slice().sort((a,b) => a.date < b.date ? -1 : 1).slice(-40)
    .map(b => ({ k:b.date, label:fmtDate(b.date), v:U.toDisp(b.kg), tipK:fmtDate(b.date,'dow') }));
  if (bwPts.length > 1){
    out += '<div class="sec"><span class="eyebrow">Bodyweight trend</span>' +
      '<button class="sec-link" data-act="logBw">Log today</button></div>' +
      '<div class="panel pad">' + chartSlot('line', { data:bwPts, h:150, color:'var(--s3)',
        fmtY: v => num(v,1), fmtTip: d => num(d.v,1) + ' ' + p.unit, aria:'Bodyweight over time' }) + '</div>';
  }

  return out;
};

function macroRow(name, cur, target, color){
  const pct = target ? cur/target*100 : 0;
  return '<div class="macro">' +
    '<div class="mk">' + name + '</div>' +
    '<div>' + '<div class="pbar"><i style="width:' + clamp(pct,0,100).toFixed(1) + '%;background:' + color + '"></i></div></div>' +
    '<div class="mv">' + num(cur,0) + ' / ' + num(target,0) + ' g</div>' +
  '</div>';
}
function goalCardCompact(g){
  const r = goalPct(g), pace = goalPace(g);
  return '<button class="lrow" data-act="openGoal" data-v="' + g.id + '" style="align-items:stretch">' +
    '<span class="col grow" style="gap:6px;min-width:0">' +
      '<span class="between"><span class="ln trunc">' + esc(g.title) + '</span>' +
      '<span class="goal-pct" style="font-size:15px">' + num(r.pct,0) + '%</span></span>' +
      pbar(r.pct, r.pct >= 100 ? '' : '') +
      '<span class="row between mini dim"><span>' + goalDisp(g, r.cur) + ' of ' + goalDisp(g, g.target) + ' ' + goalUnitLabel(g) + '</span>' +
      (pace ? '<span class="' + (pace.ahead ? 'delta up' : 'delta dn') + '">' +
        (pace.daysLeft >= 0 ? pace.daysLeft + 'd left · ' + (pace.ahead ? 'on pace' : 'behind') : 'past due') + '</span>' : '') +
      '</span>' +
    '</span>' +
  '</button>';
}

/* ---- shared actions ---- */
ACTS.go = (el) => go(el.dataset.v);
ACTS.water = (el) => {
  const k = today();
  DB.water[k] = (DB.water[k] || 0) + parseInt(el.dataset.v,10);
  save(); render();
};
ACTS.logBw = () => {
  const cur = latestBw();
  openSheet({
    title:'Log bodyweight', sub: fmtDate(today(),'long'),
    body:'<div class="stack">' +
      '<div class="field"><label>Weight (' + DB.profile.unit + ')</label>' +
      '<input class="inp num" id="bwv" type="number" step="0.1" inputmode="decimal" data-focus value="' +
        (cur ? num(U.toDisp(cur.kg),1) : '') + '"></div>' +
      '<div class="field"><label>Date</label><input class="inp" id="bwd" type="date" value="' + today() + '"></div>' +
      (cur ? '<div class="tiny dim">Last entry ' + U.wu(cur.kg,1) + ' on ' + fmtDate(cur.date,'long') + '</div>' : '') +
    '</div>',
    foot:'<button class="btn grow" data-act="closeSheet">Cancel</button>' +
         '<button class="btn btn-pri grow" id="bwsave">Save</button>',
    mount(el, inst){
      el.querySelector('[data-act="closeSheet"]').onclick = () => inst.close();
      el.querySelector('#bwsave').onclick = () => {
        const v = parseFloat(el.querySelector('#bwv').value);
        if (!isFinite(v) || v <= 0){ toast('Enter a weight'); return; }
        logBw(el.querySelector('#bwd').value || today(), U.toKg(v));
        inst.close(); render(); toast('Bodyweight logged');
      };
    }
  });
};
ACTS.closeSheet = () => closeSheet();
</script>

<script>
/* ============================================================
   Weekly split
   ============================================================ */
function shortTplName(t){
  if (!t) return '';
  const head = t.name.split(/[—–\-]/)[0].trim();
  return head.length > 1 && head.length <= 16 ? head : t.name.slice(0, 14).trim();
}
function tplArea(t){
  if (!t || !t.ex.length) return 'Chest';
  const c = {};
  t.ex.forEach(x => { const a = exArea(x.exId); c[a] = (c[a]||0) + 1; });
  return Object.keys(c).sort((a,b) => c[b] - c[a])[0];
}
function splitFor(dow){
  const v = DB.split && DB.split.days ? DB.split.days[dow] : null;
  if (v === 'rest') return { kind:'rest' };
  const t = v ? tplById(v) : null;
  return t ? { kind:'tpl', tpl:t } : { kind:'open' };
}
function splitLabel(dow){
  const s = splitFor(dow);
  return s.kind === 'rest' ? 'Rest' : s.kind === 'tpl' ? shortTplName(s.tpl) : 'Open';
}
function splitColor(dow){
  const s = splitFor(dow);
  return s.kind === 'tpl' ? AREA_COLOR[tplArea(s.tpl)] : 'transparent';
}
function weekStart(){                                    // Monday of the week containing today
  return addDays(today(), -((parseDate(today()).getDay() + 6) % 7));
}
function weekDays(){
  const start = weekStart();
  return WEEK_ORDER.map((dow, i) => {
    const date = addDays(start, i);
    return { dow, date, isToday: date === today(), future: date > today() };
  });
}
function plannedThisWeek(){
  return weekDays().filter(d => splitFor(d.dow).kind === 'tpl').length;
}

/* the seven-day strip, shared by Today and Train */
function weekStrip(){
  const trained = trainedDays();
  return '<div class="wk">' + weekDays().map(d => {
    const s = splitFor(d.dow);
    const done = trained.has(d.date);
    return '<div class="wkd' + (d.isToday ? ' today' : '') + (s.kind === 'rest' ? ' rest' : '') +
             (d.future ? ' future' : '') + '" title="' + DOW_FULL[d.dow] + ' · ' +
             (s.kind === 'tpl' ? esc(s.tpl.name) : s.kind === 'rest' ? 'Rest day' : 'Nothing planned') + '">' +
      '<i class="wkb" style="background:' + splitColor(d.dow) + '"></i>' +
      '<div class="wkn">' + DOW[d.dow].toUpperCase() + '</div>' +
      '<div class="wkl">' + esc(splitLabel(d.dow)) + '</div>' +
      '<div class="wkt">' + (done ? I.check : (d.isToday ? '<span class="wkdot"></span>' : '')) + '</div>' +
    '</div>';
  }).join('') + '</div>';
}

/* the editable schedule, on the Train tab */
function splitPanel(title){
  const trained = trainedDays();
  const days = weekDays();
  const doneCount = days.filter(d => trained.has(d.date) && splitFor(d.dow).kind === 'tpl').length;
  const planned = plannedThisWeek();
  return '<div class="sec"><span class="eyebrow">' + esc(title || 'Weekly split') + '</span>' +
      '<span class="tiny dim num">' + doneCount + ' of ' + planned + ' done this week</span></div>' +
    '<div class="panel pad stack-sm">' +
      weekStrip() +
      '<hr class="hr">' +
      '<div class="stack-sm">' + days.map(d => {
        const s = splitFor(d.dow);
        const done = trained.has(d.date);
        return '<div class="splitrow' + (d.isToday ? ' today' : '') + '">' +
          '<span class="exbar" style="background:' + (s.kind === 'tpl' ? AREA_COLOR[tplArea(s.tpl)] : 'var(--line)') + '"></span>' +
          '<span class="col grow" style="min-width:0;gap:1px">' +
            '<span class="row" style="gap:6px">' +
              '<b style="font-family:var(--f-disp);font-size:13px">' + DOW_FULL[d.dow] + '</b>' +
              (d.isToday ? '<span class="tag" style="border-color:var(--acc);color:var(--acc-hi)">Today</span>' : '') +
              (done ? '<span style="color:var(--good);width:14px;height:14px;display:inline-flex">' + I.check + '</span>' : '') +
            '</span>' +
            (s.kind === 'tpl'
              ? '<span class="splitname">' + esc(s.tpl.name) + '</span>' +
                '<span class="mini dim">' + s.tpl.ex.length + ' exercises · ' +
                  sum(s.tpl.ex, x => x.sets) + ' sets · ' + tplArea(s.tpl) + '</span>'
              : '<span class="lm">' + (s.kind === 'rest' ? 'Rest day' : 'Nothing planned') + '</span>') +
          '</span>' +
          (s.kind === 'tpl' && d.isToday && !DB.active
            ? '<button class="btn btn-sm btn-pri" data-act="startTpl" data-v="' + s.tpl.id + '">Start</button>'
            : '') +
          '<button class="icon-btn bare" data-act="editSplitDay" data-v="' + d.dow + '" ' +
            'aria-label="Change ' + DOW_FULL[d.dow] + '">' + I.edit + '</button>' +
        '</div>';
      }).join('') + '</div>' +
      '<div class="mini dim">Tap a day to change what is on it. The split only suggests — you can log anything, any day.</div>' +
    '</div>';
}
ACTS.editSplitDay = (el) => {
  const dow = +el.dataset.v;
  const cur = DB.split.days[dow];
  const tags = [...new Set(DB.templates.map(t => t.tag || 'Custom'))];
  openSheet({
    title: DOW_FULL[dow],
    sub:'What is on this day every week',
    body:'<div class="stack">' +
      '<div class="stack-sm">' +
        '<button class="lrow slim" data-pickday="rest">' +
          '<span class="exbar" style="background:var(--line)"></span>' +
          '<span class="grow"><span class="ln" style="display:block">Rest day</span>' +
          '<span class="lm">No session planned</span></span>' +
          (cur === 'rest' ? '<span style="color:var(--good);width:17px">' + I.check + '</span>' : '') +
        '</button>' +
        '<button class="lrow slim" data-pickday="">' +
          '<span class="exbar" style="background:var(--line)"></span>' +
          '<span class="grow"><span class="ln" style="display:block">Nothing planned</span>' +
          '<span class="lm">Leave the day open</span></span>' +
          (!cur ? '<span style="color:var(--good);width:17px">' + I.check + '</span>' : '') +
        '</button>' +
      '</div>' +
      tags.map(tag => '<div><div class="eyebrow" style="margin-bottom:6px">' + esc(tag) + '</div><div class="stack-sm">' +
        DB.templates.filter(t => (t.tag || 'Custom') === tag).map(t =>
          '<button class="lrow slim" data-pickday="' + t.id + '">' +
            '<span class="exbar" style="background:' + AREA_COLOR[tplArea(t)] + '"></span>' +
            '<span class="grow" style="min-width:0"><span class="ln trunc" style="display:block">' + esc(t.name) + '</span>' +
            '<span class="lm">' + t.ex.length + ' exercises</span></span>' +
            (cur === t.id ? '<span style="color:var(--good);width:17px">' + I.check + '</span>' : '') +
          '</button>').join('') + '</div></div>').join('') +
    '</div>',
    mount(root, inst){
      root.querySelectorAll('[data-pickday]').forEach(b => b.onclick = () => {
        const v = b.dataset.pickday;
        DB.split.days[dow] = v === '' ? null : v;
        save(); inst.close(); render();
        toast(DOW_FULL[dow] + ' → ' + (v === 'rest' ? 'rest' : v === '' ? 'open' : shortTplName(tplById(v))));
      });
    }
  });
};

/* ============================================================
   VIEW — Train
   ============================================================ */
const SET_T = { n:{ l:'', c:'' }, w:{ l:'W', c:'warm' }, d:{ l:'D', c:'drop' }, f:{ l:'A', c:'' } };
const SET_T_NAME = { n:'Working set', w:'Warm-up (excluded from volume)', d:'Drop set', f:'AMRAP / to failure' };
const T_ORDER = ['n','w','d','f'];

function newSet(prev){
  return { w: prev ? prev.w : '', r: prev ? prev.r : '', rpe:'', t:'n', done:false };
}
function startSession(tpl){
  const ses = {
    id: uid('s'), date: today(), name: tpl ? tpl.name : 'Freestyle session',
    tplId: tpl ? tpl.id : null, startedAt: Date.now(), endedAt: null,
    notes:'', bwKg: (latestBw()||{}).kg || null, entries: []
  };
  if (tpl) ses.entries = tpl.ex.map(x => ({
    id: uid('en'), exId: x.exId, note:'', target: x.reps,
    sets: Array.from({length: Math.max(1, x.sets)}, () => newSet(null))
  }));
  DB.active = ses; save(); go('train');
}
function repeatSession(src){
  const ses = {
    id: uid('s'), date: today(), name: src.name, tplId: src.tplId,
    startedAt: Date.now(), endedAt: null, notes:'', bwKg: (latestBw()||{}).kg || null,
    entries: (src.entries||[]).map(en => ({
      id: uid('en'), exId: en.exId, note:'', target: en.target || '',
      sets: (en.sets||[]).filter(s => s.t !== 'w').map(s => ({ w:s.w, r:s.r, rpe:'', t:s.t, done:false }))
    })).filter(en => en.sets.length)
  };
  if (!ses.entries.length) { toast('That session had no logged sets'); return; }
  DB.active = ses; save(); go('train');
  toast('Loaded ' + esc(src.name) + ' — weights carried over');
}

VIEWS.train = function(){
  return DB.active ? activeView() : startView();
};

function startView(){
  const done = doneSessions();
  const last = done[done.length-1];
  const tags = [...new Set(DB.templates.map(t => t.tag || 'Custom'))];
  let out =
  '<div><div class="eyebrow">Training</div><h1>Start a session</h1></div>' +
  splitPanel() +
  '<div class="sec"><span class="eyebrow">Or start anything</span></div>' +
  '<div class="grid2">' +
    '<button class="btn btn-pri btn-lg" data-act="freestyle">' + I.plus + ' Freestyle</button>' +
    (last ? '<button class="btn btn-lg" data-act="repeatLast">' + I.copy + ' Repeat last</button>'
          : '<button class="btn btn-lg" disabled>' + I.copy + ' Repeat last</button>') +
  '</div>';
  if (last) out += '<div class="tiny dim">Last session: ' + esc(last.name) + ' · ' + relDate(last.date) +
    ' · ' + sessionWorkSets(last) + ' hard sets · ' + sessionReps(last) + ' reps</div>';

  tags.forEach(tag => {
    const list = DB.templates.filter(t => (t.tag || 'Custom') === tag);
    out += '<div class="sec"><span class="eyebrow">' + esc(tag) + '</span></div><div class="stack-sm">' +
      list.map(t => {
        const areas = [...new Set(t.ex.map(x => exArea(x.exId)))];
        return '<button class="lrow" data-act="startTpl" data-v="' + t.id + '">' +
          '<span class="exbar" style="background:' + (AREA_COLOR[areas[0]] || 'var(--acc)') + '"></span>' +
          '<span class="grow" style="min-width:0"><span class="ln trunc" style="display:block">' + esc(t.name) + '</span>' +
          '<span class="lm">' + t.ex.length + ' exercises · ' + sum(t.ex, x => x.sets) + ' sets · ' + areas.join(', ') + '</span></span>' +
          '<span style="width:17px;color:var(--ink-3)">' + I.chev + '</span>' +
        '</button>';
      }).join('') + '</div>';
  });

  out += '<div class="row" style="gap:8px"><button class="btn grow" data-act="newTpl">' + I.plus + ' Build a routine</button>' +
    '<button class="btn" data-act="go" data-v="history">' + I.history + ' History</button></div>';
  return out;
}
ACTS.freestyle = () => startSession(null);
ACTS.startTrain = () => go('train');
ACTS.startTpl = (el) => { const t = tplById(el.dataset.v); if (t) startSession(t); };
ACTS.repeatLast = () => { const d = doneSessions(); if (d.length) repeatSession(d[d.length-1]); };

/* ---------------- active session ---------------- */
function activeView(){
  const a = DB.active;
  const sets = sessionWorkSets(a), reps = sessionReps(a);
  const mins = Math.round((Date.now() - a.startedAt) / 60000);
  let out =
  '<div class="hero stack-sm">' +
    '<div class="between">' +
      '<div class="grow" style="min-width:0">' +
        '<div class="eyebrow" style="color:var(--acc-hi)">Logging now · ' + fmtDate(a.date) + '</div>' +
        '<input class="inp" style="background:transparent;border-color:transparent;padding:2px 0;font-family:var(--f-disp);font-weight:700;font-size:19px" ' +
          'value="' + esc(a.name) + '" data-act="sesName" data-on="input" aria-label="Session name">' +
      '</div>' +
      '<button class="icon-btn bare" data-act="sesMenu" aria-label="Session options">' + I.settings + '</button>' +
    '</div>' +
    '<div class="grid3">' +
      '<div><div class="mini eyebrow">Hard sets</div><div class="num" style="font-size:19px" id="hdSets">' + sets + '</div></div>' +
      '<div><div class="mini eyebrow">Reps</div><div class="num" style="font-size:19px" id="hdReps">' + reps + '</div></div>' +
      '<div><div class="mini eyebrow">Elapsed</div><div class="num" style="font-size:19px">' + mins + 'm</div></div>' +
    '</div>' +
  '</div>';

  if (!a.entries.length){
    out += '<div class="empty">' + I.dumb + '<h4>Empty session</h4>' +
      '<div class="tiny">Add the first exercise and start logging sets.</div></div>';
  }

  out += '<div class="stack">' + a.entries.map((en, ei) => exBlock(en, ei)).join('') + '</div>';

  out += '<button class="btn btn-block btn-lg" data-act="addEx">' + I.plus + ' Add exercise</button>';
  out += '<div class="row" style="gap:8px">' +
    '<button class="btn btn-pri grow btn-lg" data-act="finishSession">' + I.check + ' Finish session</button>' +
    '<button class="btn" data-act="discardSession" aria-label="Discard">' + I.trash + '</button>' +
  '</div>';
  return out;
}

function exBlock(en, ei){
  const ex = exById(en.exId);
  if (!ex) return '';
  const area = MUSCLES[ex.primary].area;
  const prev = lastPerformance(en.exId, DB.active.id);
  const base = prBaseline(en.exId, DB.active.id);
  const musc = [MUSCLES[ex.primary].n].concat(ex.sec.map(m => MUSCLES[m].n)).join(' · ');
  let rows = '';
  (en.sets||[]).forEach((s, si) => {
    const e = setE1rm(s);
    const isRec = s.done && e > 0 && base.e1rm > 0 && e > base.e1rm;
    const tt = SET_T[s.t] || SET_T.n;
    rows +=
    '<div class="setgrid setrow' + (s.done ? ' logged' : '') + '">' +
      '<button class="setno ' + tt.c + '" data-act="cycleT" data-e="' + ei + '" data-s="' + si + '" ' +
        'title="' + SET_T_NAME[s.t] + '">' + (tt.l || (si+1)) + '</button>' +
      '<input class="setinp" type="number" step="0.5" inputmode="decimal" placeholder="' + DB.profile.unit + '" ' +
        'value="' + esc(s.w === '' ? '' : num(U.toDisp(+s.w),1)) + '" data-act="setW" data-on="input" data-e="' + ei + '" data-s="' + si + '" aria-label="Weight">' +
      '<input class="setinp" type="number" step="1" inputmode="numeric" placeholder="reps" ' +
        'value="' + esc(s.r) + '" data-act="setR" data-on="input" data-e="' + ei + '" data-s="' + si + '" aria-label="Reps">' +
      '<div class="e1rm' + (isRec ? ' rec' : '') + '" data-e1rm="' + ei + '-' + si + '">' + (e ? U.w(e,0) : '·') + '</div>' +
      '<button class="chk' + (s.done ? ' on' : '') + '" data-act="toggleSet" data-e="' + ei + '" data-s="' + si + '" ' +
        'aria-label="' + (s.done ? 'Logged' : 'Mark set logged') + '">' + I.check + '</button>' +
    '</div>';
  });
  return '<div class="exblock">' +
    '<div class="exhead">' +
      '<span class="exbar" style="background:' + AREA_COLOR[area] + '"></span>' +
      '<span class="grow" style="min-width:0">' +
        '<span class="exname trunc" style="display:block">' + esc(ex.name) + '</span>' +
        '<span class="exmeta">' + esc(musc) + ' · ' + EQUIP[ex.eq] + (en.target ? ' · target ' + esc(en.target) : '') + '</span>' +
      '</span>' +
      (base.e1rm ? '<span class="tag" title="Estimated 1RM to beat">PR ' + U.w(base.e1rm,0) + '</span>' : '') +
      '<button class="icon-btn bare" data-act="exMenu" data-e="' + ei + '" aria-label="Exercise options">' + I.settings + '</button>' +
    '</div>' +
    (prev ? '<div class="prevhint">Previous · ' + relDate(prev.date).toLowerCase() + ' — ' +
      prev.sets.slice(0,5).map(s => U.w(+s.w,0) + '×' + s.r).join(', ') + '</div>' : '') +
    '<div class="setgrid head"><div>Set</div><div>Weight</div><div>Reps</div><div>e1RM</div><div></div></div>' +
    rows +
    (en.note ? '<div class="prevhint" style="color:var(--ink-2)">' + I.note + ' ' + esc(en.note) + '</div>' : '') +
    '<div class="exfoot">' +
      '<button class="btn btn-sm" data-act="addSet" data-e="' + ei + '">' + I.plus + ' Set</button>' +
      '<button class="btn btn-sm" data-act="delSet" data-e="' + ei + '">Remove last</button>' +
      (ex.bar ? '<button class="btn btn-sm" data-act="plateCalc" data-e="' + ei + '">' + I.calc + ' Plates</button>' : '') +
      '<button class="btn btn-sm" data-act="exChart" data-v="' + en.exId + '">' + I.progress + ' Trend</button>' +
    '</div>' +
  '</div>';
}

/* ---- editing actions ---- */
function A(){ return DB.active; }
function setRef(el){
  const en = A().entries[+el.dataset.e];
  return { en, s: en.sets[+el.dataset.s], ei:+el.dataset.e, si:+el.dataset.s };
}
function refreshTotals(){
  const a = A(); if (!a) return;
  const s = document.getElementById('hdSets'), rp = document.getElementById('hdReps');
  if (s) s.textContent = sessionWorkSets(a);
  if (rp) rp.textContent = sessionReps(a);
}
function refreshE1(ei, si){
  const el = document.querySelector('[data-e1rm="' + ei + '-' + si + '"]');
  if (!el) return;
  const s = A().entries[ei].sets[si];
  const e = e1rm(+s.w || 0, +s.r || 0);
  el.textContent = e ? U.w(e,0) : '·';
}
ACTS.sesName = (el) => { A().name = el.value; save(); };
ACTS.setW = (el) => {
  const r = setRef(el);
  const v = parseFloat(el.value);
  r.s.w = isFinite(v) ? +U.toKg(v).toFixed(3) : '';
  save(); refreshE1(r.ei, r.si); refreshTotals();
};
ACTS.setR = (el) => {
  const r = setRef(el);
  const v = parseInt(el.value,10);
  r.s.r = isFinite(v) ? v : '';
  save(); refreshE1(r.ei, r.si); refreshTotals();
};
ACTS.cycleT = (el) => {
  const r = setRef(el);
  r.s.t = T_ORDER[(T_ORDER.indexOf(r.s.t) + 1) % T_ORDER.length];
  save(); render(); toast(SET_T_NAME[r.s.t]);
};
ACTS.toggleSet = (el) => {
  const r = setRef(el);
  if (!r.s.done){
    if (!(+r.s.w >= 0) || !(+r.s.r > 0)){ toast('Weight and reps first'); return; }
    const base = prBaseline(r.en.exId, A().id);
    r.s.done = true;
    const e = setE1rm(r.s);
    save();
    if (base.e1rm > 0 && e > base.e1rm){
      prToast('NEW PR — ' + exName(r.en.exId) + ' ' + U.w(e,1) + ' ' + DB.profile.unit + ' e1RM');
    } else if (base.weight > 0 && +r.s.w > base.weight){
      prToast('HEAVIEST EVER — ' + U.w(+r.s.w,1) + ' ' + DB.profile.unit);
    }
    const rest = DB.profile.restDefault || 120;
    if (rest > 0) startRest(rest);
  } else {
    r.s.done = false; save();
  }
  render();
};
ACTS.addSet = (el) => {
  const en = A().entries[+el.dataset.e];
  const prev = en.sets[en.sets.length-1];
  en.sets.push(newSet(prev && prev.done ? prev : (prev || null)));
  save(); render();
};
ACTS.delSet = (el) => {
  const en = A().entries[+el.dataset.e];
  if (en.sets.length <= 1){ toast('Keep at least one set, or remove the exercise'); return; }
  en.sets.pop(); save(); render();
};
ACTS.exMenu = (el) => {
  const ei = +el.dataset.e, en = A().entries[ei], ex = exById(en.exId);
  openSheet({
    title: ex.name, sub: MUSCLES[ex.primary].n + ' · ' + EQUIP[ex.eq],
    body:'<div class="stack-sm">' +
      '<div class="field"><label>Set note</label><textarea class="inp" id="exnote" placeholder="Grip, tempo, cue, pain flag…">' + esc(en.note||'') + '</textarea></div>' +
      '<div class="field"><label>Target reps</label><input class="inp" id="extgt" value="' + esc(en.target||'') + '" placeholder="6-8"></div>' +
      '<hr class="hr">' +
      '<button class="btn btn-block" data-m="hist">' + I.history + ' Full history for this lift</button>' +
      '<button class="btn btn-block" data-m="up">' + I.up + ' Move up</button>' +
      '<button class="btn btn-block" data-m="down">' + I.down + ' Move down</button>' +
      '<button class="btn btn-block btn-hot" data-m="del">' + I.trash + ' Remove from session</button>' +
    '</div>',
    foot:'<button class="btn btn-pri btn-block" data-m="save">Save</button>',
    mount(root, inst){
      root.querySelectorAll('[data-m]').forEach(b => b.onclick = () => {
        const m = b.dataset.m;
        if (m === 'save'){
          en.note = root.querySelector('#exnote').value.trim();
          en.target = root.querySelector('#extgt').value.trim();
          save(); inst.close(); render(); return;
        }
        if (m === 'hist'){ inst.close(); openExSheet(en.exId); return; }
        if (m === 'up' && ei > 0){ A().entries.splice(ei-1, 0, A().entries.splice(ei,1)[0]); }
        if (m === 'down' && ei < A().entries.length-1){ A().entries.splice(ei+1, 0, A().entries.splice(ei,1)[0]); }
        if (m === 'del'){ A().entries.splice(ei,1); }
        save(); inst.close(); render();
      });
    }
  });
};
ACTS.sesMenu = () => {
  const a = A();
  openSheet({
    title:'Session settings',
    body:'<div class="stack">' +
      '<div class="field"><label>Date</label><input class="inp" id="sd" type="date" value="' + a.date + '"></div>' +
      '<div class="field"><label>Rest timer default (seconds)</label>' +
        '<input class="inp num" id="rs" type="number" step="15" value="' + (DB.profile.restDefault||120) + '"></div>' +
      '<div class="field"><label>Session notes</label><textarea class="inp" id="sn" placeholder="Sleep, energy, pre-workout, aches…">' + esc(a.notes||'') + '</textarea></div>' +
      '<button class="btn btn-block" data-m="timer">' + I.timer + ' Start rest timer now</button>' +
    '</div>',
    foot:'<button class="btn grow" data-m="cancel">Cancel</button><button class="btn btn-pri grow" data-m="save">Save</button>',
    mount(root, inst){
      root.querySelectorAll('[data-m]').forEach(b => b.onclick = () => {
        const m = b.dataset.m;
        if (m === 'cancel') return inst.close();
        if (m === 'timer'){ inst.close(); startRest(DB.profile.restDefault||120); return; }
        a.date = root.querySelector('#sd').value || a.date;
        a.notes = root.querySelector('#sn').value;
        DB.profile.restDefault = parseInt(root.querySelector('#rs').value,10) || 120;
        save(); inst.close(); render();
      });
    }
  });
};
ACTS.finishSession = () => {
  const a = A();
  if (!a) return;
  const sets = sessionWorkSets(a);
  if (!sets){
    confirmSheet({ title:'Nothing logged', msg:'This session has no completed sets. Discard it?', yes:'Discard', danger:true },
      () => { DB.active = null; save(); go('today'); });
    return;
  }
  const m = sessionMuscle(a);
  const areas = areaTotals(m.sets);
  const top = sessionTop(a);
  openSheet({
    title:'Finish session', sub: a.name,
    body:'<div class="stack">' +
      '<div class="grid3">' +
        '<div class="tile"><div class="tl">Hard sets</div><div class="tv">' + sets + '</div></div>' +
        '<div class="tile"><div class="tl">Reps</div><div class="tv">' + sessionReps(a) + '</div></div>' +
        '<div class="tile"><div class="tl">Exercises</div><div class="tv">' + a.entries.filter(en => (en.sets||[]).some(isWork)).length + '</div></div>' +
      '</div>' +
      (top ? '<div class="panel pad tiny"><span class="eyebrow">Top lift</span><div style="margin-top:3px">' +
        esc(exName(top.exId)) + ' — ' + U.w(top.w,1) + ' × ' + top.r + ' · ' + U.w(top.v,1) + ' ' + DB.profile.unit + ' e1RM</div></div>' : '') +
      '<div><div class="eyebrow" style="margin-bottom:7px">Work by area</div>' +
        '<div class="stack-sm">' + AREAS.filter(x => areas[x] > 0).map(x =>
          '<div class="mvrow"><div class="mvn">' + x + '</div><div class="mvb"><i style="width:' +
          (areas[x] / Math.max.apply(null, AREAS.map(y => areas[y])) * 100).toFixed(0) + '%;background:' + AREA_COLOR[x] + '"></i></div>' +
          '<div class="mvv">' + num(areas[x],1) + ' sets</div></div>').join('') + '</div></div>' +
      '<div class="field"><label>Session notes</label><textarea class="inp" id="fn">' + esc(a.notes||'') + '</textarea></div>' +
      '<div class="field"><label>Bodyweight today (' + DB.profile.unit + ') — optional</label>' +
        '<input class="inp num" id="fbw" type="number" step="0.1" inputmode="decimal" value="' +
        (a.bwKg ? num(U.toDisp(a.bwKg),1) : '') + '"></div>' +
    '</div>',
    foot:'<button class="btn grow" data-m="cancel">Keep going</button>' +
         '<button class="btn btn-pri grow" data-m="save">' + I.check + ' Save session</button>',
    mount(root, inst){
      root.querySelector('[data-m="cancel"]').onclick = () => inst.close();
      root.querySelector('[data-m="save"]').onclick = () => {
        a.notes = root.querySelector('#fn').value;
        const bw = parseFloat(root.querySelector('#fbw').value);
        if (isFinite(bw) && bw > 0){ a.bwKg = U.toKg(bw); logBw(a.date, a.bwKg); }
        a.endedAt = Date.now();
        a.entries = a.entries.filter(en => (en.sets||[]).some(s => s.done));
        a.entries.forEach(en => en.sets = en.sets.filter(s => s.done));
        DB.sessions.push(a);
        DB.active = null;
        saveNow(); inst.close(); stopRest(); go('today');
        toast('Session saved — ' + sets + ' sets in the book');
      };
    }
  });
};
ACTS.discardSession = () => {
  confirmSheet({ title:'Discard session', msg:'Everything logged in this session will be thrown away. This cannot be undone.',
    yes:'Discard it', danger:true }, () => { DB.active = null; save(); stopRest(); go('today'); });
};
ACTS.plateCalc = (el) => {
  const en = A().entries[+el.dataset.e];
  const last = (en.sets||[]).slice().reverse().find(s => +s.w > 0);
  openPlateCalc(last ? U.toDisp(+last.w) : null);
};
function openPlateCalc(startDisp){
  const unit = DB.profile.unit;
  const bars = unit === 'kg' ? [20,15,25,10] : [45,35,55,25];
  let total = startDisp || bars[0] * 2;
  let bar = DB.profile.barW || bars[0];
  const body = () =>
    '<div class="stack">' +
      '<div class="grid2">' +
        '<div class="field"><label>Target total (' + unit + ')</label>' +
          '<input class="inp num" id="pcT" type="number" step="' + U.step() + '" inputmode="decimal" value="' + num(total,1) + '"></div>' +
        '<div class="field"><label>Bar weight</label><select class="inp" id="pcB">' +
          bars.map(b => '<option value="' + b + '"' + (b === bar ? ' selected' : '') + '>' + b + ' ' + unit + '</option>').join('') +
        '</select></div>' +
      '</div>' +
      '<div class="panel pad stack-sm"><div class="eyebrow">Per side</div><div id="pcOut"></div></div>' +
      '<div class="row wrap" style="gap:6px">' +
        [-U.step()*2, -U.step(), U.step(), U.step()*2].map(d =>
          '<button class="btn btn-sm" data-d="' + d + '">' + (d>0?'+':'') + num(d,1) + '</button>').join('') +
      '</div>' +
    '</div>';
  openSheet({
    title:'Plate math', sub:'Calibrated plate colours',
    body: body(),
    mount(root, inst){
      const paint = () => {
        root.querySelector('#pcOut').innerHTML = plateStrip(total, bar);
        root.querySelector('#pcT').value = num(total,1);
      };
      root.querySelector('#pcT').addEventListener('input', e => { total = parseFloat(e.target.value)||0; paint(); });
      root.querySelector('#pcB').addEventListener('change', e => {
        bar = parseFloat(e.target.value); DB.profile.barW = bar; save(); paint();
      });
      root.querySelectorAll('[data-d]').forEach(b => b.onclick = () => { total += parseFloat(b.dataset.d); paint(); });
      paint();
    }
  });
}
ACTS.exChart = (el) => openExSheet(el.dataset.v);
</script>

<script>
/* ============================================================
   Exercise picker / detail / custom / routine builder
   ============================================================ */
function exSearch(q, area, eq){
  const t = (q||'').trim().toLowerCase();
  return DB.exercises.filter(e => {
    if (area && MUSCLES[e.primary].area !== area) return false;
    if (eq && e.eq !== eq) return false;
    if (!t) return true;
    return e.name.toLowerCase().includes(t) || MUSCLES[e.primary].n.toLowerCase().includes(t);
  }).sort((a,b) => a.name < b.name ? -1 : 1);
}
function exRow(e){
  const pr = exPR(e.id);
  return '<button class="lrow" data-pick="' + e.id + '">' +
    '<span class="exbar" style="background:' + AREA_COLOR[MUSCLES[e.primary].area] + '"></span>' +
    '<span class="grow" style="min-width:0">' +
      '<span class="ln trunc" style="display:block">' + esc(e.name) + '</span>' +
      '<span class="lm">' + MUSCLES[e.primary].n + ' · ' + EQUIP[e.eq] + (e.custom ? ' · custom' : '') + '</span>' +
    '</span>' +
    (pr ? '<span class="lv dim">' + U.w(pr.e1rm,0) + '</span>' : '') +
    '<span style="width:17px;color:var(--ink-3)">' + I.chev + '</span>' +
  '</button>';
}
function openExPicker(onPick, opts){
  const o = opts || {};
  let q = '', area = '', eq = '';
  const listHtml = () => {
    const list = exSearch(q, area, eq);
    if (!list.length) return '<div class="empty">' + I.search + '<h4>No match</h4>' +
      '<div class="tiny">Nothing in the library fits. Create it as a custom exercise.</div></div>';
    return '<div class="stack-sm">' + list.slice(0, 220).map(exRow).join('') + '</div>';
  };
  openSheet({
    title: o.title || 'Add exercise', sub: DB.exercises.length + ' exercises in your library',
    body:
      '<div class="stack">' +
        '<div class="searchwrap">' + I.search +
          '<input class="inp" id="exq" data-focus placeholder="Search exercise or muscle" autocomplete="off"></div>' +
        '<div class="pillrow" id="exAreas">' +
          '<button class="chip on" data-a="">All areas</button>' +
          AREAS.map(a => '<button class="chip" data-a="' + a + '">' + a + '</button>').join('') +
        '</div>' +
        '<div class="pillrow" id="exEq">' +
          '<button class="chip on" data-q="">Any kit</button>' +
          Object.keys(EQUIP).map(k => '<button class="chip" data-q="' + k + '">' + EQUIP[k] + '</button>').join('') +
        '</div>' +
        '<div id="exList">' + listHtml() + '</div>' +
      '</div>',
    foot:'<button class="btn btn-block" id="exNew">' + I.plus + ' Create custom exercise</button>',
    mount(root, inst){
      const wire = () => root.querySelectorAll('[data-pick]').forEach(b => b.onclick = () => {
        inst.close(); onPick(b.dataset.pick);
      });
      const paint = () => { root.querySelector('#exList').innerHTML = listHtml(); wire(); };
      root.querySelector('#exq').addEventListener('input', e => { q = e.target.value; paint(); });
      root.querySelectorAll('#exAreas [data-a]').forEach(b => b.onclick = () => {
        area = b.dataset.a;
        root.querySelectorAll('#exAreas [data-a]').forEach(x => x.classList.toggle('on', x === b));
        paint();
      });
      root.querySelectorAll('#exEq [data-q]').forEach(b => b.onclick = () => {
        eq = b.dataset.q;
        root.querySelectorAll('#exEq [data-q]').forEach(x => x.classList.toggle('on', x === b));
        paint();
      });
      root.querySelector('#exNew').onclick = () => { inst.close(); newExercise(onPick); };
      wire();
    }
  });
}
ACTS.addEx = () => openExPicker(id => {
  A().entries.push({ id: uid('en'), exId: id, note:'', target:'6-8', sets:[newSet(null), newSet(null)] });
  save(); render();
});

function newExercise(then){
  openSheet({
    title:'Create exercise',
    body:'<div class="stack">' +
      '<div class="field"><label>Name</label><input class="inp" id="nxN" data-focus placeholder="e.g. Cable Y-Raise"></div>' +
      '<div class="grid2">' +
        '<div class="field"><label>Primary muscle</label><select class="inp" id="nxP">' +
          MUSCLE_KEYS.map(k => '<option value="' + k + '">' + MUSCLES[k].n + '</option>').join('') + '</select></div>' +
        '<div class="field"><label>Equipment</label><select class="inp" id="nxE">' +
          Object.keys(EQUIP).map(k => '<option value="' + k + '">' + EQUIP[k] + '</option>').join('') + '</select></div>' +
      '</div>' +
      '<div class="field"><label>Secondary muscles (optional)</label>' +
        '<div class="row wrap" id="nxS" style="gap:5px">' +
          MUSCLE_KEYS.map(k => '<button class="chip" data-s="' + k + '">' + MUSCLES[k].n + '</button>').join('') +
        '</div></div>' +
      '<label class="row tiny" style="gap:8px"><input type="checkbox" id="nxB"> Loaded on a barbell (enables plate math)</label>' +
    '</div>',
    foot:'<button class="btn grow" data-m="c">Cancel</button><button class="btn btn-pri grow" data-m="s">Create</button>',
    mount(root, inst){
      const sec = new Set();
      root.querySelectorAll('[data-s]').forEach(b => b.onclick = () => {
        const k = b.dataset.s;
        if (sec.has(k)) sec.delete(k); else sec.add(k);
        b.classList.toggle('on', sec.has(k));
      });
      root.querySelector('[data-m="c"]').onclick = () => inst.close();
      root.querySelector('[data-m="s"]').onclick = () => {
        const name = root.querySelector('#nxN').value.trim();
        if (!name){ toast('Give it a name'); return; }
        const primary = root.querySelector('#nxP').value;
        sec.delete(primary);
        const e = { id: uid('e'), name, primary, sec:[...sec], eq: root.querySelector('#nxE').value,
                    uni:false, bar: root.querySelector('#nxB').checked, custom:true };
        DB.exercises.push(e); save(); inst.close();
        toast(name + ' added to your library');
        if (then) then(e.id); else render();
      };
    }
  });
}

/* ---------------- exercise detail ---------------- */
function openExSheet(exId){
  const ex = exById(exId); if (!ex) return;
  const h = exHistory(exId);
  const pr = exPR(exId);
  const pts = h.map(x => ({ k:x.date, label:fmtDate(x.date), v:U.toDisp(x.e1rm),
    tipK: fmtDate(x.date,'dow'), tipX: U.w(x.top.w,1) + ' × ' + x.top.r,
    pr: pr && Math.abs(x.e1rm - pr.e1rm) < 1e-6 }));
  const volPts = h.slice(-14).map(x => ({ label: fmtDate(x.date), v: x.sets.length,
    tipK: fmtDate(x.date,'dow'), tipX: x.reps + ' reps · top ' + U.w(x.top.w,0) + '×' + x.top.r }));
  const body =
    '<div class="stack">' +
      '<div class="row wrap" style="gap:6px">' +
        '<span class="chip on">' + MUSCLES[ex.primary].n + '</span>' +
        ex.sec.map(m => '<span class="chip">' + MUSCLES[m].n + '</span>').join('') +
        '<span class="chip">' + EQUIP[ex.eq] + '</span>' +
      '</div>' +
      (pr ?
        '<div class="grid3">' +
          '<div class="tile"><div class="tl">Best e1RM</div><div class="tv">' + U.w(pr.e1rm,1) + '</div>' +
            '<div class="ts">' + relDate(pr.e1rmDate) + '</div></div>' +
          '<div class="tile"><div class="tl">Heaviest</div><div class="tv">' + U.w(pr.weight,1) + '</div>' +
            '<div class="ts">' + relDate(pr.weightDate) + '</div></div>' +
          '<div class="tile"><div class="tl">Sessions</div><div class="tv">' + pr.sessions + '</div>' +
            '<div class="ts">latest ' + relDate(pr.last.date).toLowerCase() + '</div></div>' +
        '</div>'
        : '<div class="empty">' + I.dumb + '<h4>No history yet</h4><div class="tiny">Log this lift and the trend appears here.</div></div>') +
      (pts.length > 1 ?
        '<div><div class="eyebrow" style="margin-bottom:6px">Estimated 1RM · ' + DB.profile.unit + '</div>' +
        chartSlot('line', { data: pts, h:170, color:'var(--s1)', fmtY: v => num(v,0),
          fmtTip: d => num(d.v,1) + ' ' + DB.profile.unit, aria:'Estimated one-rep max over time' }) +
        '<div class="tiny dim">Epley estimate from your best set each session. Circled point is your record.</div></div>' : '') +
      (volPts.length > 1 ?
        '<div><div class="eyebrow" style="margin-bottom:6px">Hard sets per session</div>' +
        chartSlot('bar', { data: volPts, h:140, color:'var(--s2)', fmtY: v => num(v,0),
          fmtTip: d => d.v + (d.v === 1 ? ' set' : ' sets'), aria:'Hard sets per session' }) + '</div>' : '') +
      (h.length ?
        '<div><div class="eyebrow" style="margin-bottom:6px">Session log</div>' +
        '<div class="panel scroll-x"><table class="tbl"><thead><tr><th>Date</th><th>Sets</th>' +
        '<th class="n">Reps</th><th class="n">e1RM</th></tr></thead><tbody>' +
        h.slice().reverse().slice(0,24).map(x => '<tr><td class="nowrap">' + fmtDate(x.date) + '</td>' +
          '<td class="tiny">' + x.sets.map(s => U.w(+s.w,0) + '×' + s.r).join(', ') + '</td>' +
          '<td class="n">' + x.reps + '</td>' +
          '<td class="n">' + U.w(x.e1rm,1) + '</td></tr>').join('') +
        '</tbody></table></div></div>' : '');
  openSheet({ title: ex.name, sub: MUSCLES[ex.primary].area + ' · ' + EQUIP[ex.eq], body });
}
ACTS.openEx = (el) => openExSheet(el.dataset.v);

/* ---------------- routine builder ----------------
   `draft` is live: the exercise picker mutates it and we repaint in place.
--------------------------------------------------- */
function openTplEditor(source){
  const isEdit = !!source;
  const draft = source
    ? { id: source.id, name: source.name, tag: source.tag || 'Custom', stock: !!source.stock,
        ex: source.ex.map(x => ({ exId:x.exId, sets:x.sets, reps:x.reps })) }
    : { id: uid('t'), name:'', tag:'Custom', stock:false, ex:[] };

  const listHtml = () => draft.ex.length
    ? '<div class="stack-sm">' + draft.ex.map((x,i) => {
        const ex = exById(x.exId);
        return '<div class="panel pad row" style="gap:8px">' +
          '<span class="exbar" style="background:' + AREA_COLOR[exArea(x.exId)] + '"></span>' +
          '<span class="grow" style="min-width:0"><span class="ln trunc" style="display:block">' + esc(exName(x.exId)) + '</span>' +
          '<span class="lm">' + (ex ? MUSCLES[ex.primary].n : '') + '</span></span>' +
          '<input class="setinp" style="width:50px" type="number" min="1" value="' + x.sets + '" data-i="' + i + '" data-f="sets" aria-label="Sets">' +
          '<input class="setinp" style="width:62px" value="' + esc(x.reps) + '" data-i="' + i + '" data-f="reps" aria-label="Rep range">' +
          '<button class="icon-btn bare" data-rm="' + i + '" aria-label="Remove ' + esc(exName(x.exId)) + '">' + I.x + '</button>' +
        '</div>';
      }).join('') + '</div>'
    : '<div class="empty">' + I.dumb + '<div class="tiny">No exercises yet — add the first one below.</div></div>';

  const inst = openSheet({
    title: isEdit ? 'Edit routine' : 'Build a routine',
    sub:'Sets and rep targets are the plan; you log the real numbers in the session.',
    body:
      '<div class="stack">' +
        '<div class="field"><label>Routine name</label>' +
          '<input class="inp" id="tN" data-focus value="' + esc(draft.name) + '" placeholder="e.g. Push A — Heavy"></div>' +
        '<div class="field"><label>Group</label>' +
          '<input class="inp" id="tT" value="' + esc(draft.tag) + '" placeholder="Custom" list="tplTags">' +
          '<datalist id="tplTags">' + [...new Set(DB.templates.map(t => t.tag))].map(t => '<option>' + esc(t) + '</option>').join('') + '</datalist></div>' +
        '<div><div class="eyebrow" style="margin-bottom:7px">Exercises · sets · reps</div>' +
          '<div id="tList">' + listHtml() + '</div></div>' +
        '<button class="btn btn-block" id="tAdd">' + I.plus + ' Add exercise</button>' +
      '</div>',
    foot:(isEdit && !draft.stock ? '<button class="btn btn-hot" id="tDel" aria-label="Delete routine">' + I.trash + '</button>' : '') +
         '<button class="btn grow" id="tC">Cancel</button>' +
         '<button class="btn btn-pri grow" id="tS">Save routine</button>',
    mount(root, sheet){
      const grab = () => {
        draft.name = root.querySelector('#tN').value;
        draft.tag = root.querySelector('#tT').value;
      };
      const repaint = () => {
        root.querySelector('#tList').innerHTML = listHtml();
        wireList();
      };
      const wireList = () => {
        root.querySelectorAll('[data-rm]').forEach(b => b.onclick = () => {
          draft.ex.splice(+b.dataset.rm, 1); repaint();
        });
        root.querySelectorAll('[data-f]').forEach(inp => inp.oninput = () => {
          const x = draft.ex[+inp.dataset.i];
          if (inp.dataset.f === 'sets') x.sets = Math.max(1, parseInt(inp.value,10) || 1);
          else x.reps = inp.value;
        });
      };
      wireList();
      root.querySelector('#tAdd').onclick = () => {
        grab();
        openExPicker(id => { draft.ex.push({ exId:id, sets:2, reps:'6-8' }); repaint(); },
          { title:'Add to routine' });
      };
      root.querySelector('#tC').onclick = () => sheet.close();
      const del = root.querySelector('#tDel');
      if (del) del.onclick = () => {
        sheet.close();
        confirmSheet({ title:'Delete routine', msg:'Remove "' + draft.name + '" from your routines? Logged sessions stay untouched.',
          yes:'Delete', danger:true }, () => {
            DB.templates = DB.templates.filter(t => t.id !== draft.id);
            save(); render(); toast('Routine deleted');
          });
      };
      root.querySelector('#tS').onclick = () => {
        grab();
        draft.name = draft.name.trim();
        draft.tag = draft.tag.trim() || 'Custom';
        if (!draft.name){ toast('Name the routine'); return; }
        if (!draft.ex.length){ toast('Add at least one exercise'); return; }
        const i = DB.templates.findIndex(t => t.id === draft.id);
        if (i >= 0) DB.templates[i] = draft; else DB.templates.push(draft);
        save(); sheet.close(); render(); toast('Routine saved');
      };
    }
  });
  return inst;
}
ACTS.newTpl = () => openTplEditor(null);
ACTS.editTpl = (el) => { const t = tplById(el.dataset.v); if (t) openTplEditor(t); };
</script>

<script>
/* ============================================================
   VIEW — Progress
   ============================================================ */
const RANGES = [ {k:28,n:'4 wk'}, {k:84,n:'12 wk'}, {k:182,n:'6 mo'}, {k:9999,n:'All'} ];
let progRange = 84;
let progSite = 'arm';

function rangeBounds(days){
  const first = doneSessions()[0];
  if (days >= 9999) return { start: first ? first.date : today(), end: today(), days: first ? daysBetween(first.date, today())+1 : 1 };
  return { start: addDays(today(), -(days-1)), end: today(), days };
}
function weeklyBuckets(days){
  const n = Math.min(26, Math.max(4, Math.ceil(days/7)));
  const out = [];
  for (let i = n-1; i >= 0; i--){
    const end = addDays(today(), -7*i);
    const start = addDays(end, -6);
    const ss = doneSessions().filter(s => s.date >= start && s.date <= end);
    out.push({ start, end, sessions: ss, label: fmtDate(start) });
  }
  return out;
}
function strengthMovers(days){
  const b = rangeBounds(days);
  const inRange = doneSessions().filter(s => s.date >= b.start);
  const byEx = {};
  inRange.forEach(ses => (ses.entries||[]).forEach(en => {
    const work = (en.sets||[]).filter(isWork);
    if (!work.length) return;
    const best = Math.max.apply(null, work.map(setE1rm));
    (byEx[en.exId] = byEx[en.exId] || []).push({ date: ses.date, e: best });
  }));
  const out = [];
  Object.keys(byEx).forEach(id => {
    const arr = byEx[id].sort((a,b) => a.date < b.date ? -1 : 1);
    if (arr.length < 2) return;
    const first = arr[0].e, best = Math.max.apply(null, arr.map(x => x.e));
    out.push({ exId:id, first, best, pct: (best-first)/first*100, n: arr.length,
               area: exArea(id) });
  });
  return out.sort((a,b) => b.pct - a.pct);
}

VIEWS.progress = function(){
  const b = rangeBounds(progRange);
  const cur = sessionsBetween(b.start, b.end);
  const prevEnd = addDays(b.start, -1), prevStart = addDays(prevEnd, -(b.days-1));
  const prev = sessionsBetween(prevStart, prevEnd);
  const mCur = rangeMuscle(cur), mPrev = rangeMuscle(prev);
  const setsCur = sum(cur, sessionWorkSets), setsPrev = sum(prev, sessionWorkSets);
  const weeks = weeklyBuckets(b.days);
  const wkPts = weeks.map(w => ({ label: fmtDate(w.start), v: sum(w.sessions, sessionWorkSets),
    tipK: fmtDate(w.start) + ' – ' + fmtDate(w.end),
    tipX: w.sessions.length + ' session' + (w.sessions.length===1?'':'s') + ' · ' + sum(w.sessions, sessionReps) + ' reps' }));
  const movers = strengthMovers(progRange);
  const areaCur = areaTotals(mCur.sets), areaPrev = areaTotals(mPrev.sets);
  const wkCount = Math.max(1, b.days/7);

  let out =
  '<div class="between wrap"><div><div class="eyebrow">Progress</div><h1>Growth ledger</h1></div>' +
    '<div class="seg">' + RANGES.map(r =>
      '<button class="' + (progRange === r.k ? 'on' : '') + '" data-act="progRange" data-v="' + r.k + '">' + r.n + '</button>').join('') +
    '</div></div>';

  if (!cur.length){
    return out + '<div class="empty">' + I.progress + '<h4>Nothing in this window</h4>' +
      '<div class="tiny">Log a session and every chart here fills in.</div>' +
      '<button class="btn btn-sm btn-pri" data-act="startTrain">Start training</button></div>';
  }

  /* headline */
  out += '<div class="hero">' +
    '<div class="between" style="align-items:flex-start">' +
      '<div><div class="eyebrow">Hard sets · ' + fmtDate(b.start) + ' to ' + fmtDate(b.end) + '</div>' +
        '<div class="hero-v">' + setsCur + '</div>' +
        '<div class="tiny muted" style="margin-top:4px">' +
          (setsPrev > 0
            ? deltaChip(setsCur, setsPrev) + ' vs the ' + (b.days >= 9999 ? 'period before' : b.days + ' days before')
            : 'First block of this length on record — nothing to compare against yet') +
        '</div></div>' +
      '<div class="col" style="gap:5px;align-items:flex-end">' +
        '<span class="tag">' + cur.length + ' sessions</span>' +
        '<span class="tag">' + num(setsCur / wkCount, 0) + ' sets / week</span>' +
        '<span class="tag">' + (cur.length / wkCount).toFixed(1) + ' sessions / week</span>' +
      '</div>' +
    '</div>' +
  '</div>';

  /* weekly hard sets */
  out += '<div class="sec"><span class="eyebrow">Hard sets per week</span></div>' +
    '<div class="panel pad">' +
      chartSlot('bar', { data: wkPts, h:170, color:'var(--s1)', fmtY: v => num(v,0),
        fmtTip: d => d.v + ' hard sets', aria:'Hard sets per week' }) +
      '<div class="tiny dim">Each bar is a 7-day block ending on the labelled week start.</div>' +
    '</div>';

  /* muscle group growth */
  out += '<div class="sec"><span class="eyebrow">Hard sets by muscle group</span>' +
    '<span class="tiny dim">per week</span></div>' +
  '<div class="panel pad stack-sm">' +
    muscleBars(mCur.sets, { fmt: v => num(v/wkCount,1) + '/wk', scaleMin: 10 }) +
    areaLegend() +
  '</div>';

  /* muscle delta table */
  const rows = MUSCLE_KEYS.filter(k => mCur.sets[k] > 0 || mPrev.sets[k] > 0)
    .sort((a,b) => mCur.sets[b] - mCur.sets[a]);
  out += '<div class="panel scroll-x"><table class="tbl"><thead><tr>' +
    '<th>Muscle</th><th>Area</th><th class="n">Sets/wk</th><th class="n">Prior</th>' +
    '<th class="n">Total sets</th><th class="n">Change</th></tr></thead><tbody>' +
    rows.map(k => {
      const now = mCur.sets[k]/wkCount, before = mPrev.sets[k]/wkCount;
      return '<tr><td class="nowrap"><span class="row" style="gap:7px">' +
        '<i class="dot" style="background:' + AREA_COLOR[MUSCLES[k].area] + '"></i>' + MUSCLES[k].n + '</span></td>' +
        '<td class="tiny dim">' + MUSCLES[k].area + '</td>' +
        '<td class="n">' + num(now,1) + '</td><td class="n dim">' + num(before,1) + '</td>' +
        '<td class="n">' + num(mCur.sets[k],1) + '</td>' +
        '<td class="n">' + deltaChip(mCur.sets[k], mPrev.sets[k]) + '</td></tr>';
    }).join('') + '</tbody></table></div>';

  /* focused areas */
  out += '<div class="sec"><span class="eyebrow">Focused areas · sets per week</span></div>' +
    '<div class="grid3">' + AREAS.map(a =>
      '<div class="tile"><div class="tl">' + a + '</div>' +
      '<div class="tv" style="font-size:19px">' + num(areaCur[a]/wkCount,1) + '</div>' +
      '<div class="ts">' + deltaChip(areaCur[a], areaPrev[a]) + '</div>' +
      '<div style="margin-top:5px">' + '<div class="pbar"><i style="width:' +
        clamp(areaCur[a]/Math.max.apply(null, AREAS.map(x => areaCur[x] || 1))*100, 0, 100).toFixed(0) +
        '%;background:' + AREA_COLOR[a] + '"></i></div></div></div>').join('') +
    '</div>';

  /* strength movers */
  out += '<div class="sec"><span class="eyebrow">Strength change in window</span></div>';
  if (!movers.length){
    out += '<div class="panel pad tiny dim">Log a lift on at least two separate days to see its trend.</div>';
  } else {
    const top = movers.slice(0,6), bottom = movers.slice(-3).filter(x => x.pct < 0 && !top.includes(x));
    out += '<div class="stack-sm">' + top.concat(bottom).map(m =>
      '<button class="lrow" data-act="openEx" data-v="' + m.exId + '">' +
        '<span class="exbar" style="background:' + AREA_COLOR[m.area] + '"></span>' +
        '<span class="grow" style="min-width:0"><span class="ln trunc" style="display:block">' + esc(exName(m.exId)) + '</span>' +
        '<span class="lm">' + U.w(m.first,0) + ' → ' + U.w(m.best,0) + ' ' + DB.profile.unit + ' e1RM · ' + m.n + ' sessions</span></span>' +
        '<span class="delta ' + (m.pct >= 0.5 ? 'up' : m.pct <= -0.5 ? 'dn' : 'flat') + '">' +
          (m.pct > 0 ? '+' : '') + num(m.pct,1) + '%</span>' +
      '</button>').join('') + '</div>';
  }

  /* records board */
  const board = DB.exercises.map(e => ({ e, pr: exPR(e.id) })).filter(x => x.pr)
    .sort((a,b) => b.pr.e1rm - a.pr.e1rm).slice(0,10);
  if (board.length){
    out += '<div class="sec"><span class="eyebrow">Record board · best estimated 1RM</span></div>' +
      '<div class="panel scroll-x"><table class="tbl"><thead><tr><th>Lift</th>' +
      '<th class="n">e1RM</th><th class="n">Heaviest</th><th class="n">Set</th><th>When</th></tr></thead><tbody>' +
