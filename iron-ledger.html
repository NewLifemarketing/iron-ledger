      board.map(x => '<tr><td class="nowrap"><button class="sec-link" data-act="openEx" data-v="' + x.e.id + '">' +
        esc(x.e.name) + '</button></td>' +
        '<td class="n">' + U.w(x.pr.e1rm,1) + '</td><td class="n">' + U.w(x.pr.weight,1) + '</td>' +
        '<td class="n dim">' + U.w(x.pr.e1rmSet.w,0) + '×' + x.pr.e1rmSet.r + '</td>' +
        '<td class="tiny dim nowrap">' + fmtDate(x.pr.e1rmDate) + '</td></tr>').join('') +
      '</tbody></table></div>';
  }

  /* measurements */
  const ms = DB.measures.slice().sort((a,b) => a.date < b.date ? -1 : 1);
  const msPts = ms.filter(m => m[progSite] != null)
    .map(m => ({ k:m.date, label:fmtDate(m.date), v:U.lenToDisp(m[progSite]), tipK:fmtDate(m.date,'dow') }));
  out += '<div class="sec"><span class="eyebrow">Tape measure</span>' +
    '<button class="sec-link" data-act="logMeasure">Log measurements</button></div>' +
    '<div class="panel pad stack-sm">' +
      '<div class="pillrow">' + MEASURE_FIELDS.map(([k,n]) =>
        '<button class="chip ' + (progSite===k?'on':'') + '" data-act="progSite" data-v="' + k + '">' + n + '</button>').join('') + '</div>' +
      (msPts.length > 1
        ? chartSlot('line', { data: msPts, h:150, color:'var(--s3)', fmtY: v => num(v,1),
            fmtTip: d => num(d.v,1) + ' ' + U.lenUnit(), aria:'Measurement over time' })
        : '<div class="empty">' + I.ruler + '<h4>Two entries needed</h4>' +
          '<div class="tiny">Log the tape every 2–4 weeks to see limb growth against your training volume.</div></div>') +
      (ms.length ? '<div class="row between tiny dim"><span>Latest ' + relDate(ms[ms.length-1].date) + '</span>' +
        '<span>' + ms.length + ' entr' + (ms.length===1?'y':'ies') + '</span></div>' : '') +
    '</div>';

  /* consistency */
  out += '<div class="sec"><span class="eyebrow">Consistency · 18 weeks</span></div>' +
    '<div class="panel pad stack-sm">' + heatmap(18) +
      '<div class="row between tiny dim"><span>Darker = heavier day</span>' +
      '<span>' + streak() + '-day streak · ' + trainedDays().size + ' training days logged</span></div></div>';

  return out;
};
ACTS.progRange = (el) => { progRange = +el.dataset.v; render(); };
ACTS.progSite = (el) => { progSite = el.dataset.v; render(); };

ACTS.logMeasure = () => {
  const last = latestMeasure() || {};
  openSheet({
    title:'Log measurements', sub:'All sites optional · ' + U.lenUnit(),
    body:'<div class="stack">' +
      '<div class="field"><label>Date</label><input class="inp" id="mdate" type="date" value="' + today() + '"></div>' +
      '<div class="grid2">' + MEASURE_FIELDS.map(([k,n]) =>
        '<div class="field"><label>' + n + '</label>' +
        '<input class="inp num" data-mf="' + k + '" type="number" step="0.1" inputmode="decimal" placeholder="' +
        (last[k] != null ? num(U.lenToDisp(last[k]),1) : '—') + '"></div>').join('') + '</div>' +
      '<div class="field"><label>Body fat estimate (%) — optional</label>' +
        '<input class="inp num" data-mf="bf" type="number" step="0.1" inputmode="decimal" placeholder="' +
        (last.bf != null ? num(last.bf,1) : '—') + '"></div>' +
      '<div class="tiny dim">Blank fields carry nothing forward — only what you type is stored.</div>' +
    '</div>',
    foot:'<button class="btn grow" data-m="c">Cancel</button><button class="btn btn-pri grow" data-m="s">Save</button>',
    mount(root, inst){
      root.querySelector('[data-m="c"]').onclick = () => inst.close();
      root.querySelector('[data-m="s"]').onclick = () => {
        const rec = { date: root.querySelector('#mdate').value || today() };
        let any = false;
        root.querySelectorAll('[data-mf]').forEach(inp => {
          const v = parseFloat(inp.value);
          if (isFinite(v)){
            rec[inp.dataset.mf] = inp.dataset.mf === 'bf' ? v : U.lenToStore(v);
            any = true;
          }
        });
        if (!any){ toast('Fill at least one site'); return; }
        const i = DB.measures.findIndex(m => m.date === rec.date);
        if (i >= 0) DB.measures[i] = Object.assign(DB.measures[i], rec); else DB.measures.push(rec);
        save(); inst.close(); render(); toast('Measurements logged');
      };
    }
  });
};
</script>

<script>
/* ============================================================
   VIEW — Nutrition
   ============================================================ */
let foodDate = null;                       // null → today
const fDate = () => foodDate || today();
function slotForNow(){
  const h = new Date().getHours();
  return h < 10.5 ? 'Breakfast' : h < 15 ? 'Lunch' : h < 21 ? 'Dinner' : 'Snacks';
}
function frequentFoods(n){
  const c = {};
  DB.meals.forEach(m => { if (m.foodId) c[m.foodId] = (c[m.foodId]||0) + 1; });
  return Object.keys(c).sort((a,b) => c[b]-c[a]).slice(0,n).map(foodById).filter(Boolean);
}

VIEWS.food = function(){
  const d = fDate(), t = DB.profile.targets;
  const entries = mealsOn(d);
  const mac = macroTotals(entries);
  const split = macroKcalSplit(mac);
  const water = DB.water[d] || 0;
  const kcalPct = t.kcal ? mac.kcal/t.kcal*100 : 0;
  const left = t.kcal - mac.kcal;
  const avg = avgMacros(7);

  let out =
  '<div class="between">' +
    '<div><div class="eyebrow">Nutrition</div><h1>' + (d === today() ? 'Today' : fmtDate(d,'dow')) + '</h1></div>' +
    '<div class="row" style="gap:4px">' +
      '<button class="icon-btn" data-act="foodDay" data-v="-1" aria-label="Previous day">' + I.back + '</button>' +
      (d !== today() ? '<button class="btn btn-sm" data-act="foodDay" data-v="0">Today</button>' : '') +
      '<button class="icon-btn" data-act="foodDay" data-v="1" aria-label="Next day"' +
        (d >= today() ? ' disabled' : '') + '>' + I.chev + '</button>' +
    '</div>' +
  '</div>';

  /* headline */
  out += '<div class="hero">' +
    '<div class="row" style="gap:16px;align-items:center">' +
      ring(kcalPct, 92, 9, kcalPct > 105 ? 'var(--warn)' : 'var(--acc)', 'of ' + num(t.kcal,0), num(mac.kcal,0)) +
      '<div class="grow">' +
        '<div class="eyebrow">' + (left >= 0 ? 'Remaining' : 'Over target') + '</div>' +
        '<div class="hero-v" style="font-size:34px">' + num(Math.abs(left),0) + '<small>kcal</small></div>' +
        '<div class="tiny muted" style="margin-top:4px">' + entries.length + ' item' + (entries.length===1?'':'s') +
          ' · ' + num(mac.fib,0) + ' g fibre</div>' +
      '</div>' +
    '</div>' +
    '<div class="stack-sm" style="margin-top:14px">' +
      macroRow('Protein', mac.p, t.p, 'var(--s1)') +
      macroRow('Carbs', mac.c, t.c, 'var(--s4)') +
      macroRow('Fat', mac.f, t.f, 'var(--s2)') +
    '</div>' +
    '<div class="row wrap tiny dim" style="gap:4px 12px;margin-top:9px">' +
      '<span>Energy split — P ' + num(split.pPct,0) + '% · C ' + num(split.cPct,0) + '% · F ' + num(split.fPct,0) + '%</span>' +
    '</div>' +
  '</div>';

  out += '<button class="btn btn-pri btn-lg btn-block" data-act="scanMeal">' + I.food + ' Scan a meal from a photo</button>' +
  '<div class="row" style="gap:8px">' +
    '<button class="btn grow" data-act="addFood">' + I.plus + ' Log food</button>' +
    '<button class="btn grow" data-act="quickMacro">Quick macros</button>' +
  '</div>';

  /* meals by slot */
  SLOTS.forEach(slot => {
    const items = entries.filter(m => m.slot === slot);
    if (!items.length) return;
    const st = macroTotals(items);
    out += '<div class="sec"><span class="eyebrow">' + slot + '</span>' +
      '<span class="tiny dim num">' + num(st.kcal,0) + ' kcal · ' + num(st.p,0) + ' P</span></div>' +
      '<div class="stack-sm">' + items.map(m =>
        '<button class="lrow slim" data-act="editMeal" data-v="' + m.id + '">' +
          (m.img ? '<img class="mealthumb" src="' + m.img + '" alt="">' : '') +
          '<span class="grow" style="min-width:0"><span class="ln trunc" style="display:block">' + esc(m.name) + '</span>' +
          '<span class="lm num">' + num(m.qty,2) + ' × ' + esc(m.unit) + ' · ' +
            num(m.p*m.qty,0) + 'P ' + num(m.c*m.qty,0) + 'C ' + num(m.f*m.qty,0) + 'F</span></span>' +
          '<span class="lv">' + num(m.kcal*m.qty,0) + '</span>' +
        '</button>').join('') + '</div>';
  });
  if (!entries.length){
    out += '<div class="empty">' + I.food + '<h4>Nothing logged yet</h4>' +
      '<div class="tiny">Search the library, or enter macros straight in if you already know them.</div></div>';
  } else {
    out += '<div class="row wrap" style="gap:6px">' + SLOTS.filter(s => !entries.some(m => m.slot === s))
      .map(s => '<button class="chip" data-act="addFood" data-slot="' + s + '">' + I.plus + ' ' + s + '</button>').join('') + '</div>';
  }

  /* water */
  out += '<div class="sec"><span class="eyebrow">Water</span>' +
    '<span class="tiny dim num">' + num(water,0) + ' / ' + num(t.water,0) + ' ml</span></div>' +
    '<div class="panel pad stack-sm">' +
      pbar(t.water ? water/t.water*100 : 0, 'thick') +
      '<div class="row wrap" style="gap:6px">' +
        [250,500,750].map(v => '<button class="btn btn-sm" data-act="waterD" data-v="' + v + '">+' + v + ' ml</button>').join('') +
        '<button class="btn btn-sm" data-act="waterD" data-v="-250">−250</button>' +
        '<button class="btn btn-sm btn-ghost" data-act="waterD" data-v="reset">Reset</button>' +
      '</div>' +
    '</div>';

  /* weekly */
  const wkPts = [];
  for (let i = 6; i >= 0; i--){
    const k = addDays(today(), -i);
    const m = dayMacros(k);
    wkPts.push({ label: DOW[parseDate(k).getDay()].slice(0,1), v: m.kcal, tipK: fmtDate(k,'dow'),
      tipX: num(m.p,0) + 'P · ' + num(m.c,0) + 'C · ' + num(m.f,0) + 'F',
      color: m.kcal > t.kcal * 1.05 ? 'var(--warn)' : 'var(--s3)', dim: m.kcal === 0 });
  }
  out += '<div class="sec"><span class="eyebrow">Last 7 days · calories</span>' +
    (avg ? '<span class="tiny dim num">avg ' + num(avg.kcal,0) + ' kcal</span>' : '') + '</div>' +
    '<div class="panel pad">' +
      chartSlot('bar', { data: wkPts, h:150, fmtY: v => compact(v), fmtTip: d => num(d.v,0) + ' kcal',
        aria:'Calories per day, last 7 days' }) +
      (avg ? '<div class="grid3" style="margin-top:10px">' +
        '<div class="tile"><div class="tl">Avg protein</div><div class="tv" style="font-size:19px">' + num(avg.p,0) + '<small> g</small></div>' +
          '<div class="ts">target ' + t.p + ' g</div></div>' +
        '<div class="tile"><div class="tl">Avg carbs</div><div class="tv" style="font-size:19px">' + num(avg.c,0) + '<small> g</small></div>' +
          '<div class="ts">target ' + t.c + ' g</div></div>' +
        '<div class="tile"><div class="tl">Avg fat</div><div class="tv" style="font-size:19px">' + num(avg.f,0) + '<small> g</small></div>' +
          '<div class="ts">target ' + t.f + ' g</div></div>' +
      '</div>' +
      '<div class="tiny dim" style="margin-top:7px">Averaged over the ' + avg.days + ' day' + (avg.days===1?'':'s') +
        ' with food logged. Days you did not log are left out rather than counted as zero.</div>' : '') +
    '</div>';

  out += '<div class="row" style="gap:8px">' +
    '<button class="btn grow" data-act="copyDay">' + I.copy + ' Copy another day</button>' +
    '<button class="btn grow" data-act="foodLib">' + I.food + ' Food library</button>' +
  '</div>';
  return out;
};
ACTS.foodDay = (el) => {
  const v = el.dataset.v;
  if (v === '0') foodDate = null;
  else {
    const next = addDays(fDate(), +v);
    if (next > today()) return;
    foodDate = next === today() ? null : next;
  }
  render();
};
ACTS.waterD = (el) => {
  const d = fDate();
  if (el.dataset.v === 'reset') DB.water[d] = 0;
  else DB.water[d] = Math.max(0, (DB.water[d]||0) + parseInt(el.dataset.v,10));
  save(); render();
};

/* ---------------- food picker ---------------- */
ACTS.addFood = (el) => openFoodPicker(el && el.dataset.slot ? el.dataset.slot : slotForNow());
function openFoodPicker(slot){
  let q = '', group = '';
  const groups = [...new Set(DB.foods.map(f => f.group))];
  const listHtml = () => {
    const t = q.trim().toLowerCase();
    let list = DB.foods.filter(f => (!group || f.group === group) &&
      (!t || f.name.toLowerCase().includes(t)));
    list = list.sort((a,b) => a.name < b.name ? -1 : 1).slice(0, 200);
    const freq = (!t && !group) ? frequentFoods(6) : [];
    const row = f => '<button class="lrow slim" data-pick="' + f.id + '">' +
      '<span class="grow" style="min-width:0"><span class="ln trunc" style="display:block">' + esc(f.name) + '</span>' +
      '<span class="lm num">' + esc(f.unit) + ' · ' + f.kcal + ' kcal · ' + f.p + 'P ' + f.c + 'C ' + f.f + 'F</span></span>' +
      '<span style="width:17px;color:var(--ink-3)">' + I.plus + '</span></button>';
    return (freq.length ? '<div class="eyebrow" style="margin-bottom:6px">Your usual</div><div class="stack-sm" style="margin-bottom:12px">' +
        freq.map(row).join('') + '</div><div class="eyebrow" style="margin-bottom:6px">Library</div>' : '') +
      (list.length ? '<div class="stack-sm">' + list.map(row).join('') + '</div>'
        : '<div class="empty">' + I.search + '<h4>Not in the library</h4>' +
          '<div class="tiny">Add it once and it is yours from then on.</div></div>');
  };
  openSheet({
    title:'Log food', sub: slot + ' · ' + fmtDate(fDate(),'long'),
    body:'<div class="stack">' +
      '<div class="searchwrap">' + I.search +
        '<input class="inp" id="fq" data-focus placeholder="Search food" autocomplete="off"></div>' +
      '<div class="pillrow" id="fg"><button class="chip on" data-g="">All</button>' +
        groups.map(g => '<button class="chip" data-g="' + esc(g) + '">' + esc(g) + '</button>').join('') + '</div>' +
      '<div id="fList">' + listHtml() + '</div>' +
    '</div>',
    foot:'<button class="btn btn-block" id="fNew">' + I.plus + ' Create custom food</button>',
    mount(root, inst){
      const wire = () => root.querySelectorAll('[data-pick]').forEach(b => b.onclick = () => {
        inst.close(); openQtySheet(foodById(b.dataset.pick), slot);
      });
      const paint = () => { root.querySelector('#fList').innerHTML = listHtml(); wire(); };
      root.querySelector('#fq').addEventListener('input', e => { q = e.target.value; paint(); });
      root.querySelectorAll('#fg [data-g]').forEach(b => b.onclick = () => {
        group = b.dataset.g;
        root.querySelectorAll('#fg [data-g]').forEach(x => x.classList.toggle('on', x === b));
        paint();
      });
      root.querySelector('#fNew').onclick = () => { inst.close(); newFood(f => openQtySheet(f, slot)); };
      wire();
    }
  });
}
function openQtySheet(food, slot, existing){
  if (!food && !existing) return;
  let qty = existing ? existing.qty : 1;
  const src = food || existing;
  const calc = () => ({ kcal: src.kcal*qty, p: src.p*qty, c: src.c*qty, f: src.f*qty, fib: (src.fib||0)*qty });
  openSheet({
    title: src.name, sub: (existing ? 'Edit entry · ' : '') + esc(src.unit) + ' per serving',
    body:'<div class="stack">' +
      (existing && existing.img ? '<img class="scanimg" src="' + existing.img + '" alt="Photo of this meal">' : '') +
      '<div class="field"><label>Servings</label>' +
        '<div class="stepper"><button data-s="-1" aria-label="Less">−</button>' +
        '<input class="setinp" id="qv" type="number" step="0.25" inputmode="decimal" value="' + qty + '" style="text-align:center">' +
        '<button data-s="1" aria-label="More">+</button></div></div>' +
      '<div class="row wrap" style="gap:6px">' + [0.5,1,1.5,2,3].map(v =>
        '<button class="chip" data-q="' + v + '">' + v + '</button>').join('') + '</div>' +
      '<div class="field"><label>Meal</label><select class="inp" id="qs">' +
        SLOTS.map(s => '<option' + ((existing ? existing.slot : slot) === s ? ' selected' : '') + '>' + s + '</option>').join('') +
      '</select></div>' +
      '<div class="panel pad grid2" id="qOut"></div>' +
    '</div>',
    foot:(existing ? '<button class="btn btn-hot" id="qDel" aria-label="Delete entry">' + I.trash + '</button>' : '') +
         '<button class="btn grow" id="qC">Cancel</button>' +
         '<button class="btn btn-pri grow" id="qS">' + (existing ? 'Save' : 'Add') + '</button>',
    mount(root, inst){
      const paint = () => {
        const m = calc();
        root.querySelector('#qOut').innerHTML =
          '<div><div class="tl eyebrow">Calories</div><div class="num" style="font-size:21px">' + num(m.kcal,0) + '</div></div>' +
          '<div class="tiny num" style="line-height:1.7">' +
            'Protein <b>' + num(m.p,1) + ' g</b><br>Carbs <b>' + num(m.c,1) + ' g</b><br>' +
            'Fat <b>' + num(m.f,1) + ' g</b><br>Fibre <b>' + num(m.fib,1) + ' g</b></div>';
        root.querySelector('#qv').value = qty;
      };
      root.querySelectorAll('[data-s]').forEach(b => b.onclick = () => {
        qty = Math.max(0.25, +(qty + 0.25*(+b.dataset.s)).toFixed(2)); paint();
      });
      root.querySelectorAll('[data-q]').forEach(b => b.onclick = () => { qty = +b.dataset.q; paint(); });
      root.querySelector('#qv').addEventListener('input', e => { qty = Math.max(0, parseFloat(e.target.value)||0); paint(); });
      root.querySelector('#qC').onclick = () => inst.close();
      if (root.querySelector('#qDel')) root.querySelector('#qDel').onclick = () => {
        DB.meals = DB.meals.filter(m => m.id !== existing.id);
        save(); inst.close(); render(); toast('Entry removed');
      };
      root.querySelector('#qS').onclick = () => {
        if (qty <= 0){ toast('Servings must be more than zero'); return; }
        const s = root.querySelector('#qs').value;
        if (existing){
          existing.qty = qty; existing.slot = s;
        } else {
          DB.meals.push({ id: uid('m'), date: fDate(), slot: s, foodId: src.id, name: src.name,
            unit: src.unit, qty, kcal: src.kcal, p: src.p, c: src.c, f: src.f, fib: src.fib||0 });
        }
        save(); inst.close(); render();
        toast(existing ? 'Entry updated' : src.name + ' logged');
      };
      paint();
    }
  });
}
ACTS.editMeal = (el) => {
  const m = DB.meals.find(x => x.id === el.dataset.v);
  if (m) openQtySheet(null, m.slot, m);
};
ACTS.quickMacro = () => {
  openSheet({
    title:'Quick macros', sub:'When you already know the numbers',
    body:'<div class="stack">' +
      '<div class="field"><label>Label</label><input class="inp" id="qmN" data-focus placeholder="e.g. Restaurant chicken plate"></div>' +
      '<div class="grid2">' +
        '<div class="field"><label>Protein (g)</label><input class="inp num" id="qmP" type="number" inputmode="decimal" value="0"></div>' +
        '<div class="field"><label>Carbs (g)</label><input class="inp num" id="qmC" type="number" inputmode="decimal" value="0"></div>' +
        '<div class="field"><label>Fat (g)</label><input class="inp num" id="qmF" type="number" inputmode="decimal" value="0"></div>' +
        '<div class="field"><label>Calories</label><input class="inp num" id="qmK" type="number" inputmode="numeric" placeholder="auto"></div>' +
      '</div>' +
      '<div class="field"><label>Meal</label><select class="inp" id="qmS">' +
        SLOTS.map(s => '<option' + (s === slotForNow() ? ' selected' : '') + '>' + s + '</option>').join('') + '</select></div>' +
      '<div class="tiny dim">Leave calories blank and it is computed as 4/4/9 from the macros.</div>' +
      '<label class="row tiny" style="gap:8px"><input type="checkbox" id="qmSave"> Also save to my food library</label>' +
    '</div>',
    foot:'<button class="btn grow" id="qmC2">Cancel</button><button class="btn btn-pri grow" id="qmOk">Log it</button>',
    mount(root, inst){
      root.querySelector('#qmC2').onclick = () => inst.close();
      root.querySelector('#qmOk').onclick = () => {
        const p = parseFloat(root.querySelector('#qmP').value)||0;
        const c = parseFloat(root.querySelector('#qmC').value)||0;
        const f = parseFloat(root.querySelector('#qmF').value)||0;
        let k = parseFloat(root.querySelector('#qmK').value);
        if (!isFinite(k)) k = p*4 + c*4 + f*9;
        const name = root.querySelector('#qmN').value.trim() || 'Quick entry';
        if (!p && !c && !f && !k){ toast('Enter at least one number'); return; }
        let foodId = null;
        if (root.querySelector('#qmSave').checked){
          const nf = { id: uid('f'), name, unit:'1 serving', kcal:Math.round(k), p, c, f, fib:0, group:'Prepared', custom:true };
          DB.foods.push(nf); foodId = nf.id;
        }
        DB.meals.push({ id: uid('m'), date: fDate(), slot: root.querySelector('#qmS').value, foodId,
          name, unit:'1 serving', qty:1, kcal:Math.round(k), p, c, f, fib:0 });
        save(); inst.close(); render(); toast(name + ' logged');
      };
    }
  });
};
function newFood(then){
  openSheet({
    title:'Create food',
    body:'<div class="stack">' +
      '<div class="field"><label>Name</label><input class="inp" id="nfN" data-focus placeholder="e.g. My protein pancakes"></div>' +
      '<div class="grid2">' +
        '<div class="field"><label>Serving label</label><input class="inp" id="nfU" placeholder="100 g / 1 scoop / 1 bar" value="1 serving"></div>' +
        '<div class="field"><label>Group</label><input class="inp" id="nfG" value="Prepared" list="fgroups">' +
          '<datalist id="fgroups">' + [...new Set(DB.foods.map(f => f.group))].map(g => '<option>' + esc(g) + '</option>').join('') + '</datalist></div>' +
      '</div>' +
      '<div class="grid2">' +
        '<div class="field"><label>Calories</label><input class="inp num" id="nfK" type="number" inputmode="numeric" placeholder="auto"></div>' +
        '<div class="field"><label>Protein (g)</label><input class="inp num" id="nfP" type="number" inputmode="decimal" value="0"></div>' +
        '<div class="field"><label>Carbs (g)</label><input class="inp num" id="nfC" type="number" inputmode="decimal" value="0"></div>' +
        '<div class="field"><label>Fat (g)</label><input class="inp num" id="nfF" type="number" inputmode="decimal" value="0"></div>' +
      '</div>' +
      '<div class="field"><label>Fibre (g)</label><input class="inp num" id="nfFib" type="number" inputmode="decimal" value="0"></div>' +
    '</div>',
    foot:'<button class="btn grow" id="nfC2">Cancel</button><button class="btn btn-pri grow" id="nfOk">Create</button>',
    mount(root, inst){
      root.querySelector('#nfC2').onclick = () => inst.close();
      root.querySelector('#nfOk').onclick = () => {
        const name = root.querySelector('#nfN').value.trim();
        if (!name){ toast('Give it a name'); return; }
        const p = parseFloat(root.querySelector('#nfP').value)||0;
        const c = parseFloat(root.querySelector('#nfC').value)||0;
        const f = parseFloat(root.querySelector('#nfF').value)||0;
        let k = parseFloat(root.querySelector('#nfK').value);
        if (!isFinite(k)) k = Math.round(p*4 + c*4 + f*9);
        const nf = { id: uid('f'), name, unit: root.querySelector('#nfU').value.trim() || '1 serving',
          kcal: Math.round(k), p, c, f, fib: parseFloat(root.querySelector('#nfFib').value)||0,
          group: root.querySelector('#nfG').value.trim() || 'Prepared', custom:true };
        DB.foods.push(nf); save(); inst.close();
        toast(name + ' added to your library');
        if (then) then(nf); else render();
      };
    }
  });
}
ACTS.foodLib = () => {
  const custom = DB.foods.filter(f => f.custom);
  openSheet({
    title:'Food library', sub: DB.foods.length + ' foods · ' + custom.length + ' of them yours',
    body:'<div class="stack">' +
      (custom.length ? '<div><div class="eyebrow" style="margin-bottom:6px">Your foods</div><div class="stack-sm">' +
        custom.map(f => '<div class="lrow slim"><span class="grow" style="min-width:0">' +
          '<span class="ln trunc" style="display:block">' + esc(f.name) + '</span>' +
          '<span class="lm num">' + esc(f.unit) + ' · ' + f.kcal + ' kcal</span></span>' +
          '<button class="icon-btn bare" data-del="' + f.id + '" aria-label="Delete">' + I.trash + '</button></div>').join('') +
        '</div></div>'
        : '<div class="tiny dim">You have not added any custom foods yet. Anything you create shows up here.</div>') +
    '</div>',
    foot:'<button class="btn btn-pri btn-block" id="lNew">' + I.plus + ' Create food</button>',
    mount(root, inst){
      root.querySelectorAll('[data-del]').forEach(b => b.onclick = () => {
        DB.foods = DB.foods.filter(f => f.id !== b.dataset.del);
        save(); inst.close(); toast('Food removed from library (logged entries kept)');
      });
      root.querySelector('#lNew').onclick = () => { inst.close(); newFood(null); };
    }
  });
};
ACTS.copyDay = () => {
  const days = [...new Set(DB.meals.map(m => m.date))].filter(d => d !== fDate()).sort().reverse().slice(0,14);
  if (!days.length){ toast('No other day has food logged yet'); return; }
  openSheet({
    title:'Copy a day', sub:'Bring every item from another day into ' + fmtDate(fDate(),'long'),
    body:'<div class="stack-sm">' + days.map(d => {
      const m = dayMacros(d);
      return '<button class="lrow slim" data-d="' + d + '"><span class="grow">' +
        '<span class="ln" style="display:block">' + fmtDate(d,'dow') + '</span>' +
        '<span class="lm num">' + num(m.kcal,0) + ' kcal · ' + num(m.p,0) + 'P ' + num(m.c,0) + 'C ' + num(m.f,0) + 'F</span></span>' +
        '<span class="lv dim">' + mealsOn(d).length + ' items</span></button>';
    }).join('') + '</div>',
    mount(root, inst){
      root.querySelectorAll('[data-d]').forEach(b => b.onclick = () => {
        mealsOn(b.dataset.d).forEach(m => DB.meals.push(Object.assign({}, m, { id: uid('m'), date: fDate() })));
        save(); inst.close(); render(); toast('Day copied');
      });
    }
  });
};
</script>

<script>
/* ============================================================
   VIEW — Goals
   ============================================================ */
function goalSubtitle(g){
  const t = GOAL_TYPES[g.type];
  if (!t) return '';
  if (g.type === 'lift' || g.type === 'liftw') return t.n + ' · ' + exName(g.exId);
  if (g.type === 'sets') return t.n + ' · ' + MUSCLES[g.muscle].n;
  if (g.type === 'measure') return t.n + ' · ' + (MEASURE_FIELDS.find(f => f[0] === g.site)||['','site'])[1];
  return t.n;
}
function goalColor(g){
  if (g.type === 'lift' || g.type === 'liftw') return AREA_COLOR[exArea(g.exId)] || 'var(--acc)';
  if (g.type === 'sets') return AREA_COLOR[MUSCLES[g.muscle].area];
  return 'var(--acc)';
}
function goalCard(g){
  const r = goalPct(g), pace = goalPace(g);
  const hit = r.pct >= 100;
  const col = hit ? 'var(--good)' : goalColor(g);
  return '<div class="goal' + (hit ? ' hit' : '') + '">' +
    '<div class="row" style="gap:13px;align-items:flex-start">' +
      ring(r.pct, 62, 7, col, null, num(r.pct,0) + '%') +
      '<div class="grow" style="min-width:0">' +
        '<div class="between" style="align-items:flex-start">' +
          '<div style="min-width:0"><div class="goal-t trunc">' + esc(g.title) + '</div>' +
          '<div class="mini dim trunc">' + esc(goalSubtitle(g)) + '</div></div>' +
          '<button class="icon-btn bare" data-act="editGoal" data-v="' + g.id + '" aria-label="Edit goal">' + I.edit + '</button>' +
        '</div>' +
        '<div class="row" style="gap:9px;margin-top:8px">' +
          '<span class="num" style="font-size:17px;font-weight:600">' + goalDisp(g, r.cur) + '</span>' +
          '<span class="tiny dim">of ' + goalDisp(g, g.target) + ' ' + goalUnitLabel(g) + '</span>' +
        '</div>' +
      '</div>' +
    '</div>' +
    pbar(r.pct, hit ? 'done' : (pace && !pace.ahead ? 'late' : '')) +
    '<div class="goal-scale"><span>' + goalDisp(g, g.start) + '</span><span>' + goalDisp(g, g.target) + '</span></div>' +
    '<div class="row between wrap" style="gap:6px">' +
      (hit ? '<span class="chip pr">' + I.trophy + ' Achieved</span>'
           : pace ? '<span class="pace ' + (pace.ahead ? 'delta up' : 'delta dn') + '">' +
              (pace.daysLeft < 0 ? 'Deadline passed' : pace.daysLeft + ' days left · ' +
              (pace.ahead ? 'ahead of pace' : 'behind pace')) + '</span>'
           : '<span class="tiny dim">No deadline</span>') +
      '<span class="tiny dim">since ' + fmtDate(g.created) + '</span>' +
    '</div>' +
    (g.note ? '<div class="tiny muted">' + esc(g.note) + '</div>' : '') +
  '</div>';
}

const GOAL_SUGGEST = [
  { type:'freq',    title:'Train 5 times a week', target:5,   start:0 },
  { type:'protein', title:'Hit protein every day', target:null, start:0 },
  { type:'sets',    title:'20 hard sets a week for side delts', muscle:'sdelt', target:20, start:0 },
  { type:'habit',   title:'100 sessions logged',   target:100, start:0 }
];

VIEWS.goals = function(){
  const active = DB.goals.filter(g => goalPct(g).pct < 100);
  const done = DB.goals.filter(g => goalPct(g).pct >= 100);
  let out =
  '<div class="between"><div><div class="eyebrow">Goals</div><h1>What you are chasing</h1></div>' +
    '<button class="btn btn-pri" data-act="newGoal">' + I.plus + ' New</button></div>';

  if (!DB.goals.length){
    out += '<div class="empty">' + I.goals + '<h4>No goals yet</h4>' +
      '<div class="tiny">A goal reads straight from your log — set the target once and every session updates the bar.</div></div>' +
      '<div class="sec"><span class="eyebrow">Start with one of these</span></div><div class="stack-sm">' +
      GOAL_SUGGEST.map((s,i) => '<button class="lrow" data-act="suggestGoal" data-v="' + i + '">' +
        '<span style="width:17px;color:var(--acc-hi)">' + I.star + '</span>' +
        '<span class="grow"><span class="ln" style="display:block">' + esc(s.title) + '</span>' +
        '<span class="lm">' + GOAL_TYPES[s.type].hint + '</span></span>' +
        '<span style="width:17px;color:var(--ink-3)">' + I.plus + '</span></button>').join('') +
      '</div>';
    return out;
  }

  if (active.length){
    out += '<div class="sec"><span class="eyebrow">In progress · ' + active.length + '</span></div>' +
      '<div class="stack">' + active.map(goalCard).join('') + '</div>';
  }
  if (done.length){
    out += '<div class="sec"><span class="eyebrow">Achieved · ' + done.length + '</span></div>' +
      '<div class="stack">' + done.map(goalCard).join('') + '</div>';
  }
  out += '<div class="panel pad tiny muted">Every goal is computed from your log — nothing here is typed in twice. ' +
    'Lift goals read your best estimated 1RM, volume and set goals read the current 7-day window, ' +
    'and nutrition goals read your 7-day average.</div>';
  return out;
};

ACTS.newGoal = () => goalEditor(null);
ACTS.editGoal = (el) => { const g = DB.goals.find(x => x.id === el.dataset.v); if (g) goalEditor(g); };
ACTS.openGoal = (el) => { const g = DB.goals.find(x => x.id === el.dataset.v); if (g) goalEditor(g); };
ACTS.suggestGoal = (el) => {
  const s = GOAL_SUGGEST[+el.dataset.v];
  const g = { id: uid('g'), title: s.title, type: s.type, created: today(), deadline:'', note:'',
              start: 0, target: s.target, muscle: s.muscle };
  if (s.type === 'protein'){ g.target = DB.profile.targets.p; g.start = 0; }
  const cur = goalCurrent(g);
  if (cur != null && cur < g.target) g.start = 0;
  DB.goals.push(g); save(); render(); toast('Goal added');
};

function goalEditor(existing){
  const g = existing
    ? Object.assign({}, existing)
    : { id: uid('g'), title:'', type:'lift', created: today(), deadline:'', note:'',
        start:0, target:0, exId: DB.exercises[0].id, area:'Chest', muscle:'chest', site:'arm' };

  const conv = {
    toStore: v => { const t = GOAL_TYPES[g.type];
      return t.unit === 'w' ? U.toKg(v) : t.unit === 'l' ? U.lenToStore(v) : v; },
    toShow: v => { const t = GOAL_TYPES[g.type];
      return v == null ? '' : num(t.unit === 'w' ? U.toDisp(v) : t.unit === 'l' ? U.lenToDisp(v) : v, 1); }
  };

  const body = () => {
    const t = GOAL_TYPES[g.type];
    let extra = '';
    if (g.type === 'lift' || g.type === 'liftw'){
      extra = '<div class="field"><label>Exercise</label>' +
        '<button class="btn btn-block" id="gEx" style="justify-content:space-between">' +
        '<span class="trunc">' + esc(exName(g.exId)) + '</span>' + I.chev + '</button></div>';
    } else if (g.type === 'sets'){
      extra = '<div class="field"><label>Muscle</label><select class="inp" id="gMus">' +
        MUSCLE_KEYS.map(k => '<option value="' + k + '"' + (g.muscle===k?' selected':'') + '>' + MUSCLES[k].n + '</option>').join('') +
        '</select></div>';
    } else if (g.type === 'measure'){
      extra = '<div class="field"><label>Site</label><select class="inp" id="gSite">' +
        MEASURE_FIELDS.map(([k,n]) => '<option value="' + k + '"' + (g.site===k?' selected':'') + '>' + n + '</option>').join('') +
        '</select></div>';
    }
    const cur = goalCurrent(g);
    const unitL = goalUnitLabel(g);
    return '<div class="stack">' +
      '<div class="field"><label>What is the goal</label>' +
        '<input class="inp" id="gT" data-focus value="' + esc(g.title) + '" placeholder="e.g. 500 lb deadlift"></div>' +
      '<div class="field"><label>Measured as</label><select class="inp" id="gType">' +
        Object.keys(GOAL_TYPES).map(k => '<option value="' + k + '"' + (g.type===k?' selected':'') + '>' + GOAL_TYPES[k].n + '</option>').join('') +
      '</select><div class="tiny dim" style="margin-top:4px">' + t.hint + '</div></div>' +
      extra +
      '<div class="grid2">' +
        '<div class="field"><label>Starting point' + (unitL ? ' (' + unitL + ')' : '') + '</label>' +
          '<input class="inp num" id="gS" type="number" step="0.5" inputmode="decimal" value="' + conv.toShow(g.start) + '"></div>' +
        '<div class="field"><label>Target' + (unitL ? ' (' + unitL + ')' : '') + '</label>' +
          '<input class="inp num" id="gG" type="number" step="0.5" inputmode="decimal" value="' + conv.toShow(g.target) + '"></div>' +
      '</div>' +
      '<div class="panel pad row between tiny">' +
        '<span class="muted">Right now you are at</span>' +
        '<b class="num">' + (cur == null ? 'no data yet' : goalDisp(g, cur) + ' ' + unitL) + '</b>' +
      '</div>' +
      (cur != null ? '<button class="btn btn-sm" id="gUseCur">Use that as my starting point</button>' : '') +
      '<div class="field"><label>Deadline (optional)</label>' +
        '<input class="inp" id="gD" type="date" value="' + esc(g.deadline||'') + '"></div>' +
      '<div class="field"><label>Note (optional)</label>' +
        '<textarea class="inp" id="gN" placeholder="Why this target, or how you plan to get there">' + esc(g.note||'') + '</textarea></div>' +
    '</div>';
  };

  openSheet({
    title: existing ? 'Edit goal' : 'New goal',
    body: body(),
    foot:(existing ? '<button class="btn btn-hot" id="gDel" aria-label="Delete goal">' + I.trash + '</button>' : '') +
         '<button class="btn grow" id="gC">Cancel</button>' +
         '<button class="btn btn-pri grow" id="gS2">' + (existing ? 'Save' : 'Create goal') + '</button>',
    mount(root, inst){
      const grab = () => {
        g.title = root.querySelector('#gT').value;
        const s = parseFloat(root.querySelector('#gS').value);
        const t2 = parseFloat(root.querySelector('#gG').value);
        g.start = isFinite(s) ? conv.toStore(s) : 0;
        g.target = isFinite(t2) ? conv.toStore(t2) : 0;
        g.deadline = root.querySelector('#gD').value;
        g.note = root.querySelector('#gN').value;
      };
      const repaint = () => {
        root.querySelector('.sheet-b').innerHTML = body();
        wire();
      };
      const wire = () => {
        root.querySelector('#gType').onchange = e => { grab(); g.type = e.target.value; repaint(); };
        const ex = root.querySelector('#gEx');
        if (ex) ex.onclick = () => { grab(); openExPicker(id => { g.exId = id; repaint(); }, { title:'Pick the lift' }); };
        const mu = root.querySelector('#gMus'); if (mu) mu.onchange = e => { g.muscle = e.target.value; repaint(); };
        const si = root.querySelector('#gSite'); if (si) si.onchange = e => { g.site = e.target.value; repaint(); };
        const uc = root.querySelector('#gUseCur');
        if (uc) uc.onclick = () => {
          grab();
          const cur = goalCurrent(g);
          if (cur != null){ g.start = cur; repaint(); toast('Starting point set to today'); }
        };
      };
      wire();
      root.querySelector('#gC').onclick = () => inst.close();
      const del = root.querySelector('#gDel');
      if (del) del.onclick = () => {
        inst.close();
        confirmSheet({ title:'Delete goal', msg:'Remove "' + g.title + '"? Your training data is untouched.',
          yes:'Delete', danger:true }, () => {
            DB.goals = DB.goals.filter(x => x.id !== g.id); save(); render(); toast('Goal deleted');
          });
      };
      root.querySelector('#gS2').onclick = () => {
        grab();
        if (!g.title.trim()){ toast('Name the goal'); return; }
        if (!isFinite(g.target) || g.target === 0){ toast('Set a target number'); return; }
        g.title = g.title.trim();
        const i = DB.goals.findIndex(x => x.id === g.id);
        if (i >= 0) DB.goals[i] = g; else DB.goals.push(g);
        save(); inst.close(); render();
        toast(existing ? 'Goal updated' : 'Goal set — go get it');
      };
    }
  });
}
</script>

<script>
/* ============================================================
   VIEW — History
   ============================================================ */
let histArea = '';
VIEWS.history = function(){
  let list = doneSessions().slice().reverse();
  if (histArea) list = list.filter(s => {
    const m = sessionMuscle(s), a = areaTotals(m.sets);
    return a[histArea] > 0;
  });
  let out =
  '<div><div class="eyebrow">History</div><h1>Every session</h1></div>' +
  '<div class="panel pad stack-sm">' + heatmap(18) +
    '<div class="row between tiny dim"><span>Last 18 weeks</span>' +
    '<span>' + doneSessions().length + ' sessions · ' + streak() + '-day streak</span></div></div>' +
  '<div class="pillrow"><button class="chip ' + (histArea===''?'on':'') + '" data-act="histArea" data-v="">All</button>' +
    AREAS.map(a => '<button class="chip ' + (histArea===a?'on':'') + '" data-act="histArea" data-v="' + a + '">' + a + '</button>').join('') +
  '</div>';

  if (!list.length){
    return out + '<div class="empty">' + I.history + '<h4>Nothing logged' + (histArea ? ' for ' + histArea : '') + '</h4>' +
      '<div class="tiny">Finished sessions land here permanently.</div></div>';
  }

  let month = '';
  out += '<div class="stack-sm">';
  list.forEach(s => {
    const d = parseDate(s.date);
    const mk = MON[d.getMonth()] + ' ' + d.getFullYear();
    if (mk !== month){
      month = mk;
      const inMonth = list.filter(x => { const y = parseDate(x.date); return MON[y.getMonth()] + ' ' + y.getFullYear() === mk; });
      out += '<div class="sec" style="margin-top:8px"><span class="eyebrow">' + mk + '</span>' +
        '<span class="tiny dim num">' + inMonth.length + ' sessions · ' + sum(inMonth, sessionWorkSets) + ' hard sets</span></div>';
    }
    const m = sessionMuscle(s), a = areaTotals(m.sets);
    const top = AREAS.filter(x => a[x] > 0).sort((x,y) => a[y]-a[x]).slice(0,3);
    out += '<button class="lrow" data-act="openSession" data-v="' + s.id + '">' +
      '<span class="exbar" style="background:' + (AREA_COLOR[top[0]] || 'var(--acc)') + '"></span>' +
      '<span class="grow" style="min-width:0">' +
        '<span class="ln trunc" style="display:block">' + esc(s.name) + '</span>' +
        '<span class="lm">' + fmtDate(s.date,'dow') + ' · ' + sessionWorkSets(s) + ' sets · ' + top.join(', ') + '</span>' +
      '</span>' +
      '<span class="col" style="align-items:flex-end;gap:2px">' +
        '<span class="lv">' + sessionWorkSets(s) + '</span>' +
        '<span class="mini dim">sets</span>' +
      '</span>' +
    '</button>';
  });
  out += '</div>';
  return out;
};
ACTS.histArea = (el) => { histArea = el.dataset.v; render(); };
ACTS.openSession = (el) => openSessionSheet(el.dataset.v);

function openSessionSheet(id){
  const s = DB.sessions.find(x => x.id === id); if (!s) return;
  const m = sessionMuscle(s), a = areaTotals(m.sets);
  const mx = Math.max.apply(null, AREAS.map(x => a[x])) || 1;
  const top = sessionTop(s);
  const body =
    '<div class="stack">' +
      '<div class="grid3">' +
        '<div class="tile"><div class="tl">Exercises</div><div class="tv" style="font-size:19px">' + (s.entries||[]).length + '</div></div>' +
        '<div class="tile"><div class="tl">Hard sets</div><div class="tv" style="font-size:19px">' + sessionWorkSets(s) + '</div></div>' +
        '<div class="tile"><div class="tl">Reps</div><div class="tv" style="font-size:19px">' + sessionReps(s) + '</div></div>' +
      '</div>' +
      (s.bwKg ? '<div class="tiny dim">Bodyweight that day: ' + U.wu(s.bwKg,1) + '</div>' : '') +
      (top ? '<div class="panel pad tiny"><span class="eyebrow">Top lift</span><div style="margin-top:3px">' +
        esc(exName(top.exId)) + ' — ' + U.w(top.w,1) + ' × ' + top.r + ' · ' + U.w(top.v,1) + ' e1RM</div></div>' : '') +
      '<div><div class="eyebrow" style="margin-bottom:7px">Sets by area</div><div class="stack-sm">' +
        AREAS.filter(x => a[x] > 0).map(x => '<div class="mvrow"><div class="mvn">' + x + '</div>' +
          '<div class="mvb"><i style="width:' + (a[x]/mx*100).toFixed(0) + '%;background:' + AREA_COLOR[x] + '"></i></div>' +
          '<div class="mvv">' + num(a[x],1) + '</div></div>').join('') + '</div></div>' +
      '<div><div class="eyebrow" style="margin-bottom:7px">Set log</div><div class="stack-sm">' +
        (s.entries||[]).map(en => {
          const ex = exById(en.exId);
          return '<div class="panel pad">' +
            '<div class="row between" style="margin-bottom:6px">' +
              '<button class="sec-link trunc" data-ex="' + en.exId + '">' + esc(exName(en.exId)) + '</button>' +
              '<span class="tag">' + (ex ? MUSCLES[ex.primary].n : '') + '</span></div>' +
            '<div class="row wrap num tiny" style="gap:5px">' +
              (en.sets||[]).map(st => '<span class="chip" style="font-family:var(--f-num)">' +
                U.w(+st.w,1) + ' × ' + st.r + (st.t === 'w' ? ' W' : st.t === 'd' ? ' D' : st.t === 'f' ? ' A' : '') +
                '</span>').join('') +
            '</div>' +
            (en.note ? '<div class="tiny dim" style="margin-top:6px">' + esc(en.note) + '</div>' : '') +
          '</div>';
        }).join('') + '</div></div>' +
      (s.notes ? '<div><div class="eyebrow" style="margin-bottom:5px">Notes</div>' +
        '<div class="panel pad tiny muted">' + esc(s.notes) + '</div></div>' : '');
  openSheet({
    title: s.name, sub: fmtDate(s.date,'long'),
    body,
    foot:'<button class="btn btn-hot" id="sDel" aria-label="Delete session">' + I.trash + '</button>' +
         '<button class="btn grow" id="sRep">' + I.copy + ' Repeat this</button>' +
         '<button class="btn btn-pri grow" id="sOk">Done</button>',
    mount(root, inst){
      root.querySelectorAll('[data-ex]').forEach(b => b.onclick = () => { inst.close(); openExSheet(b.dataset.ex); });
      root.querySelector('#sOk').onclick = () => inst.close();
      root.querySelector('#sRep').onclick = () => {
        if (DB.active){ toast('Finish the session in progress first'); return; }
        inst.close(); repeatSession(s);
      };
      root.querySelector('#sDel').onclick = () => {
        inst.close();
        confirmSheet({ title:'Delete session', msg:'Remove this session from your history? Records and charts will recompute without it.',
          yes:'Delete', danger:true }, () => {
            DB.sessions = DB.sessions.filter(x => x.id !== s.id); save(); render(); toast('Session deleted');
          });
      };
    }
  });
}

<script>
/* ============================================================
   CLOUD — Supabase
   ------------------------------------------------------------
   Paste your project URL and anon key below, host this file
   anywhere static, and the app gets real email/password accounts,
   cross-device sync and a live coach.

   Leave them blank and everything below is inert: the app stays
   local-only, which is what it does inside a Claude Artifact
   (the artifact sandbox blocks outbound requests, so the cloud
   path cannot run there).

   The anon key is meant to be public — row-level security in
   schema.sql is what keeps one account out of another's data.
   ============================================================ */
const SUPA = {
  url:  '',                 // e.g. 'https://abcdefgh.supabase.co'
  anon: ''                  // your project's anon/public key
};

/* ------------------------------------------------------------
   Runtime config — set from Coach setup inside the app, so a
   hosted copy never needs the file edited.

   Kept in its own storage key, deliberately outside DB: keys
   never reach your ledger, your backup file or the cloud row.
------------------------------------------------------------ */
const CFG_KEY = 'ironledger.cfg';
const MODELS = [
  { id:'claude-opus-5',   n:'Opus 5',   d:'Best answers. Pennies a question at this length.' },
  { id:'claude-sonnet-5', n:'Sonnet 5', d:'Cheaper and quicker, still good for coaching' },
  { id:'claude-haiku-4-5', n:'Haiku 4.5', d:'Cheapest. Fine for straightforward questions' }
];
let CFG = { coach:'off', anthropicKey:'', model:'claude-opus-5', supaUrl:'', supaAnon:'',
            coachId:'heavy', coachNames:{} };
function loadCfg(){
  try {
    const raw = localStorage.getItem(CFG_KEY);
    if (raw) CFG = Object.assign(CFG, JSON.parse(raw));
  } catch(e){}
  if (CFG.supaUrl && CFG.supaAnon){ SUPA.url = CFG.supaUrl; SUPA.anon = CFG.supaAnon; }
}
function saveCfg(){
  try { localStorage.setItem(CFG_KEY, JSON.stringify(CFG)); } catch(e){}
  SUPA.url = CFG.supaUrl || SUPA.url;
  SUPA.anon = CFG.supaAnon || SUPA.anon;
}
const coachMode = () =>
  CFG.coach === 'direct' && CFG.anthropicKey ? 'direct'
  : CFG.coach === 'proxy' && SUPA.url && SUPA.anon ? 'proxy'
  : 'off';
const cloudOn = () => !!(SUPA.url && SUPA.anon);

const SESSION_KEY = 'ironledger.session';
let SESSION = null;         // { access_token, refresh_token, expires_at, user:{id,email} }
let syncState = { at: null, pushing: false, pending: false, err: null, remoteAt: null };

function loadSession(){
  try { const r = localStorage.getItem(SESSION_KEY); if (r) SESSION = JSON.parse(r); } catch(e){}
}
function storeSession(s){
  SESSION = s;
  try { s ? localStorage.setItem(SESSION_KEY, JSON.stringify(s)) : localStorage.removeItem(SESSION_KEY); } catch(e){}
}
async function supaFetch(path, opts, noAuth){
  const o = opts || {};
  const headers = Object.assign({
    'apikey': SUPA.anon,
    'Content-Type': 'application/json'
  }, o.headers || {});
  if (!noAuth && SESSION && SESSION.access_token) headers.Authorization = 'Bearer ' + SESSION.access_token;
  const res = await fetch(SUPA.url.replace(/\/$/, '') + path, Object.assign({}, o, { headers }));
  const text = await res.text();
  let json = null;
  try { json = text ? JSON.parse(text) : null; } catch(e){ json = { raw: text }; }
  if (!res.ok){
    const msg = (json && (json.error_description || json.msg || json.message || json.error)) || ('HTTP ' + res.status);
    const err = new Error(msg); err.status = res.status; err.body = json;
    throw err;
  }
  return json;
}
function sessionFromAuth(j){
  return { access_token: j.access_token, refresh_token: j.refresh_token,
           expires_at: Date.now() + (j.expires_in || 3600) * 1000,
           user: { id: j.user && j.user.id, email: j.user && j.user.email } };
}
async function refreshIfNeeded(){
  if (!SESSION || !SESSION.refresh_token) return false;
  if (SESSION.expires_at && Date.now() < SESSION.expires_at - 60000) return true;
  try {
    const j = await supaFetch('/auth/v1/token?grant_type=refresh_token',
      { method:'POST', body: JSON.stringify({ refresh_token: SESSION.refresh_token }) }, true);
    storeSession(sessionFromAuth(j));
    return true;
  } catch(e){
    /* a dead refresh token means sign in again; a dropped connection does not.
       Clearing on every failure was signing people out for being offline. */
    if (e && (e.status === 400 || e.status === 401)) storeSession(null);
    return false;
  }
}
async function cloudSignUp(email, password){
  const j = await supaFetch('/auth/v1/signup',
    { method:'POST', body: JSON.stringify({ email, password }) }, true);
  if (j.access_token){ storeSession(sessionFromAuth(j)); return { confirmed:true }; }
  return { confirmed:false };            // project has email confirmation switched on
}
async function cloudSignIn(email, password){
  const j = await supaFetch('/auth/v1/token?grant_type=password',
    { method:'POST', body: JSON.stringify({ email, password }) }, true);
  storeSession(sessionFromAuth(j));
}
async function cloudSignOut(){
  try { await supaFetch('/auth/v1/logout', { method:'POST' }); } catch(e){}
  storeSession(null);
  syncState = { at:null, pushing:false, pending:false, err:null, remoteAt:null };
}
async function cloudResetPassword(email){
  await supaFetch('/auth/v1/recover', { method:'POST', body: JSON.stringify({ email }) }, true);
}

/* one row per account holding the whole ledger — the app already
   treats its data as a single document, so this keeps sync simple
   and atomic instead of scattering it over fifteen tables */
async function cloudPull(){
  if (!await refreshIfNeeded()) return null;
  const rows = await supaFetch('/rest/v1/ledgers?select=data,updated_at&limit=1');
  if (!rows || !rows.length) return null;
  syncState.remoteAt = rows[0].updated_at;
  return rows[0];
}
async function cloudPush(){
  if (!cloudOn() || !SESSION) return;
  if (syncState.pushing){ syncState.pending = true; return; }
  syncState.pushing = true; syncState.err = null;
  try {
    if (!await refreshIfNeeded()) throw new Error('Session expired — sign in again');
    const payload = { user_id: SESSION.user.id, data: exportable(), updated_at: new Date().toISOString() };
    await supaFetch('/rest/v1/ledgers?on_conflict=user_id', {
      method:'POST',
      headers: { 'Prefer': 'resolution=merge-duplicates,return=minimal' },
      body: JSON.stringify(payload)
    });
    syncState.at = Date.now(); syncState.remoteAt = payload.updated_at;
  } catch(e){
    syncState.err = e.message;
  } finally {
    syncState.pushing = false;
    if (syncState.pending){ syncState.pending = false; setTimeout(cloudPush, 400); }
    else updateSyncPill();
  }
}
/* the ledger minus anything device-specific */
function exportable(){
  const c = JSON.parse(JSON.stringify(DB));
  if (c.profile){ delete c.profile.passHash; delete c.profile.lockOnOpen; }
  delete c.active;
  return c;
}
let pushT = null;
function cloudQueue(){
  if (!cloudOn() || !SESSION) return;
  clearTimeout(pushT);
  pushT = setTimeout(cloudPush, 1500);
  updateSyncPill();
}
function updateSyncPill(){
  const el = document.getElementById('syncPill');
  if (!el) return;
  const s = syncState;
  const label = !cloudOn() ? ''
    : !SESSION ? 'Not signed in'
    : s.err ? 'Sync failed'
    : s.pushing || pushT ? 'Saving…'
    : s.at ? 'Synced'
    : 'Ready';
  el.textContent = label;
  el.className = 'chip ' + (s.err ? 'pr' : (SESSION && s.at ? 'on' : ''));
  el.title = s.err ? s.err : (s.at ? 'Last synced ' + new Date(s.at).toLocaleTimeString() : '');
}

/* ============================================================
   Account: email, password, profile photo

   Local only. There is no server behind this page, so the password
   gates the app on this device and nothing more — it is not
   encryption and it does not protect the stored data. The hash just
   keeps the plaintext out of your backup file.
   ============================================================ */
async function hashPass(s){
  const txt = 'ironledger:' + s;
  try {
    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(txt));
    return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2,'0')).join('');
  } catch(e){
    let h = 2166136261;                                  // FNV-1a where subtle crypto is unavailable
    for (let i = 0; i < txt.length; i++){ h ^= txt.charCodeAt(i); h = Math.imul(h, 16777619); }
    return 'fnv' + (h >>> 0).toString(16);
  }
}
const emailLooksValid = e => /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test((e||'').trim());

function avatar(size, cls){
  const p = DB.profile;
  const s = size || 38;
  if (p.photo) return '<img class="avatar ' + (cls||'') + '" src="' + p.photo + '" alt="" ' +

  const initials = (p.name || 'A').trim().split(/\s+/).slice(0,2).map(w => w[0]).join('').toUpperCase();
  return '<span class="avatar avatar-i ' + (cls||'') + '" style="width:' + s + 'px;height:' + s + 'px;' +
    'font-size:' + Math.round(s*0.4) + 'px" aria-hidden="true">' + esc(initials) + '</span>';
}

ACTS.accountSheet = () => openAccountSheet();

      '</div>' +
      (st.err ? '<div class="tiny" style="color:var(--warn)">' + esc(st.err) + '</div>' : '') +

      '<div class="field"><label>Email</label>' +
        '<input class="inp" id="acEmail" type="email" inputmode="email" autocomplete="email" ' +

      '<div class="grid2">' +
        '<div class="field"><label>' + (p.passHash ? 'New password' : 'Password') + '</label>' +
          '<input class="inp" id="acPw" type="password" autocomplete="new-password" placeholder="' +
          (p.passHash ? 'leave blank to keep' : 'at least 6 characters') + '"></div>' +

      (p.passHash
        ? '<label class="row tiny" style="gap:9px;align-items:flex-start">' +
            '<input type="checkbox" id="acLock"' + (p.lockOnOpen ? ' checked' : '') + ' style="margin-top:2px">' +
            '<span>Ask for my password when the app opens' +
            '<span class="mini dim" style="display:block">Off by default. There is always a way past it — ' +

        : '<div class="mini dim">Set a password and you can optionally have the app ask for it on open.</div>') +
      '<div class="panel pad mini muted">This account lives on this device. Without a server there is no ' +
        'cross-device sign-in and no password reset — use Export backup to move your log. The password is ' +
        'stored as a hash, so it is not sitting in your backup in plain text, but it is not protecting the data.</div>' +
    '</div>';

  openSheet({
    title:'Account', sub:'Your identity on this device',
    body: body(),
    foot:'<button class="btn grow" data-a="cancel">Cancel</button>' +
         '<button class="btn btn-pri grow" data-a="save">Save</button>',
    mount(root, inst){
      const repaint = () => { root.querySelector('.sheet-b').innerHTML = body(); wire(); };
      const wire = () => {
        const fi = root.querySelector('#acPhoto');
        if (fi) fi.onchange = e => {
          const f = e.target.files && e.target.files[0];

/* ============================================================
   Meal photos + macro estimate parsing

   The page cannot run vision inference itself — the artifact CSP
   blocks every outbound request. So the loop is: shoot the photo
   here, hand it to Claude with a prompt that pins the reply format,
   paste the reply back, and the parser turns it into log entries.
   ============================================================ */
const SCAN_PROMPT =
  'Estimate the macros in this photo of my meal.\n\n' +
  'Reply with ONLY one line per food and no other text, in exactly this format:\n' +
  'name | grams | kcal | protein_g | carbs_g | fat_g\n\n' +
  'Example:\n' +
  'Grilled chicken breast | 220 | 363 | 68 | 0 | 8\n' +
  'White rice, cooked | 250 | 325 | 7 | 70 | 1\n\n' +
  'Estimate portion sizes from the photo. Do not add totals, notes or commentary.';

/* downscale to a thumbnail so the log can hold months of photos */
function photoThumb(file, maxPx, quality){
  return new Promise((resolve, reject) => {
    if (!file || !/^image\//.test(file.type)) return reject(new Error('not an image'));
    const fr = new FileReader();
    fr.onerror = () => reject(new Error('could not read that file'));
    fr.onload = () => {
      const im = new Image();
      im.onerror = () => reject(new Error('could not decode that image'));
      im.onload = () => {
        const scale = Math.min(1, (maxPx || 240) / Math.max(im.width, im.height));
        const w = Math.max(1, Math.round(im.width * scale));
        const h = Math.max(1, Math.round(im.height * scale));
        const cv = document.createElement('canvas');
        cv.width = w; cv.height = h;
        cv.getContext('2d').drawImage(im, 0, 0, w, h);
        try { resolve(cv.toDataURL('image/jpeg', quality || 0.55)); }
        catch(e){ reject(new Error('could not compress that image')); }
      };
      im.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}
const n0 = v => { const x = parseFloat(v); return isFinite(x) ? x : 0; };

function parseMacroReply(text){
  const out = [];
  const raw = (text || '').trim();
  if (!raw) return out;

  /* a JSON reply, if Claude gave one */
  if (/^[\[{]/.test(raw)){
    try {
      const j = JSON.parse(raw);
      const arr = Array.isArray(j) ? j : Array.isArray(j.items) ? j.items : Array.isArray(j.foods) ? j.foods : [j];
      arr.forEach(o => {
        const name = o.name || o.food || o.item;
        if (!name) return;
        out.push({ name: String(name).slice(0,60), grams: n0(o.grams != null ? o.grams : o.g),
                   kcal: n0(o.kcal != null ? o.kcal : o.calories), p: n0(o.p != null ? o.p : o.protein),
                   c: n0(o.c != null ? o.c : o.carbs), f: n0(o.f != null ? o.f : o.fat) });
      });
      if (out.length) return out;
    } catch(e){ /* fall through to line parsing */ }
  }

  raw.split(/\r?\n/).forEach(line => {
    let s = line.trim();
    if (!s) return;
    if (/^[-=|+\s:]+$/.test(s)) return;                        // markdown separator row
    if (/^\|?\s*(name|food|item)\s*\|/i.test(s)) return;        // header row
    if (/^(total|totals|sum)\b/i.test(s)) return;               // ignore a totals line
    s = s.replace(/^[-*•]\s*/, '').replace(/^\d+[.)]\s*/, '');  // bullets / numbering

    /* delimited: the format the prompt asks for, plus markdown tables */
    const parts = s.split(/\s*[|;\t]\s*/).map(x => x.trim()).filter(x => x !== '');
    if (parts.length >= 5){
      const name = parts[0];
      const nums = parts.slice(1).map(x => parseFloat(String(x).replace(/[^0-9.\-]/g, '')));
      let grams = 0, kcal, p, c, f;
      if (parts.length >= 6) { grams = nums[0]; kcal = nums[1]; p = nums[2]; c = nums[3]; f = nums[4]; }
      else { kcal = nums[0]; p = nums[1]; c = nums[2]; f = nums[3]; }
      if (isFinite(kcal) && name && !/^\d+$/.test(name)){
        out.push({ name: name.slice(0,60), grams: n0(grams), kcal: n0(kcal), p: n0(p), c: n0(c), f: n0(f) });
        return;
      }
    }

    /* prose fallback: "Chicken breast 250g — 410 kcal, 77g protein, 0g carbs, 9g fat" */
    const grab = re => { const m = s.match(re); return m ? parseFloat(m[1]) : null; };
    const kcal = grab(/(\d+(?:\.\d+)?)\s*(?:kcal|calories|cals?\b)/i);
    const p = grab(/(\d+(?:\.\d+)?)\s*g?\s*(?:protein)/i);
    const c = grab(/(\d+(?:\.\d+)?)\s*g?\s*(?:carb(?:ohydrate)?s?)/i);
    const f = grab(/(\d+(?:\.\d+)?)\s*g?\s*(?:fat)/i);
    if (kcal != null || p != null){
      let name = s.split(/[—–:]|\s-\s/)[0]
        .replace(/[\d.]+\s*(?:g|kg|oz|kcal|cal).*$/i, '')
        .replace(/[,;:\s\-–—]+$/, '')                          // no trailing punctuation
        .trim();
      if (!name || /^\d/.test(name)) name = 'Item';
      /* a portion in grams, but never the "19g protein" figure */
      const grams = grab(/(\d+(?:\.\d+)?)\s*g\b(?!\s*(?:of\s+)?(?:protein|carb|fat))/i);
      out.push({ name: name.slice(0,60), grams: n0(grams), kcal: n0(kcal),
                 p: n0(p), c: n0(c), f: n0(f) });
    }
  });
  return out;
}

        };
        root.querySelectorAll('[data-k]').forEach(inp => inp.oninput = () => {

            if (!st.items.length) return;
            const sel = root.querySelector('#scanSlot');
            const slotV = sel ? sel.value : st.slot;
            st.items.forEach((it, i) => {

                src: 'scan',

              });
            });
            save(); inst.close(); render();
            toast(st.items.length + ' item' + (st.items.length===1?'':'s') + ' logged from the photo');
          }
        });
      };
      wire();
    }
  });
}

let chat = [];              // { role:'user'|'assistant', text }

function coachContext(){

      (p.heightCm ? ', height ' + (p.unit === 'kg' ? num(p.heightCm,0) + ' cm'
        : (() => { const q = ftInParts(p.heightCm); return q.ft + "'" + num(q.inch,0) + '"'; })()) : ''),
    'Phase: ' + (p.phase || 'not set') + ', activity multiplier ' + (p.activity || 1.6),
    'Daily targets: ' + t.kcal + ' kcal, ' + t.p + ' g protein, ' + t.c + ' g carbs, ' + t.f + ' g fat',
    avg ? 'Actual 7-day average: ' + num(avg.kcal,0) + ' kcal, ' + num(avg.p,0) + ' g protein, ' +
      num(avg.c,0) + ' g carbs, ' + num(avg.f,0) + ' g fat (over ' + avg.days + ' logged days)'
      : 'No food logged in the last 7 days',

    'Every working set is 2 sets of 6-8 reps.',

    sets.length ? 'Hard sets per muscle this week: ' + sets.join(', ') : 'No sets logged this week',
    prs.length ? 'Best estimated 1RMs: ' + prs.map(x => x.e.name + ' ' + U.w(x.pr.e1rm,0) + ' ' + p.unit).join('; ')

const COACH_SYSTEM =

  'Be direct and concrete: give the number, the change to make, and why. Keep it under 200 words unless asked for more. ' +

/* ------------------------------------------------------------
   Coaches — eight archetypes, each a real school of thought
   rather than a real person. The prompt is what makes them
   differ; the avatar is drawn from the `look` parameters.
------------------------------------------------------------ */
/* ------------------------------------------------------------
   The roster: eight schools of training, each named for the
   lifter who made it famous.

   `infl` is a factual credit — Tom Platz really did build his
   legs on high-rep squats, Mentzer really did argue for brief
   infrequent training. What these are NOT is those men talking:
   each one is an original coaching character trained on the
   documented method, the avatars are drawn from parameters
   rather than anyone's face, and every prompt is told to say so

/* straight to the Anthropic API from the page. Your key stays in this
   browser's storage — it is never in the file, so hosting the file
   publicly does not expose it. Anyone with this device can read it. */
async function askDirect(question, history){
  const res = await fetch('https://api.anthropic.com/v1/messages', {
    method:'POST',
    headers: {
      'x-api-key': CFG.anthropicKey,
      'anthropic-version': '2023-06-01',
      /* without this the browser is refused outright — the API blocks direct
         calls from a page unless you opt in to it explicitly */
      'anthropic-dangerous-direct-browser-access': 'true',
      'Content-Type': 'application/json'
    },
    body: JSON.stringify({
      model: CFG.model || 'claude-opus-5',
      /* Thinking is on by default on these models and thinking tokens count
         against max_tokens, so a tight cap returns an empty answer rather than
         a short one. Give it room and keep the replies short with low effort
         plus the word limit in the system prompt. */
      max_tokens: 4000,
      output_config: { effort: 'low' },
      system: systemFor(),
      messages: history.concat([{ role:'user',
        content: 'My current training data:\n' + coachContext() + '\n\nQuestion: ' + question }])
    })
  });
  const j = await res.json().catch(() => null);
  if (!res.ok){
    const m = (j && j.error && j.error.message) || ('HTTP ' + res.status);
    if (res.status === 401) throw new Error('That API key was rejected — check it in Coach setup.');
    if (res.status === 429) throw new Error('Rate limited. Give it a minute and ask again.');
    if (res.status === 400 && /credit|balance/i.test(m)) throw new Error('Your API account is out of credit.');
    throw new Error(m);
  }
  /* a refusal comes back as a normal 200 with nothing in content */
  if (j && j.stop_reason === 'refusal')
    throw new Error('The model declined that one. If it was about pain, medication or bloodwork, ' +
                    'that is a question for a doctor rather than a coach.');
  const text = (j.content || []).filter(b => b.type === 'text').map(b => b.text).join('\n').trim();
  if (!text) throw new Error('The model returned nothing. Try asking again.');
  return j.stop_reason === 'max_tokens' ? text + '\n\n(cut off there — ask me to carry on)' : text;
}
async function askProxy(question, history){
  if (!SESSION) throw new Error('Sign in first to use the coach.');
  if (!await refreshIfNeeded()) throw new Error('Session expired — sign in again');
  const j = await supaFetch('/functions/v1/ask', {
    method:'POST',
    body: JSON.stringify({ question, context: coachContext(), system: systemFor(), history })
  });
  return (j && (j.reply || j.text)) || 'No answer came back.';
}
function sandboxHint(msg){
  return /Failed to fetch|NetworkError|Load failed/i.test(msg || '')
    ? 'The request was blocked. If you are on the Claude Artifact link, that copy is sandboxed and cannot reach ' +
      'the internet — host the file yourself and the coach works. Otherwise check your connection.'
    : msg;
}
async function coachAsk(question){
  const mode = coachMode();
  if (mode === 'off'){ openAskSheet(question); return; }
  /* Only real turns go back as history: an error bubble is ours, not the
     model's, and the API rejects two user messages in a row. */
  const history = [];
  chat.filter(m => !m.err).forEach(m => {
    const role = m.role === 'user' ? 'user' : 'assistant';
    if (history.length && history[history.length-1].role === role) history.pop();
    history.push({ role, content: m.text });
  });
  while (history.length && history[0].role !== 'user') history.shift();
  while (history.length && history[history.length-1].role === 'user') history.pop();
  history.splice(0, Math.max(0, history.length - 8));            /* keep it cheap */
  while (history.length && history[0].role !== 'user') history.shift();
  chat.push({ role:'user', text: question });
  chatBusy = true; render();
  try {
    const reply = mode === 'direct' ? await askDirect(question, history) : await askProxy(question, history);
    chat.push({ role:'assistant', text: reply || 'No answer came back.' });
  } catch(e){
    chat.push({ role:'assistant', text: sandboxHint(e.message), err:true });
  }
  chatBusy = false; render();
  setTimeout(() => {
    const l = document.querySelector('#chatLog');
    if (l) l.scrollTop = l.scrollHeight;
  }, 30);
}

/* no server: hand the question and context over for pasting into Claude */
/* No key, no server, no cost: copy the question and your numbers straight into
   whichever assistant you already pay for. The two buttons prefill a new chat
   by URL, and the text is put on the clipboard first — a long context can
   exceed what a browser will carry in a query string, and pasting always
   works. This is the honest answer to "without an API". */
function openAskSheet(question){
  const q = (question || '').trim();
  const full = coachContext() + '\n\nQuestion: ' + q;
  const prompt = systemFor().split('\n')[0] + '\n\n' + full;
  const open = (base) => {
    const url = base + encodeURIComponent(prompt);
    /* ~6k of URL is where browsers start truncating; fall back to a bare chat
       and let the clipboard carry it */
    window.open(url.length < 6000 ? url : base.replace(/[?&][a-z]+=$/, ''), '_blank', 'noopener');
  };
  openSheet({
    title:'Ask without a key', sub:'Your numbers, packaged up',
    body:'<div class="stack">' +
      '<div class="tiny muted">The coach is not switched on, so this hands the question to an assistant you ' +
        'already have open instead. It carries your split, your sets, your lifts and your macros, so the ' +
        'answer is about you rather than about lifters in general. Nothing is sent from here — the button ' +
        'just opens a new chat with the text in it, and it is on your clipboard either way.</div>' +
      '<div class="row" style="gap:8px">' +
        '<button class="btn grow" data-a="gpt">Open in ChatGPT</button>' +
        '<button class="btn grow" data-a="cl">Open in Claude</button>' +
      '</div>' +
      '<pre class="scanprompt" id="askBlob" style="max-height:220px">' + esc(full) + '</pre>' +
    '</div>',
    foot:'<button class="btn grow" data-a="c">Close</button>' +
         '<button class="btn btn-pri grow" data-a="copy">' + I.copy + ' Copy it all</button>',
    mount(root, inst){
      const copy = async (msg) => {
        try { await navigator.clipboard.writeText(prompt); toast(msg || 'Copied'); return true; }
        catch(e){
          const pre = root.querySelector('#askBlob');
          const rng = document.createRange(); rng.selectNodeContents(pre);
          const sel = getSelection(); sel.removeAllRanges(); sel.addRange(rng);
          toast('Selected — copy with your keyboard');
          return false;
        }
      };
      root.querySelector('[data-a="c"]').onclick = () => inst.close();
      root.querySelector('[data-a="copy"]').onclick = () => copy('Copied — paste it into any assistant');
      root.querySelector('[data-a="gpt"]').onclick = async () => {
        await copy('Copied too, in case it is trimmed');
        open('https://chatgpt.com/?q=');
      };
      root.querySelector('[data-a="cl"]').onclick = async () => {
        await copy('Copied too, in case it is trimmed');
        open('https://claude.ai/new?q=');
      };
    }
  });
}

      (live ? I.chat + ' Ask the coach' : I.copy + ' Package this question') + '</button>' +
  '</div>';

  out += '<div class="sec"><span class="eyebrow">Common questions</span></div>' +
    '<div class="stack-sm">' + COACH_PROMPTS.map(q =>
      '<button class="lrow slim" data-act="chatQuick" data-q="' + esc(q) + '">' +

        '<span style="width:17px;color:var(--ink-3)">' + I.chev + '</span></button>').join('') + '</div>';

  out += '<div class="sec"><span class="eyebrow">What the coach can see</span></div>' +
    '<div class="panel pad"><pre class="scanprompt" style="max-height:170px">' + esc(coachContext()) + '</pre>' +
    '<div class="mini dim" style="margin-top:7px">Only this summary is sent — never your photos or your backup.</div></div>';

  out += '<div class="panel pad mini muted">General training and nutrition guidance, not medical advice. ' +
    'For pain, injury, medication or bloodwork, talk to a doctor or physio.</div>';
  return out;
};

/* ============================================================
   Backup: export / restore
   ============================================================ */
function backupBlobName(){
  return 'iron-ledger-' + today() + '.json';
}
async function exportData(){
  const json = JSON.stringify(DB, null, 1);
  DB.meta.lastBackup = today(); saveNow();
  let saved = false;
  try {
    const dl = window.claude && window.claude.use ? await window.claude.use('downloads') : null;
    if (dl){
      await dl.save({ filename: backupBlobName(), data: json });
      saved = true;
    }
  } catch(e){ saved = false; }
  if (!saved){
    try {
      const url = URL.createObjectURL(new Blob([json], { type:'application/json' }));
      const a = document.createElement('a');
      a.href = url; a.download = backupBlobName();
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 4000);
      saved = true;
    } catch(e){ saved = false; }
  }
  openSheet({
    title: saved ? 'Backup ready' : 'Copy your backup',
    sub: saved ? backupBlobName() : 'Downloads are blocked here — copy this text and save it yourself',
    body:'<div class="stack">' +
      (saved ? '<div class="panel pad tiny muted">Saved as <b>' + backupBlobName() + '</b>. ' +
        'Keep it somewhere you will find it — restoring is one paste away.</div>' : '') +
      '<div class="field"><label>Backup contents (' + num(json.length/1024,1) + ' KB)</label>' +
      '<textarea class="inp" id="bkT" style="min-height:150px;font-family:var(--f-num);font-size:11px" readonly>' + esc(json) + '</textarea></div>' +
      '<button class="btn btn-block" id="bkCopy">' + I.copy + ' Copy to clipboard</button>' +
    '</div>',
    mount(root, inst){
      root.querySelector('#bkCopy').onclick = async () => {
        const ta = root.querySelector('#bkT');
        try { await navigator.clipboard.writeText(ta.value); toast('Backup copied'); }
        catch(e){ ta.select(); toast('Select-all done — press copy on your keyboard'); }
      };
    }
  });
  render();
}
ACTS.exportData = () => exportData();
ACTS.importData = () => {
  openSheet({
    title:'Restore from a backup',
    sub:'This replaces everything currently on this device',
    body:'<div class="stack">' +
      '<div class="field"><label>Pick a backup file</label>' +
        '<input class="inp" id="imF" type="file" accept="application/json,.json"></div>' +
      '<div class="field"><label>…or paste the backup text</label>' +
        '<textarea class="inp" id="imT" style="min-height:120px;font-family:var(--f-num);font-size:11px" placeholder="{ &quot;v&quot;: 1, … }"></textarea></div>' +
      '<div class="panel pad tiny" style="color:var(--warn)">Restoring overwrites your current log. Export first if you have anything you want to keep.</div>' +
    '</div>',
    foot:'<button class="btn grow" id="imC">Cancel</button><button class="btn btn-pri grow" id="imOk">Restore</button>',
    mount(root, inst){
      let fileText = '';
      root.querySelector('#imF').onchange = e => {
        const f = e.target.files && e.target.files[0];
        if (!f) return;
        const r = new FileReader();
        r.onload = () => { fileText = String(r.result || ''); toast('File read — press Restore'); };
        r.onerror = () => toast('Could not read that file');
        r.readAsText(f);
      };
      root.querySelector('#imC').onclick = () => inst.close();
      root.querySelector('#imOk').onclick = () => {
        const raw = (root.querySelector('#imT').value.trim() || fileText).trim();
        if (!raw){ toast('Pick a file or paste the backup text'); return; }
        let p;
        try { p = JSON.parse(raw); } catch(e){ toast('That is not valid backup JSON'); return; }
        if (!p || !p.profile || !Array.isArray(p.exercises)){ toast('That file is not an Iron Ledger backup'); return; }
        DB = p; hydrate(); saveNow();
        applyTheme(); locked = false; inst.close(); go('today');
        toast('Restored — ' + (DB.sessions||[]).length + ' sessions back in the book');
      };
    }
  });
};

   ============================================================ */
function boot(){
  load();
  loadCfg();
  loadSession();
  /* The lock screen is gone for good. Any PIN left on an old record is
     cleared so it can never gate the app again. */
  if (DB.profile.pin){ DB.profile.pin = ''; saveNow(); }
  locked = false;
  signedIn = deviceTrusted();          /* trusted device: do not ask again */
  applyTheme();
  checkStorage();
  /* Ask the browser not to evict this origin. Without it a browser is free to
     clear localStorage under pressure or after a period of not visiting, which
     is what makes an app like this ask you to set it up again out of nowhere. */
  if (navigator.storage && navigator.storage.persist)
    navigator.storage.persisted().then(ok => ok || navigator.storage.persist()).catch(() => {});
  render();
  maybeWelcome();
  if (cloudOn() && SESSION) cloudPull().then(row => {
    /* adopt the account copy when it is newer than this device */
    if (row && row.data && row.data.profile && row.updated_at) {
      const localAt = DB.meta && DB.meta.syncedAt;
      if (!localAt || row.updated_at > localAt) { DB = row.data; hydrate(); saveNow(); render(); }
    }
    updateSyncPill();
  }).catch(() => updateSyncPill());
  window.addEventListener('beforeunload', saveNow);
  document.addEventListener('visibilitychange', () => { if (document.hidden) saveNow(); });
}
